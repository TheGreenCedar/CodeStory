[package]
name = "codestory-runtime"
version = "0.17.4"
edition = "2024"

[features]
benchmark-support = []
proof-qualification-support = ["codestory-agent/proof-qualification-support"]
v3-evidence-separation-support = ["codestory-agent/v3-evidence-separation-support"]
# The runtime test hooks now partly live in codestory-agent (fresh_index_observation
# moved with packet_freshness), so turning this on has to turn the agent crate's
# hooks on too. Only dev/test edges enable it; no product build does.
test-support = ["codestory-agent/test-support"]

[dependencies]
anyhow = { workspace = true }
codestory-agent = { workspace = true }
codestory-contracts = { workspace = true }
codestory-indexer = { workspace = true }
codestory-retrieval = { workspace = true }
codestory-store = { workspace = true }
codestory-workspace = { workspace = true }
crossbeam-channel = { workspace = true }
nucleo-matcher = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tantivy = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
codestory-agent = { workspace = true, features = ["test-support"] }
codestory-retrieval = { workspace = true, features = ["test-support"] }
codestory-workspace = { workspace = true, features = ["test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }

[package]
name = "codestory-agent"
version = "0.17.4"
edition = "2024"

[features]
# Compiles the eval/holdout probe hooks for downstream unit tests. No product
# build enables it.
test-support = ["dep:serde_json_canonicalizer", "dep:sha2"]
# Compiles the sealed proof-qualification facade for codestory-bench. No
# product dependency enables it.
proof-qualification-support = ["dep:serde_json_canonicalizer", "dep:sha2"]
# Compiles only the dark v3 evidence planner needed by the Q1 separability
# gate. It has no proof-kernel edge and registers no product surface.
v3-evidence-separation-support = ["dep:serde_json_canonicalizer"]

[dependencies]
codestory-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

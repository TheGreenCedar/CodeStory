[package]
name = "codestory-retrieval"
version = "0.17.4"
edition = "2024"

[features]
test-support = []
# Measurement-only surface for the offline vector-backend bake-off. No product
# binary enables this.
benchmark-support = []
# Development-only capture of the dense lane before abstention. This exists so
# calibration can observe the full candidate window through the real embedding
# and retrieval path; no product binary enables it.
semantic-calibration-support = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
codestory-contracts = { workspace = true }
codestory-llama-sys = { workspace = true }
codestory-store = { workspace = true }
codestory-workspace = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]

[[example]]
name = "semantic_abstention_capture"
required-features = ["semantic-calibration-support"]

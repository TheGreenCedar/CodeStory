[package]
name = "codestory-llama-sys"
version = "0.16.3"
edition = "2024"
build = "build.rs"

[dependencies]
codestory-contracts = { workspace = true }
crossbeam-channel = { workspace = true }
llama-cpp-sys-2 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
fs4 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The native staging test target compiles the build-script source directly, so
# it needs the same raw lock dependency the build script has.
fs4 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["metal"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
llama-cpp-2 = { workspace = true, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "linux")))'.dependencies]
llama-cpp-2 = { workspace = true }

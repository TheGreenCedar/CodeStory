interface:
  display_name: "CodeStory Grounding"
  short_description: "Ground local repositories through CodeStory MCP before source claims, edits, reviews, or test planning."
  default_prompt: "Use search for discovery leads, context for one selected target, packet for broad evidence with at most one continuation, and prove_call_path only for a complete host-supplied typed contract. Preserve unknown as uncertainty, not absence, and never claim runtime execution from structural proof. Pass the target repository's absolute root as project."
dependencies:
  tools:
    - type: "mcp"
      value: "codestory"
      description: "CodeStory plugin MCP server for local repository grounding, status, graph navigation, packets, and search."
      transport: "stdio"
policy:
  allow_implicit_invocation: true

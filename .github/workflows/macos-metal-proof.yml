name: macOS Apple Silicon Metal proof

on:
  workflow_call:
    inputs:
      version:
        description: CodeStory version to prove.
        required: true
        type: string
      ref:
        description: Git ref to check out. Defaults to the caller SHA.
        required: false
        type: string
      proof_key:
        description: Stable PR, integration, or release identity for cancellation.
        required: false
        default: ""
        type: string
      use_packaged_cli_artifact:
        description: Download the macOS arm64 package artifact produced by packaged-platform-proof.
        required: false
        default: false
        type: boolean
      quality_evidence_artifact:
        description: Exact-head release-evidence artifact containing packet/packet-runtime-summary.json.
        required: false
        default: ""
        type: string
      calibration_bundle_artifact:
        description: Frozen calibration bundle artifact name.
        required: false
        default: ""
        type: string
      calibration_bundle_run_id:
        description: Workflow run that produced the frozen calibration bundle artifact.
        required: false
        default: ""
        type: string
      calibration_mode:
        description: Collect three independent pre-freeze Metal calibration runs.
        required: false
        default: false
        type: boolean
      candidate_installed_proof:
        description: Install and prove the exact package through the candidate-managed launcher boundary.
        required: false
        default: false
        type: boolean
      candidate_producer_workflow_path:
        description: Top-level workflow path authenticated as the candidate artifact producer.
        required: false
        default: ".github/workflows/packaged-platform-pr.yml"
        type: string
      server_behavior_only:
        description: Prove bounded package retrieval readiness without answer-quality or performance claims.
        required: false
        default: false
        type: boolean
      emit_release_cells:
        description: Emit the authenticated protected-hardware cell for production release closeout.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: CodeStory version to prove.
        required: true
        type: string
      ref:
        description: Git ref to check out. Defaults to the current SHA.
        required: false
        type: string
      proof_key:
        description: Stable proof identity for cancellation.
        required: false
        type: string
      quality_evidence_artifact:
        description: Existing exact-head release-evidence artifact name.
        required: false
        type: string
      calibration_bundle_artifact:
        description: Frozen calibration bundle artifact name.
        required: false
        default: ""
        type: string
      calibration_bundle_run_id:
        description: Workflow run that produced the frozen calibration bundle artifact.
        required: false
        default: ""
        type: string
      calibration_mode:
        description: Collect three independent pre-freeze Metal calibration runs.
        required: false
        default: false
        type: boolean
      candidate_installed_proof:
        description: Install and prove the exact package through the candidate-managed launcher boundary.
        required: false
        default: false
        type: boolean
      candidate_producer_workflow_path:
        description: Top-level workflow path authenticated as the candidate artifact producer.
        required: false
        default: ".github/workflows/macos-metal-proof.yml"
        type: string
      server_behavior_only:
        description: Prove bounded package retrieval readiness without answer-quality or performance claims.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-metal-proof-${{ inputs.proof_key || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-metal:
    name: Packaged Apple Silicon Metal engine
    runs-on: [self-hosted, macOS, ARM64, codestory-metal]
    # Configure this environment with release protection rules and restrict the
    # matching self-hosted runner/runner group to this evidence workflow.
    environment: macos-metal-release
    timeout-minutes: ${{ inputs.calibration_mode && 180 || 120 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Capture host evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/macos-metal-proof
          {
            sw_vers
            uname -a
            uname -m
            sysctl -n machdep.cpu.brand_string
            xcode-select -p
            node --version
            python3 --version
          } > target/macos-metal-proof/host.txt 2>&1
          test "$(uname -m)" = arm64
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          test "$macos_major" -ge 15

      - name: Validate candidate-installed mode
        if: inputs.candidate_installed_proof
        shell: bash
        env:
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
          CALIBRATION_MODE: ${{ inputs.calibration_mode }}
        run: |
          test "$SERVER_BEHAVIOR_ONLY" = true
          test "$CALIBRATION_MODE" = false

      - name: Install pinned Rust
        if: ${{ !inputs.use_packaged_cli_artifact || inputs.calibration_mode || !inputs.server_behavior_only }}
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Start Metal constant calibration clock
        if: inputs.calibration_mode
        id: calibration-clock
        shell: bash
        run: echo "started-ns=$(python3 -c 'import time; print(time.monotonic_ns())')" >> "$GITHUB_OUTPUT"

      - name: Prepare checksum-pinned embedded model
        id: model-prepare
        if: ${{ !inputs.use_packaged_cli_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          model_prepare_started_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          node scripts/prepare-embedded-model.mjs
          model_prepare_finished_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          echo "duration-ms=$(((model_prepare_finished_ns - model_prepare_started_ns) / 1000000))" \
            >> "$GITHUB_OUTPUT"

      - name: Build and package native CLI
        id: native-build-package
        if: ${{ !inputs.use_packaged_cli_artifact }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CALIBRATION_MODE: ${{ inputs.calibration_mode }}
        run: |
          set -euo pipefail
          build_package_started_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          version="${VERSION#v}"
          cargo_args=(
            -p codestory-cli
            --bin codestory-cli
            --bin codestory-cli-runtime
          )
          if [ "$CALIBRATION_MODE" = true ]; then
            cargo_args+=(
              -p codestory-bench
              --bin codestory_embedding_constant_calibration
            )
          fi
          cargo build --release --locked "${cargo_args[@]}"
          python3 .github/scripts/package-codestory-release.py \
            --version "$version" \
            --target macos-arm64 \
            --binary target/release/codestory-cli \
            --out-dir target/release-dist
          build_package_finished_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          echo "duration-ms=$(((build_package_finished_ns - build_package_started_ns) / 1000000))" \
            >> "$GITHUB_OUTPUT"

      - name: Download packaged CLI artifact
        if: inputs.use_packaged_cli_artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: codestory-cli-macos-arm64
        run: |
          set -euo pipefail
          artifact="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              | jq \
                --arg name "$ARTIFACT_NAME" \
                --arg sha "$GITHUB_SHA" \
                --argjson run_id "$GITHUB_RUN_ID" \
                '[
                  .artifacts[]
                  | select(
                      .name == $name
                      and .expired == false
                      and .workflow_run.id == $run_id
                      and .workflow_run.head_sha == $sha
                    )
                ] | sort_by(.created_at) | last'
          )"
          test "$artifact" != null

          artifact_id="$(jq -r '.id' <<<"$artifact")"
          expected_size="$(jq -r '.size_in_bytes' <<<"$artifact")"
          expected_digest="$(jq -r '.digest' <<<"$artifact")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$expected_size" =~ ^[0-9]+$ ]]
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          archive="$RUNNER_TEMP/$ARTIFACT_NAME-$artifact_id.zip"
          download_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
          rm -f "$archive"
          trap 'rm -f "$archive"' EXIT

          complete=false
          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 30 \
              --max-time 120 \
              --continue-at - \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$archive" \
              "$download_url"; then
              complete=true
              break
            fi

            current_size=0
            test ! -f "$archive" || current_size="$(stat -f %z "$archive")"
            test "$current_size" -le "$expected_size"
            if [ "$current_size" = "$expected_size" ]; then
              complete=true
              break
            fi
            echo "::warning title=macOS artifact transfer interrupted::Resuming $ARTIFACT_NAME at byte $current_size after attempt $attempt"
            sleep 2
          done
          test "$complete" = true

          actual_size="$(stat -f %z "$archive")"
          actual_digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual_size" = "$expected_size"
          test "$actual_digest" = "${expected_digest#sha256:}"
          printf 'artifact_id=%s artifact_bytes=%s artifact_digest=%s\n' \
            "$artifact_id" "$actual_size" "$expected_digest"

          mkdir -p target/release-dist
          ditto -x -k "$archive" target/release-dist

      - name: Build qualification driver
        if: ${{ !inputs.calibration_mode && !inputs.server_behavior_only }}
        shell: bash
        run: cargo build --release --locked -p codestory-bench --bin codestory_embedding_qualification

      - name: Download exact-head publishable packet quality evidence
        if: inputs.quality_evidence_artifact != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.quality_evidence_artifact }}
          path: target/release-quality-evidence

      - name: Produce exact-head holdout quality on protected Metal
        if: ${{ !inputs.calibration_mode && !inputs.server_behavior_only && inputs.quality_evidence_artifact == '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CODESTORY_EMBED_ALLOW_CPU: "0"
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          archive="target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz"
          quality_root=target/release-quality-evidence
          packaged_root="$(mktemp -d "$RUNNER_TEMP/codestory-quality-cli.XXXXXX")"
          export CODESTORY_CACHE_ROOT
          CODESTORY_CACHE_ROOT="$(mktemp -d "$RUNNER_TEMP/codestory-quality-cache.XXXXXX")"
          export CODESTORY_STDIO_CACHE_ROOT
          CODESTORY_STDIO_CACHE_ROOT="$(mktemp -d "$RUNNER_TEMP/codestory-quality-stdio.XXXXXX")"
          rm -rf "$quality_root"
          mkdir -p "$quality_root"
          tar -xzf "$archive" -C "$packaged_root"
          packaged_cli="$(
            find "$packaged_root" -type f -name codestory-cli -print
          )"
          test "$(printf '%s\n' "$packaged_cli" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          test -x "$packaged_cli"
          export CODESTORY_RELEASE_EVIDENCE_COMMIT
          CODESTORY_RELEASE_EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          export CODESTORY_RELEASE_EVIDENCE_TREE
          CODESTORY_RELEASE_EVIDENCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export CODESTORY_RELEASE_EVIDENCE_PROFILE=protected-macos-arm64-metal
          export CODESTORY_RELEASE_EVIDENCE_CORPUS_ID=codestory-release-corpus-v1
          export CODESTORY_RELEASE_EVIDENCE_CORPUS_CONTRACT=benchmarks/release-evidence/corpus-contracts/holdout-retrieval-v1.json
          export CODESTORY_RELEASE_EVIDENCE_CACHE_ID=frozen-candidate-holdout-v1
          export CODESTORY_RELEASE_EVIDENCE_MACHINE_FINGERPRINT
          CODESTORY_RELEASE_EVIDENCE_MACHINE_FINGERPRINT="$(
            shasum -a 256 target/macos-metal-proof/host.txt | awk '{print $1}'
          )"
          node scripts/codestory-agent-ab-benchmark.mjs \
            --packet-runtime \
            --packet-runtime-mode cold-cli \
            --task-suite holdout-retrieval \
            --materialize-repos \
            --repeats 3 \
            --publishable \
            --max-source-reads-after-packet 0 \
            --codestory-cli "$packaged_cli" \
            --timeout-ms 180000 \
            --out-dir "$quality_root/packet"

      - name: Upload exact-head protected Metal quality evidence
        if: ${{ !inputs.calibration_mode && !inputs.server_behavior_only && inputs.quality_evidence_artifact == '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frozen-candidate-quality-${{ inputs.ref || github.sha }}
          path: target/release-quality-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Authenticate calibration bundle producer
        if: ${{ !inputs.calibration_mode && !inputs.server_behavior_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID")"
          producer_sha="$(jq -r '.head_sha' <<<"$run")"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<<"$run")" = ".github/workflows/packaged-platform-pr.yml"
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$CALIBRATION_ARTIFACT" = "embedding-calibration-bundle-$producer_sha"
          artifact_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$CALIBRATION_ARTIFACT" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | length'
          )"
          test "$artifact_count" = 1

      - name: Download frozen calibration bundle
        if: ${{ !inputs.calibration_mode && !inputs.server_behavior_only }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.calibration_bundle_artifact }}
          path: target/calibration-bundle
          run-id: ${{ inputs.calibration_bundle_run_id }}
          github-token: ${{ github.token }}

      - name: Prove protected Metal runtime
        if: ${{ !inputs.calibration_mode && !inputs.candidate_installed_proof }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CODESTORY_EMBED_ALLOW_CPU: "0"
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          export TMPDIR="${RUNNER_TEMP}/codestory metal proof ü"
          mkdir -p "$TMPDIR"
          quality_args=()
          qualification_args=()
          calibration_args=()
          claim_scope_args=()
          quality_path="target/release-quality-evidence/packet/packet-runtime-summary.json"
          if [ "$SERVER_BEHAVIOR_ONLY" = true ]; then
            claim_scope_args=(--server-behavior-only)
          else
            calibration_bundle="$(find target/calibration-bundle -type f -name calibration-bundle.json -print)"
            test "$(printf '%s\n' "$calibration_bundle" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
            test -f "$quality_path"
            quality_args=(--retrieval-quality-evidence "$quality_path")
            qualification_args=(
              --produce-qualification-evidence
              --qualification-driver target/release/codestory_embedding_qualification
              --qualification-evidence target/macos-metal-proof/qualification.json
            )
            calibration_args=(
              --calibration-bundle "$calibration_bundle"
              --calibration-producer-run-id "$CALIBRATION_RUN_ID"
              --calibration-producer-artifact "$CALIBRATION_ARTIFACT"
            )
          fi
          python3 .github/scripts/check-packaged-agent-proof.py \
            --archive "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz" \
            --checksum-file "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz.sha256" \
            --expected-version "$version" \
            --project "${{ github.workspace }}" \
            --plugin-root plugins/codestory \
            --plugin-handoff \
            --engine-policy accelerated \
            --expected-backend Metal \
            --offline \
            --proof-tier protected_hardware \
            --qualification-matrix-cell protected_macos_arm64_metal \
            "${claim_scope_args[@]}" \
            "${qualification_args[@]}" \
            "${calibration_args[@]}" \
            --expected-source-sha "$source_sha" \
            --expected-source-tree "$source_tree" \
            "${quality_args[@]}" \
            --timeout-secs 1800 \
            --out-dir target/macos-metal-proof/packaged-agent

      - name: Collect three independent Metal constant calibration runs
        if: inputs.calibration_mode
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CODESTORY_EMBED_ALLOW_CPU: "0"
        run: |
          set -euo pipefail
          test "$(jq -r .status crates/codestory-llama-sys/per-user-embedding-server-constant-set.json)" = unfrozen
          version="${VERSION#v}"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          export TMPDIR="${RUNNER_TEMP}/codestory metal calibration ü"
          mkdir -p "$TMPDIR" target/calibration-runs/macos
          python3 .github/scripts/check-packaged-agent-proof.py \
            --archive "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz" \
            --checksum-file "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz.sha256" \
            --expected-version "$version" \
            --engine-policy accelerated \
            --expected-backend Metal \
            --offline \
            --proof-tier calibration \
            --qualification-matrix-cell protected_macos_arm64_metal \
            --collect-constant-calibration \
            --constant-calibration-output-dir target/calibration-runs/macos \
            --qualification-driver target/release/codestory_embedding_constant_calibration \
            --expected-source-sha "$source_sha" \
            --expected-source-tree "$source_tree" \
            --timeout-secs 1800 \
            --out-dir target/calibration-proof/macos

      - name: Publish Metal constant calibration timing
        if: inputs.calibration_mode
        shell: bash
        env:
          CALIBRATION_STARTED_NS: ${{ steps.calibration-clock.outputs.started-ns }}
          MODEL_PREPARATION_DURATION_MS: ${{ steps.model-prepare.outputs.duration-ms }}
          BUILD_PACKAGE_DURATION_MS: ${{ steps.native-build-package.outputs.duration-ms }}
        run: |
          set -euo pipefail
          timing_path=target/calibration-runs/macos/timing.json
          calibration_finished_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          [[ "$CALIBRATION_STARTED_NS" =~ ^[0-9]+$ ]]
          [[ "$MODEL_PREPARATION_DURATION_MS" =~ ^[0-9]+$ ]]
          [[ "$BUILD_PACKAGE_DURATION_MS" =~ ^[0-9]+$ ]]
          calibration_total_ms=$(((calibration_finished_ns - CALIBRATION_STARTED_NS) / 1000000))
          test "$calibration_total_ms" -ge 0
          test "$calibration_total_ms" -lt 600000
          test "$BUILD_PACKAGE_DURATION_MS" -ge 0
          jq -e '
            .schema_version == 1
            and all(
              [
                .archive_authentication_unpack_ms,
                .project_and_request_setup_ms,
                .measurement_ms,
                .retention_validation_ms,
                .end_to_end_ms
              ][];
              type == "number" and . >= 0
            )
          ' "$timing_path" >/dev/null
          {
            echo "### Metal constant calibration timing"
            echo
            echo "| Phase | Duration |"
            echo "|---|---:|"
            printf '| Model preparation | %s ms |\n' "$MODEL_PREPARATION_DURATION_MS"
            printf '| Shared CLI build and package | %s ms |\n' "$BUILD_PACKAGE_DURATION_MS"
            jq -r '
              [
                ["Archive authentication and unpack", .archive_authentication_unpack_ms],
                ["Project and request setup", .project_and_request_setup_ms],
                ["Measurement", .measurement_ms],
                ["Retention validation", .retention_validation_ms],
                ["Archive through retained evidence", .end_to_end_ms]
              ][]
              | "| \(.[0]) | \(.[1]) ms |"
            ' "$timing_path"
            printf '| Total calibration wall time | %s ms |\n' "$calibration_total_ms"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage isolated candidate-managed macOS install
        if: ${{ inputs.candidate_installed_proof && !inputs.calibration_mode }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CANDIDATE_PRODUCER_WORKFLOW_PATH"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .path <<<"$run_json")" = "$CANDIDATE_PRODUCER_WORKFLOW_PATH"
          test "$(jq -r .head_sha <<<"$run_json")" = "$(git rev-parse HEAD)"
          test "$(jq -r .run_attempt <<<"$run_json")" = "$GITHUB_RUN_ATTEMPT"
          version="${VERSION#v}"
          archive="target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz"
          candidate_root="$(mktemp -d "$RUNNER_TEMP/codestory-candidate-installed-macos.XXXXXX")"
          candidate_root="$(cd "$candidate_root" && pwd -P)"
          case "$candidate_root/" in
            "$GITHUB_WORKSPACE/"*)
              echo "::error::Candidate-managed root must be outside the source checkout."
              exit 1
              ;;
          esac
          echo "CODESTORY_CANDIDATE_MACOS_ROOT=$candidate_root" >> "$GITHUB_ENV"
          mkdir -p target/candidate-installed-macos
          python3 .github/scripts/check-packaged-agent-proof.py \
            --prepare-candidate-installed-proof \
            --archive "$archive" \
            --checksum-file "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz.sha256" \
            --expected-version "$version" \
            --plugin-root plugins/codestory \
            --candidate-plugin-root-output "$candidate_root/plugin" \
            --candidate-plugin-data-output "$candidate_root/data" \
            --installed-plugin-attestation-output target/candidate-installed-macos/install-attestation-v2.json \
            --candidate-producer-repository "$GITHUB_REPOSITORY" \
            --candidate-producer-workflow-path "$CANDIDATE_PRODUCER_WORKFLOW_PATH" \
            --candidate-producer-run-id "$GITHUB_RUN_ID" \
            --candidate-producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --candidate-artifact-name "$(basename "$archive")"

      - name: Prove candidate-installed macOS Metal runtime
        if: ${{ inputs.candidate_installed_proof && !inputs.calibration_mode }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CODESTORY_EMBED_ALLOW_CPU: "0"
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          archive="target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          python3 .github/scripts/check-packaged-agent-proof.py \
            --archive "$archive" \
            --checksum-file "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz.sha256" \
            --expected-version "$version" \
            --project "${{ github.workspace }}" \
            --plugin-root "$CODESTORY_CANDIDATE_MACOS_ROOT/plugin" \
            --plugin-handoff \
            --engine-policy accelerated \
            --expected-backend Metal \
            --offline \
            --proof-tier installed_runtime \
            --server-behavior-only \
            --installed-plugin-attestation target/candidate-installed-macos/install-attestation-v2.json \
            --installed-plugin-data "$CODESTORY_CANDIDATE_MACOS_ROOT/data" \
            --candidate-producer-repository "$GITHUB_REPOSITORY" \
            --candidate-producer-workflow-path "$CANDIDATE_PRODUCER_WORKFLOW_PATH" \
            --candidate-producer-run-id "$GITHUB_RUN_ID" \
            --candidate-producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --candidate-artifact-name "$(basename "$archive")" \
            --expected-source-sha "$source_sha" \
            --expected-source-tree "$source_tree" \
            --timeout-secs 1800 \
            --out-dir target/candidate-installed-macos/proof

      - name: Upload Metal calibration runs
        if: always() && inputs.calibration_mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: embedding-calibration-macos-${{ inputs.version }}
          path: target/calibration-runs/macos
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload candidate-installed macOS proof
        if: always() && inputs.candidate_installed_proof && !inputs.calibration_mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-installed-macos-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: target/candidate-installed-macos
          if-no-files-found: error
          retention-days: 30

      - name: Emit authenticated Metal release cell
        if: inputs.emit_release_cells && !inputs.calibration_mode
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          jq -n \
            --arg native_engine coderank_q8_embedded \
            '{native_engine: $native_engine}' \
            > target/macos-metal-proof/release-cell-identity.json
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$INPUT_REF" \
            --version "$version" \
            --cell-id accelerator_execution:macos-arm64-metal \
            --producer-workflow .github/workflows/macos-metal-proof.yml \
            --producer-job packaged-metal \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-prepublish-macos-arm64-metal-attempt-$GITHUB_RUN_ATTEMPT" \
            --identity target/macos-metal-proof/release-cell-identity.json \
            --archive "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz" \
            --out target/release-cells/accelerator_execution-macos-arm64-metal.json

      - name: Upload authenticated Metal release cell
        if: success() && inputs.emit_release_cells && !inputs.calibration_mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-macos-arm64-metal-attempt-${{ github.run_attempt }}
          path: target/release-cells/accelerator_execution-macos-arm64-metal.json
          if-no-files-found: error
          retention-days: 30

      - name: Emit authenticated macOS retrieval-readiness release cell
        if: inputs.emit_release_cells && inputs.server_behavior_only && !inputs.calibration_mode
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$INPUT_REF" \
            --version "$version" \
            --cell-id retrieval_readiness:macos-arm64 \
            --producer-workflow .github/workflows/macos-metal-proof.yml \
            --producer-job packaged-metal \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-postpublish-retrieval-macos-arm64-attempt-$GITHUB_RUN_ATTEMPT" \
            --archive "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz" \
            --out target/release-cells/retrieval_readiness-macos-arm64.json

      - name: Upload authenticated macOS retrieval-readiness release cell
        if: success() && inputs.emit_release_cells && inputs.server_behavior_only && !inputs.calibration_mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-postpublish-retrieval-macos-arm64-attempt-${{ github.run_attempt }}
          path: target/release-cells/retrieval_readiness-macos-arm64.json
          if-no-files-found: error
          retention-days: 30

      - name: Emit authenticated candidate-installed macOS release cell
        if: inputs.emit_release_cells && inputs.candidate_installed_proof && !inputs.calibration_mode
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          jq -n \
            --arg installer candidate_managed_plugin \
            --arg runtime_version "$version" \
            --arg native_engine coderank_q8_embedded \
            '{installer: $installer, runtime_version: $runtime_version, native_engine: $native_engine}' \
            > target/candidate-installed-macos/release-cell-identity.json
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$INPUT_REF" \
            --version "$version" \
            --cell-id candidate_installed_behavior:macos-arm64 \
            --producer-workflow .github/workflows/macos-metal-proof.yml \
            --producer-job packaged-metal \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-prepublish-candidate-installed-macos-arm64-attempt-$GITHUB_RUN_ATTEMPT" \
            --identity target/candidate-installed-macos/release-cell-identity.json \
            --archive "target/release-dist/codestory-cli-v${version}-macos-arm64.tar.gz" \
            --out target/release-cells/candidate_installed_behavior-macos-arm64.json

      - name: Upload authenticated candidate-installed macOS release cell
        if: success() && inputs.emit_release_cells && inputs.candidate_installed_proof && !inputs.calibration_mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-candidate-installed-macos-arm64-attempt-${{ github.run_attempt }}
          path: target/release-cells/candidate_installed_behavior-macos-arm64.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Metal proof artifacts
        if: always() && !inputs.calibration_mode
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-arm64-metal-proof-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: target/macos-metal-proof
          if-no-files-found: error
          retention-days: 30

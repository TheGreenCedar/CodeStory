name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - crates/**
      - Cargo.lock
      - CHANGELOG.md
      - AGENTS.md
      - docs/contributors/testing-matrix.md
      - release-claims.json
      - benchmarks/release-evidence/**
      - scripts/codestory-release-*.mjs
      - scripts/tests/codestory-release-*.test.mjs
      - scripts/tests/fixtures/release-claims/**
      - .github/actionlint.yaml
      - .github/workflows/**
      - .github/scripts/**
      - package.json
      - package-lock.json
      - plugins/codestory/**

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-version:
    name: Detect codestory-cli version change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      release_lane: ${{ steps.version.outputs.release_lane }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare codestory-cli versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/scripts/detect-codestory-release.py \
            --before-sha "$BEFORE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --output "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true' && needs.detect-version.outputs.release_lane == 'native'
    permissions:
      actions: write
      # This is the lane that actually publishes releases, so it is the lane whose token has to be
      # able to read the lost-runner annotation. A called workflow cannot widen the caller's grant.
      checks: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.detect-version.outputs.version }}
      publish_release: true
    secrets: inherit

  # The plugin fast lane ships the plugin alone against its pinned, already-published CLI.
  # No native secrets are forwarded: nothing is built or signed here.
  plugin-release:
    name: Plugin release
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true' && needs.detect-version.outputs.release_lane == 'plugin'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/plugin-release.yml
    with:
      version: ${{ needs.detect-version.outputs.version }}

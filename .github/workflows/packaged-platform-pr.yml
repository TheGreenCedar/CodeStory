name: Platform and integration proof

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build exact packages, prove platforms, run one frozen-candidate qualification, collect calibration, or prove current dev.
        required: true
        default: platform
        type: choice
        options: [package, platform, qualification, calibration, integration]
      pr_number:
        description: Same-repository pull request. Dispatch PR modes with --ref <same-repository PR head branch>.
        required: false
        type: string
      expected_head_sha:
        description: Exact accepted head SHA. The selected --ref, github.sha, and live PR or dev head must match.
        required: true
        type: string
      scope:
        description: Auto-detect proof scope or select no package proof, one supported platform, or full.
        required: true
        default: auto
        type: choice
        options: [auto, none, linux, windows, macos, full]
      calibration_bundle_artifact:
        description: Frozen calibration bundle artifact name.
        required: false
        type: string
      calibration_bundle_run_id:
        description: Workflow run that produced the frozen calibration bundle artifact.
        required: false
        type: string
      freeze_receipt_digest:
        description: Active executable-freeze receipt digest for this exact proof head.
        required: true
        type: string
      qualify_linux_vulkan:
        description: Extend frozen-candidate qualification with the protected Linux x64 Vulkan lifecycle proof.
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: proof-${{ github.sha }}-${{ inputs.mode || 'platform' }}-${{ inputs.pr_number || 'dev' }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      proof_key: ${{ steps.resolve.outputs.proof_key }}
      scope: ${{ steps.scope.outputs.scope }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve trusted exact head
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.expected_head_sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_QUALIFY_LINUX_VULKAN: ${{ inputs.qualify_linux_vulkan }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          INPUT_CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          INPUT_CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          mode="${INPUT_MODE:-platform}"
          qualify_linux_vulkan="${INPUT_QUALIFY_LINUX_VULKAN:-false}"
          test "$qualify_linux_vulkan" = false || test "$qualify_linux_vulkan" = true
          if [ "$qualify_linux_vulkan" = true ] && [ "$mode" != qualification ]; then
            echo "::error::Linux Vulkan lifecycle qualification is valid only in qualification mode."
            exit 1
          fi
          if [ "$mode" = "integration" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test -n "$INPUT_HEAD_SHA"
            dev_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/dev/codestory-next" --jq '.commit.sha')"
            test "$INPUT_HEAD_SHA" = "$dev_head" || {
              echo "::error::Integration proof requires current dev head $dev_head, not $INPUT_HEAD_SHA."
              exit 1
            }
            test "$GITHUB_REF" = "refs/heads/dev/codestory-next" || {
              echo "::error::Integration proof must be dispatched with --ref dev/codestory-next, not $GITHUB_REF."
              exit 1
            }
            test "$GITHUB_SHA" = "$dev_head" || {
              echo "::error::Workflow SHA $GITHUB_SHA is not current dev head $dev_head. Dispatch with --ref dev/codestory-next."
              exit 1
            }
            {
              echo "head_sha=$dev_head"
              echo "base_sha="
              echo "mode=integration"
              echo "proof_key=integration-$dev_head"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$mode" = "package" || test "$mode" = "platform" || test "$mode" = "qualification" || test "$mode" = "calibration"
          pr_number="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          test -n "$pr_number"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          current_head="$(jq -r '.head.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          test "$head_repo" = "$GITHUB_REPOSITORY" || {
            echo "::error::Platform proof does not execute fork pull requests."
            exit 1
          }
          if [ -n "$EVENT_HEAD_REPO" ]; then
            test "$EVENT_HEAD_REPO" = "$GITHUB_REPOSITORY" || exit 1
            test "$current_head" = "$EVENT_HEAD_SHA" || {
              echo "::error::PR #$pr_number moved after the platform-proof label event."
              exit 1
            }
          else
            test -n "$INPUT_HEAD_SHA"
            test "$INPUT_HEAD_SHA" = "$current_head" || {
              echo "::error::PR #$pr_number moved from promoted head $INPUT_HEAD_SHA to $current_head."
              exit 1
            }
            test "$GITHUB_REF" = "refs/heads/$head_ref" || {
              echo "::error::Platform proof must be dispatched with --ref $head_ref (the same-repository PR head branch), not $GITHUB_REF."
              exit 1
            }
            test "$GITHUB_SHA" = "$INPUT_HEAD_SHA" || {
              echo "::error::Workflow SHA $GITHUB_SHA is not accepted PR head $INPUT_HEAD_SHA. Dispatch with --ref $head_ref."
              exit 1
            }
          fi
          if [ "$mode" = "calibration" ] || [ "$mode" = "qualification" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$base_ref" = "dev/codestory-next" || {
              echo "::error::$mode requires a PR into dev/codestory-next, not $base_ref."
              exit 1
            }
            jq -e 'any(.labels[]; .name == "review-accepted")' <<<"$pr" >/dev/null || {
              echo "::error::PR #$pr_number does not carry the review-accepted label."
              exit 1
            }
          fi
          if [ "$mode" = "calibration" ]; then
            if [ -n "$INPUT_CALIBRATION_ARTIFACT" ] \
              || [ -n "$INPUT_CALIBRATION_RUN_ID" ]; then
              echo "::error::Calibration collection does not consume prior proof artifacts."
              exit 1
            fi
          elif [ "$mode" = "qualification" ]; then
            test -n "$INPUT_CALIBRATION_ARTIFACT"
            test -n "$INPUT_CALIBRATION_RUN_ID"
          fi
          {
            echo "head_sha=$current_head"
            echo "base_sha=$base_sha"
            echo "mode=$mode"
            echo "proof_key=$mode-pr-$pr_number-$current_head"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout accepted candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0

      - name: Cancel superseded proof runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          node .github/scripts/release-freeze-barrier.mjs cancel-superseded \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$HEAD_SHA" \
            --broad-workflow "Exact-head source proof" \
            --broad-workflow "Platform and integration proof" \
            --broad-workflow "Release" \
            --broad-workflow "Auto Release"

      - name: Authenticate calibration bundle producer
        id: calibration
        if: inputs.calibration_bundle_artifact != '' || inputs.calibration_bundle_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          test -n "$CALIBRATION_ARTIFACT" && test -n "$CALIBRATION_RUN_ID"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID")"
          producer_sha="$(jq -r '.head_sha' <<<"$run")"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<<"$run")" = ".github/workflows/packaged-platform-pr.yml"
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$CALIBRATION_ARTIFACT" = "embedding-calibration-bundle-$producer_sha"
          artifact_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$CALIBRATION_ARTIFACT" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | length'
          )"
          test "$artifact_count" = 1
          echo "source_sha=$producer_sha" >> "$GITHUB_OUTPUT"

      - name: Require executable release freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FREEZE_RECEIPT_DIGEST: ${{ inputs.freeze_receipt_digest }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RESOLVED_MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          printf '%s' "$FREEZE_RECEIPT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          if [ "$RESOLVED_MODE" = calibration ]; then
            freeze_phase=source_stabilization
          else
            freeze_phase=frozen_candidate
          fi
          tree="$(
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq '.tree.sha'
          )"
          node .github/scripts/release-freeze-barrier.mjs verify-status \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$HEAD_SHA" \
            --tree "$tree" \
            --phase "$freeze_phase" \
            --receipt-digest "$FREEZE_RECEIPT_DIGEST"

      - name: Require successful source-stabilization proof
        if: steps.resolve.outputs.mode != 'integration' && steps.resolve.outputs.mode != 'calibration'
        shell: bash
        env:
          CALIBRATION_SOURCE_SHA: ${{ steps.calibration.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          source_sha="$CALIBRATION_SOURCE_SHA"
          if [ -z "$source_sha" ]; then
            source_sha="$(
              jq -r '.freeze_record.selection_source_commit // empty' \
                crates/codestory-llama-sys/per-user-embedding-server-constant-set.json
            )"
          fi
          printf '%s' "$source_sha" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::The frozen candidate does not name its source-stabilization commit."
            exit 1
          }
          git merge-base --is-ancestor "$source_sha" "$HEAD_SHA" || {
            echo "::error::Source-stabilization commit $source_sha is not an ancestor of candidate $HEAD_SHA."
            exit 1
          }
          accepted=false
          while IFS= read -r run_id; do
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            jq -e '
              any(.jobs[]; .name == "full-source-gate" and .conclusion == "success")
              and any(.jobs[]; .name == "freeze-acceptance" and .conclusion == "success")
            ' <<<"$jobs" >/dev/null || continue
            run_attempt="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.run_attempt'
            )"
            artifacts="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"
            )"
            jq -e \
              --arg receipt "release-freeze-receipt-attempt-$run_attempt" \
              --arg source "release-cell-prepublish-source-attempt-$run_attempt" \
              '([.artifacts[] | select(.name == $receipt and .expired == false)] | length) == 1
               and ([.artifacts[] | select(.name == $source and .expired == false)] | length) == 1' \
              <<<"$artifacts" >/dev/null || continue
            accepted=true
            echo "Accepted source-stabilization run $run_id for $source_sha."
            break
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&status=completed&per_page=100" \
              | jq -r --arg repo "$GITHUB_REPOSITORY" \
                '.workflow_runs[] | select(.path == ".github/workflows/source-proof.yml" and .head_repository.full_name == $repo and .event == "workflow_dispatch" and .conclusion == "success") | .id'
          )
          test "$accepted" = true || {
            echo "::error::No successful source-stabilization full-source-gate exists for $source_sha."
            exit 1
          }

      - name: Select change-aware proof scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RESOLVED_MODE: ${{ steps.resolve.outputs.mode }}
          REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED_MODE" = "integration" ]; then
            if [ "$REQUESTED_SCOPE" = none ] || [ "$REQUESTED_SCOPE" = linux ]; then
              scope="$REQUESTED_SCOPE"
            else
              scope=full
            fi
          elif [ "$RESOLVED_MODE" = "package" ]; then
            test "$REQUESTED_SCOPE" != none
            if [ "$REQUESTED_SCOPE" = auto ]; then
              scope=full
            else
              scope="$REQUESTED_SCOPE"
            fi
          elif [ "$RESOLVED_MODE" = "qualification" ]; then
            test "$REQUESTED_SCOPE" = auto || test "$REQUESTED_SCOPE" = full
            scope=full
          elif [ "$RESOLVED_MODE" = "calibration" ]; then
            scope=none
          else
            scope="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | node .github/scripts/route-ci-proof.mjs --stdin --requested "$REQUESTED_SCOPE")"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Selected $scope platform proof."

      - name: Verify package version surfaces
        id: version
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('crates/codestory-cli/Cargo.toml', 'rb'))['package']['version'])")"
          python .github/scripts/check-codestory-release.py --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  calibration-macos:
    if: needs.route.outputs.mode == 'calibration'
    needs: route
    uses: ./.github/workflows/macos-metal-proof.yml
    with:
      version: ${{ needs.route.outputs.version }}
      ref: ${{ needs.route.outputs.head_sha }}
      proof_key: calibration-macos-${{ needs.route.outputs.head_sha }}
      use_packaged_cli_artifact: false
      calibration_mode: true

  calibration-assemble:
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.route.outputs.mode == 'calibration' &&
      needs.calibration-macos.result == 'success'
    needs:
      - route
      - calibration-macos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact calibration head
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.route.outputs.head_sha }}
          fetch-depth: 0

      - name: Download protected macOS calibration runs
        uses: actions/download-artifact@v8.0.1
        with:
          name: embedding-calibration-macos-${{ needs.route.outputs.version }}
          path: target/calibration-inputs/macos

      - name: Assemble frozen calibration candidate
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.route.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mapfile -t runs < <(
            find target/calibration-inputs/macos -type f \
              \( -name 'run-1.json' -o -name 'run-2.json' -o -name 'run-3.json' \) \
              -print | sort
          )
          test "${#runs[@]}" = 3
          run_args=()
          for run in "${runs[@]}"; do
            run_args+=(--calibration-run "$run")
          done
          mkdir -p target/calibration-freeze
          python .github/scripts/check-packaged-agent-proof.py \
            --assemble-calibration-bundle \
            "${run_args[@]}" \
            --calibration-bundle-output target/calibration-freeze/calibration-bundle.json \
            --frozen-constant-set-output target/calibration-freeze/per-user-embedding-server-constant-set.json \
            --freeze-selected-at "github-actions-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --calibration-producer-repository "$GITHUB_REPOSITORY" \
            --calibration-producer-workflow-path ".github/workflows/packaged-platform-pr.yml" \
            --calibration-producer-run-id "$GITHUB_RUN_ID" \
            --calibration-producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --calibration-producer-artifact "embedding-calibration-bundle-${EXPECTED_HEAD_SHA}" \
            > target/calibration-freeze/assembly.json
          jq \
            --arg source_head_sha "$EXPECTED_HEAD_SHA" \
            --arg source_tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              source_head_sha: $source_head_sha,
              source_tree: $source_tree,
              producer_run_id: $producer_run_id,
              producer_run_attempt: $producer_run_attempt
            }' \
            target/calibration-freeze/assembly.json \
            > target/calibration-freeze/manifest.json
          jq -e \
            --arg source_head_sha "$EXPECTED_HEAD_SHA" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            '.selection_source.commit == $source_head_sha
             and .run_count == 3
             and .matrix_cell_count == 1
             and .producer_run_id == $producer_run_id' \
            target/calibration-freeze/manifest.json >/dev/null

      - name: Upload calibration bundle and frozen constant candidate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: embedding-calibration-bundle-${{ needs.route.outputs.head_sha }}
          path: target/calibration-freeze
          if-no-files-found: error
          retention-days: 30

  source-proof:
    if: needs.route.outputs.mode == 'integration'
    needs: route
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/source-proof.yml
    with:
      ref: ${{ needs.route.outputs.head_sha }}
      proof_key: ${{ needs.route.outputs.proof_key }}
      version: ${{ needs.route.outputs.version }}
      freeze_receipt_digest: ${{ inputs.freeze_receipt_digest }}

  packaged-proof:
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.route.outputs.scope != 'none' &&
      (
        needs.source-proof.result == 'success' ||
        ((needs.route.outputs.mode == 'package' || needs.route.outputs.mode == 'platform' || needs.route.outputs.mode == 'qualification') && needs.source-proof.result == 'skipped')
      )
    needs:
      - route
      - source-proof
    uses: ./.github/workflows/packaged-platform-proof.yml
    with:
      version: ${{ needs.route.outputs.version }}
      ref: ${{ needs.route.outputs.head_sha }}
      scope: ${{ needs.route.outputs.scope }}
      proof_key: ${{ needs.route.outputs.proof_key }}
      sign_macos: false
      hermetic_linux: ${{ needs.route.outputs.mode == 'qualification' }}
      include_qualification_driver: ${{ needs.route.outputs.mode == 'qualification' }}
      calibration_bundle_artifact: ${{ inputs.calibration_bundle_artifact || '' }}
      calibration_bundle_run_id: ${{ inputs.calibration_bundle_run_id || '' }}

  macos-metal-proof:
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.packaged-proof.result == 'success' &&
      needs.route.outputs.mode != 'package' &&
      (needs.route.outputs.scope == 'macos' || needs.route.outputs.scope == 'full')
    needs:
      - route
      - packaged-proof
    uses: ./.github/workflows/macos-metal-proof.yml
    with:
      version: ${{ needs.route.outputs.version }}
      ref: ${{ needs.route.outputs.head_sha }}
      proof_key: ${{ needs.route.outputs.proof_key }}
      use_packaged_cli_artifact: true
      calibration_bundle_artifact: ${{ inputs.calibration_bundle_artifact || '' }}
      calibration_bundle_run_id: ${{ inputs.calibration_bundle_run_id || '' }}
      candidate_installed_proof: ${{ needs.route.outputs.mode != 'qualification' }}
      candidate_producer_workflow_path: .github/workflows/packaged-platform-pr.yml
      server_behavior_only: ${{ needs.route.outputs.mode != 'qualification' }}

  frozen-candidate-quality:
    name: Optional frozen-candidate quality
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.packaged-proof.result == 'success' &&
      needs.macos-metal-proof.result == 'success' &&
      needs.route.outputs.mode == 'qualification' &&
      (needs.route.outputs.scope == 'macos' || needs.route.outputs.scope == 'full')
    needs:
      - route
      - packaged-proof
      - macos-metal-proof
    uses: ./.github/workflows/frozen-candidate-quality.yml
    with:
      version: ${{ needs.route.outputs.version }}
      ref: ${{ needs.route.outputs.head_sha }}

  windows-vulkan-proof:
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.packaged-proof.result == 'success' &&
      needs.route.outputs.mode != 'package' &&
      (needs.route.outputs.scope == 'windows' || needs.route.outputs.scope == 'full')
    needs:
      - route
      - packaged-proof
    uses: ./.github/workflows/windows-vulkan-proof.yml
    with:
      version: ${{ needs.route.outputs.version }}
      ref: ${{ needs.route.outputs.head_sha }}
      proof_key: ${{ needs.route.outputs.proof_key }}
      use_packaged_cli_artifact: true
      calibration_bundle_artifact: ${{ inputs.calibration_bundle_artifact || '' }}
      calibration_bundle_run_id: ${{ inputs.calibration_bundle_run_id || '' }}
      candidate_installed_proof: ${{ needs.route.outputs.mode != 'qualification' }}
      candidate_producer_workflow_path: .github/workflows/packaged-platform-pr.yml
      server_behavior_only: ${{ needs.route.outputs.mode != 'qualification' }}

  linux-vulkan-proof:
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.packaged-proof.result == 'success' &&
      needs.route.outputs.mode != 'package' &&
      (needs.route.outputs.mode != 'qualification' || inputs.qualify_linux_vulkan) &&
      (needs.route.outputs.scope == 'linux' || needs.route.outputs.scope == 'full')
    needs:
      - route
      - packaged-proof
    uses: ./.github/workflows/linux-vulkan-proof.yml
    with:
      version: ${{ needs.route.outputs.version }}
      ref: ${{ needs.route.outputs.head_sha }}
      proof_key: ${{ needs.route.outputs.proof_key }}
      calibration_bundle_artifact: ${{ inputs.calibration_bundle_artifact || '' }}
      calibration_bundle_run_id: ${{ inputs.calibration_bundle_run_id || '' }}
      candidate_installed_proof: ${{ needs.route.outputs.mode != 'qualification' }}
      candidate_producer_workflow_path: .github/workflows/packaged-platform-pr.yml
      server_behavior_only: ${{ needs.route.outputs.mode != 'qualification' }}

  closeout:
    if: >-
      always() &&
      needs.route.result != 'skipped' &&
      needs.route.outputs.mode != 'calibration'
    needs:
      - route
      - source-proof
      - packaged-proof
      - macos-metal-proof
      - windows-vulkan-proof
      - linux-vulkan-proof
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Require one coherent accepted proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.route.outputs.head_sha }}
          MODE: ${{ needs.route.outputs.mode }}
          QUALIFY_LINUX_VULKAN: ${{ inputs.qualify_linux_vulkan }}
          SCOPE: ${{ needs.route.outputs.scope }}
          ROUTE_RESULT: ${{ needs.route.result }}
          SOURCE_RESULT: ${{ needs.source-proof.result }}
          PACKAGE_RESULT: ${{ needs.packaged-proof.result }}
          METAL_RESULT: ${{ needs.macos-metal-proof.result }}
          WINDOWS_VULKAN_RESULT: ${{ needs.windows-vulkan-proof.result }}
          LINUX_VULKAN_RESULT: ${{ needs.linux-vulkan-proof.result }}
        run: |
          set -euo pipefail
          require_result() {
            test "$1" = "$2" || {
              echo "::error::$3 finished $1; expected $2."
              exit 1
            }
          }
          require_result "$ROUTE_RESULT" success routing
          if [ "$MODE" = integration ]; then
            require_result "$SOURCE_RESULT" success source-proof
          else
            require_result "$SOURCE_RESULT" skipped source-proof
          fi
          if [ "$MODE" = package ]; then
            require_result "$PACKAGE_RESULT" success packaged-proof
            require_result "$METAL_RESULT" skipped macos-metal-proof
            require_result "$WINDOWS_VULKAN_RESULT" skipped windows-vulkan-proof
            require_result "$LINUX_VULKAN_RESULT" skipped linux-vulkan-proof
          elif [ "$SCOPE" = none ]; then
            require_result "$PACKAGE_RESULT" skipped packaged-proof
            require_result "$METAL_RESULT" skipped macos-metal-proof
            require_result "$WINDOWS_VULKAN_RESULT" skipped windows-vulkan-proof
            require_result "$LINUX_VULKAN_RESULT" skipped linux-vulkan-proof
          else
            require_result "$PACKAGE_RESULT" success packaged-proof
            if [ "$SCOPE" = windows ]; then
              require_result "$METAL_RESULT" skipped macos-metal-proof
              require_result "$WINDOWS_VULKAN_RESULT" success windows-vulkan-proof
              require_result "$LINUX_VULKAN_RESULT" skipped linux-vulkan-proof
            elif [ "$SCOPE" = macos ]; then
              require_result "$METAL_RESULT" success macos-metal-proof
              require_result "$WINDOWS_VULKAN_RESULT" skipped windows-vulkan-proof
              require_result "$LINUX_VULKAN_RESULT" skipped linux-vulkan-proof
            elif [ "$SCOPE" = linux ]; then
              require_result "$METAL_RESULT" skipped macos-metal-proof
              require_result "$WINDOWS_VULKAN_RESULT" skipped windows-vulkan-proof
              require_result "$LINUX_VULKAN_RESULT" success linux-vulkan-proof
            else
              require_result "$METAL_RESULT" success macos-metal-proof
              require_result "$WINDOWS_VULKAN_RESULT" success windows-vulkan-proof
              if [ "$MODE" = qualification ]; then
                if [ "$QUALIFY_LINUX_VULKAN" = true ]; then
                  require_result "$LINUX_VULKAN_RESULT" success linux-vulkan-proof
                else
                  require_result "$LINUX_VULKAN_RESULT" skipped linux-vulkan-proof
                fi
              else
                require_result "$LINUX_VULKAN_RESULT" success linux-vulkan-proof
              fi
            fi
          fi
          if [ "$MODE" = integration ]; then
            current_dev="$(gh api "repos/$GITHUB_REPOSITORY/branches/dev/codestory-next" --jq '.commit.sha')"
            test "$HEAD_SHA" = "$current_dev" || {
              echo "::error::dev/codestory-next moved from proved head $HEAD_SHA to $current_dev."
              exit 1
            }
          fi

      - name: Validate opted-in Linux quality evidence
        if: inputs.qualify_linux_vulkan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.route.outputs.head_sha }}
        run: |
          set -euo pipefail
          artifact_name="frozen-candidate-linux-x64-quality-$HEAD_SHA-attempt-$GITHUB_RUN_ATTEMPT"
          evidence_root=target/strict-linux-quality
          rm -rf "$evidence_root"
          mkdir -p "$evidence_root"

          artifact=""
          for _ in $(seq 1 300); do
            artifacts="$({ gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"; } 2>/dev/null || true)"
            if [ -z "$artifacts" ]; then artifacts='{"artifacts":[]}'; fi
            artifact="$(jq -c \
              --arg name "$artifact_name" \
              --arg sha "$HEAD_SHA" \
              --argjson run_id "$GITHUB_RUN_ID" \
              '[.artifacts[]? | select(
                .name == $name
                and .expired == false
                and .workflow_run.id == $run_id
                and .workflow_run.head_sha == $sha
              )] | if length == 1 then .[0] else empty end' \
              <<<"$artifacts")"
            if [ -n "$artifact" ]; then break; fi
            sleep 10
          done
          test -n "$artifact" || {
            echo "::error::Exact Linux quality artifact $artifact_name was not retained."
            exit 1
          }
          artifact_id="$(jq -r .id <<<"$artifact")"
          artifact_digest="$(jq -r .digest <<<"$artifact")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$evidence_root/artifact"

          summary="$(find "$evidence_root/artifact" -type f -name packet-runtime-summary.json -print)"
          runs="$(find "$evidence_root/artifact" -type f -name packet-runtime-runs.jsonl -print)"
          test "$(printf '%s\n' "$summary" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          test "$(printf '%s\n' "$runs" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          source_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)"
          jq -e \
            --arg commit "$HEAD_SHA" \
            --arg tree "$source_tree" \
            '.modes == ["cold-cli"]
              and .repeats == 3
              and .release_evidence.commit == $commit
              and .release_evidence.source_tree == $tree
              and .release_evidence.evaluation_contract == "publishable-three-repeat-packet/v1"
              and .release_evidence.profile == "optional-linux-x64-quality"
              and .release_evidence.evidence_identity.corpus_id == "codestory-release-corpus-v0.16-axios-js-ts-v2"
              and .release_evidence.evidence_identity.cache_id == "frozen-candidate-linux-x64-axios-js-ts-v2"
              and (.release_evidence.evidence_identity.machine_fingerprint | test("^[0-9a-f]{64}$"))
              and .release_evidence.publishable == true
              and .release_evidence.repeats == 3
              and .release_evidence.quality_gate_status == "pass"
              and .release_evidence.publishable_blockers == []
              and (.release_evidence.rows | length) == 3' \
            "$summary" >/dev/null
          jq -s -e '
            length == 3
            and ([.[].repeat] | sort) == [1, 2, 3]
            and all(.[];
              .repo == "axios"
              and .task_id == "axios-request-dispatch-v2"
              and .mode == "cold_cli_packet"
              and .status == "pass"
              and .quality.pass == true
              and .sufficiency.status == "sufficient"
              and .sufficiency.gaps_count == 0
              and .sufficiency.open_next_count == 0
              and .sufficiency.follow_up_commands_count == 0
              and (.sufficiency.coverage_unresolved_blocking_count // .sufficiency.coverage_unresolved_count // 0) == 0
              and ((.sufficiency.unresolved_candidate_count // 0) == 0 or .sufficiency.unresolved_candidate_diagnostic_only == true)
              and .sufficiency.retrieval_mode == "full"
              and .sufficiency.degraded_reason == null
              and .packet_latency.sla_missed == false
              and .packet_latency.retrieval_shadow.retrieval_mode == "full"
              and .packet_extra_probe_strategy == null
              and .repo_provenance.git_dirty == false
              and .codestory_cache_provenance.local_only == true
            )' "$runs" >/dev/null
          jq -S '.release_evidence.rows' "$summary" > "$evidence_root/summary-rows.json"
          jq -sS '.' "$runs" > "$evidence_root/raw-rows.json"
          cmp "$evidence_root/summary-rows.json" "$evidence_root/raw-rows.json"
          summary_sha256="$(sha256sum "$summary" | awk '{print $1}')"
          runs_sha256="$(sha256sum "$runs" | awk '{print $1}')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$HEAD_SHA" \
            --arg source_tree "$source_tree" \
            --argjson producer_run_id "$GITHUB_RUN_ID" \
            --argjson producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson source_artifact_id "$artifact_id" \
            --arg source_artifact "$artifact_name" \
            --arg source_artifact_digest "$artifact_digest" \
            --arg summary_sha256 "$summary_sha256" \
            --arg runs_sha256 "$runs_sha256" \
            '{schema:"codestory.strict-linux-quality-validation/v1", status:"pass",
              repository:$repository, commit:$commit, source_tree:$source_tree,
              producer_run_id:$producer_run_id, producer_run_attempt:$producer_run_attempt,
              source_artifact_id:$source_artifact_id, source_artifact:$source_artifact,
              source_artifact_digest:$source_artifact_digest,
              evaluation_contract:"publishable-three-repeat-packet/v1",
              corpus_id:"codestory-release-corpus-v0.16-axios-js-ts-v2",
              repeats:3, rows:3, summary_sha256:$summary_sha256, runs_sha256:$runs_sha256}' \
            > "$evidence_root/receipt.json"

      - name: Upload opted-in Linux quality validation
        if: inputs.qualify_linux_vulkan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: strict-linux-quality-validation-${{ needs.route.outputs.head_sha }}-attempt-${{ github.run_attempt }}
          path: target/strict-linux-quality/receipt.json
          if-no-files-found: error
          retention-days: 30

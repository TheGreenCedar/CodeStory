name: Packaged platform proof

on:
  workflow_call:
    inputs:
      version:
        description: Release version from crates/codestory-cli/Cargo.toml.
        required: true
        type: string
      ref:
        description: Exact source SHA to package.
        required: true
        type: string
      scope:
        description: Native package matrix scope (linux, windows, macos, or full).
        required: false
        default: full
        type: string
      proof_key:
        description: Stable PR or integration identity for concurrency cancellation.
        required: false
        default: ""
        type: string
      sign_macos:
        description: Require Developer ID signing and Apple notarization for macOS assets.
        required: false
        default: false
        type: boolean
      calibration_bundle_artifact:
        description: Frozen calibration bundle artifact name.
        required: false
        default: ""
        type: string
      calibration_bundle_run_id:
        description: Workflow run that produced the frozen calibration bundle artifact.
        required: false
        default: ""
        type: string
      emit_release_cells:
        description: Emit authenticated package cells for the production release coordinator.
        required: false
        default: false
        type: boolean
      hermetic_linux:
        description: Run the deliberately cold Linux network-denied build once for a frozen candidate.
        required: false
        default: false
        type: boolean
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_NOTARY_KEY_P8_BASE64:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: packaged-platform-proof-${{ github.sha }}-${{ inputs.ref }}-${{ inputs.proof_key || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_RUST_TOOLCHAIN: "1.95.0"
  LINUX_GLIBC_BUILD_IMAGE: "rust:1.95.0-bullseye@sha256:28afaeb8445f2a2e7d878bd34ed39ba02bb517efb29986188cbd59b7cf4f2fdf"
  LINUX_GLSLC_IMAGE: "ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90"
  LINUX_GLIBC_BASELINE_IMAGE: "ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"
  APPLE_DEVELOPER_TEAM_ID: "PKUJNR8D6F"
  SCCACHE_VERSION: "v0.16.0"
  SCCACHE_CACHE_SIZE: "1G"
  WINDOWS_SCCACHE_CACHE_SIZE: "2G"
  CARGO_DEPENDENCY_CACHE_MAX_BYTES: "1073741824"

jobs:
  build:
    name: Build ${{ matrix.asset_target }}
    runs-on: ${{ matrix.os }}
    # The six APPLE_* credentials are an environment-scoped release contract;
    # repository-only secrets are not the supported signing configuration.
    environment: ${{ inputs.sign_macos && startsWith(matrix.asset_target, 'macos-') && 'macos-release-signing' || null }}
    timeout-minutes: ${{ inputs.sign_macos && startsWith(matrix.asset_target, 'macos-') && 90 || 60 }}
    strategy:
      fail-fast: false
      # GitHub applies matrix exclusions before includes, so an include-only
      # matrix must select the complete row set rather than trying to exclude
      # rows after the fact.
      matrix: ${{ fromJSON(inputs.scope == 'linux' && '{"include":[{"os":"ubuntu-latest","rust_target":"x86_64-unknown-linux-gnu","asset_target":"linux-x64","exe_suffix":"","extension":"tar.gz"}]}' || inputs.scope == 'windows' && '{"include":[{"os":"windows-latest","rust_target":"x86_64-pc-windows-msvc","asset_target":"windows-x64","exe_suffix":".exe","extension":"zip"}]}' || inputs.scope == 'macos' && '{"include":[{"os":"macos-15","rust_target":"aarch64-apple-darwin","asset_target":"macos-arm64","exe_suffix":"","extension":"tar.gz"}]}' || '{"include":[{"os":"windows-latest","rust_target":"x86_64-pc-windows-msvc","asset_target":"windows-x64","exe_suffix":".exe","extension":"zip"},{"os":"macos-15","rust_target":"aarch64-apple-darwin","asset_target":"macos-arm64","exe_suffix":"","extension":"tar.gz"},{"os":"ubuntu-latest","rust_target":"x86_64-unknown-linux-gnu","asset_target":"linux-x64","exe_suffix":"","extension":"tar.gz"}]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Require exact source identity
        id: source-identity
        shell: bash
        env:
          EXACT_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$EXACT_SHA" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$head_sha" = "$EXACT_SHA"
          {
            echo "sha=$head_sha"
            echo "tree=$source_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust
        # The toolchain is now read as a shell variable, which makes the script shell-dependent:
        # this job's matrix includes windows-latest, where the runner default is pwsh.
        shell: bash
        run: |
          rustup toolchain install "$RELEASE_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RELEASE_RUST_TOOLCHAIN"
          rustup target add "${{ matrix.rust_target }}"

      - name: Configure short Windows Cargo target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspaceTarget = Join-Path $env:GITHUB_WORKSPACE "target"
          $runnerRoot = [System.IO.Path]::GetPathRoot($workspaceTarget)
          if ([string]::IsNullOrWhiteSpace($runnerRoot)) {
            throw "workspace target has no volume root: $workspaceTarget"
          }
          $shortTarget = Join-Path $runnerRoot "t"
          New-Item -ItemType Directory -Force -Path $workspaceTarget | Out-Null
          if (Test-Path -LiteralPath $shortTarget) {
            throw "short Cargo target already exists: $shortTarget"
          }
          New-Item -ItemType Junction -Path $shortTarget -Target $workspaceTarget | Out-Null
          "CARGO_TARGET_DIR=$shortTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare checksum-pinned embedded model
        run: node scripts/prepare-embedded-model.mjs

      - name: Install checksum-pinned Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/install-windows-vulkan-sdk.ps1

      - name: Install Linux Vulkan build dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-vulkan-build-deps.sh

      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
          disable_annotations: true

      - name: Capture pinned sccache identity
        id: sccache-identity
        shell: bash
        run: |
          sccache_path="$(command -v sccache)"
          test -x "$sccache_path"
          sccache_sha256="$(
            node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readFileSync } from "node:fs";
              process.stdout.write(
                createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"),
              );
            ' "$sccache_path"
          )"
          {
            echo "path=$sccache_path"
            echo "sha256=$sccache_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Configure bounded compiler cache
        shell: bash
        run: |
          cache_size="$SCCACHE_CACHE_SIZE"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cache_size="$WINDOWS_SCCACHE_CACHE_SIZE"
          fi
          {
            echo "CARGO_HOME=$RUNNER_TEMP/codestory-release-cargo"
            echo "SCCACHE_DIR=$RUNNER_TEMP/codestory-release-sccache"
            echo "SCCACHE_CACHE_SIZE=$cache_size"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          fi

      - name: Capture reusable build cache contract
        id: build-cache
        shell: bash
        env:
          EXACT_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          rust_version="$(rustc -Vv | sed -n 's/^release: //p')"
          generator=unix-makefiles
          cmake_version="$(cmake --version | sed -n 's/^cmake version //p')"
          ninja_version=not-applicable
          relevant_inputs=(
            --relevant-input .cargo/llama-dynamic-backends.cmake
            --relevant-input crates/codestory-llama-sys/build.rs
            --relevant-input crates/codestory-llama-sys/model-contract.json
            --relevant-input scripts/prepare-embedded-model.mjs
          )
          extra_identity=(
            --identity cargo_incremental=0
            --identity qualification_driver=disabled
          )
          while IFS= read -r manifest; do
            relevant_inputs+=(--relevant-input "$manifest")
          done < <(git ls-files '*Cargo.toml')
          if [ "$RUNNER_OS" = Windows ]; then
            generator=ninja
            ninja_version="$(ninja --version)"
            # shellcheck disable=SC2016
            native_toolchain="$(
              pwsh -NoProfile -Command '
                $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
                $root = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                Get-Content (Join-Path $root "VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")
              ' | tr -d '\r\n'
            )"
            native_toolchain="msvc-$native_toolchain"
            relevant_inputs+=(--relevant-input .github/scripts/install-windows-vulkan-sdk.ps1)
          elif [ "$RUNNER_OS" = macOS ]; then
            native_toolchain="$(xcrun clang --version | head -n 1 | tr -d '\r')-sdk-$(xcrun --sdk macosx --show-sdk-version)"
          else
            native_toolchain=clang-13-bullseye
            cmake_version=dockerfile-pinned
            relevant_inputs+=(
              --relevant-input .github/docker/linux-glibc-build.Dockerfile
              --relevant-input .github/docker/glslc
              --relevant-input .github/scripts/install-linux-vulkan-build-deps.sh
            )
            extra_identity+=(
              --identity cxxflags=-std=c++17
              --identity "linux_glibc_build_image=$LINUX_GLIBC_BUILD_IMAGE"
              --identity "linux_glslc_image=$LINUX_GLSLC_IMAGE"
            )
          fi
          node .github/scripts/cargo-cache-contract.mjs identity \
            --namespace codestory-cli-native-v4 \
            --exact-sha "$EXACT_SHA" \
            --os "$RUNNER_OS" \
            --target "${{ matrix.rust_target }}" \
            --rust-version "$rust_version" \
            --features codestory-cli-default-features \
            --native-toolchain "$native_toolchain" \
            --generator "$generator" \
            --cmake-version "$cmake_version" \
            --ninja-version "$ninja_version" \
            --sccache-version "$SCCACHE_VERSION" \
            --lock-file Cargo.lock \
            --cargo-config .cargo/config.toml \
            "${relevant_inputs[@]}" \
            "${extra_identity[@]}"

      - name: Restore Cargo dependency inputs
        id: cargo-dependency-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/codestory-release-cargo/registry
            ${{ runner.temp }}/codestory-release-cargo/git
          key: ${{ steps.build-cache.outputs.dependency-key }}

      - name: Report Cargo dependency cache restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cargo-dependency-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cargo-dependency-cache.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.dependency-key }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs restore \
            --kind dependencies \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --cache-hit "${CACHE_HIT:-false}" \
            --path "$CARGO_HOME/registry" \
            --path "$CARGO_HOME/git"

      # Compatible compiler objects may cross SHAs; packaged release artifacts never do.
      - name: Restore compatible compiler objects
        id: compiler-cache-restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/codestory-release-sccache
          key: ${{ steps.build-cache.outputs.compiler-key }}
          restore-keys: |
            ${{ steps.build-cache.outputs.compiler-prefix }}

      - name: Report compiler cache restore
        id: compiler-cache-report
        shell: bash
        env:
          CACHE_HIT: ${{ steps.compiler-cache-restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.compiler-cache-restore.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.compiler-key }}
          COMPATIBILITY_PREFIX: ${{ steps.build-cache.outputs.compiler-prefix }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs restore \
            --kind compiler \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --compatibility-prefix "$COMPATIBILITY_PREFIX" \
            --cache-hit "${CACHE_HIT:-false}" \
            --path "$SCCACHE_DIR"

      - name: Build pinned Linux toolchain image
        if: matrix.asset_target == 'linux-x64'
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --build-arg "BUILD_IMAGE=$LINUX_GLIBC_BUILD_IMAGE" \
            --build-arg "GLSLC_IMAGE=$LINUX_GLSLC_IMAGE" \
            --file .github/docker/linux-glibc-build.Dockerfile \
            --tag codestory-linux-glibc-build \
            .github/docker

      - name: Start compilation clock
        id: compile-clock
        run: node .github/scripts/cargo-cache-contract.mjs start

      - name: Compile native workspace path regression on Windows
        id: windows-workspace-compile
        if: runner.os == 'Windows'
        run: cargo test --locked -p codestory-workspace repository_identity --no-run

      - name: Compile immutable native staging regression on Windows
        id: windows-native-compile
        if: runner.os == 'Windows'
        run: >-
          cargo test --release --locked
          -p codestory-llama-sys
          --test native_staging
          --target "${{ matrix.rust_target }}"
          --no-run

      - name: Build codestory-cli
        id: package-build
        if: matrix.asset_target != 'linux-x64'
        run: cargo build --release --locked -p codestory-cli --target "${{ matrix.rust_target }}"

      - name: Build Linux x64 at the glibc 2.31 baseline
        id: linux-build
        if: matrix.asset_target == 'linux-x64'
        shell: bash
        env:
          SCCACHE_BINARY: ${{ steps.sccache-identity.outputs.path }}
          SCCACHE_SHA256: ${{ steps.sccache-identity.outputs.sha256 }}
        run: |
          test -x "$SCCACHE_BINARY"
          actual_sccache_sha256="$(
            node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readFileSync } from "node:fs";
              process.stdout.write(
                createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"),
              );
            ' "$SCCACHE_BINARY"
          )"
          test "$actual_sccache_sha256" = "$SCCACHE_SHA256"
          mkdir -p "$CARGO_HOME" "$SCCACHE_DIR"
          model_relative="${CODESTORY_EMBED_MODEL_SOURCE#"$PWD/"}"
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --env CARGO_HOME=/cargo \
            --env CARGO_TARGET_DIR=/workspace/target/glibc-2.31 \
            --env CODESTORY_EMBED_MODEL_SOURCE="/workspace/$model_relative" \
            --env CXXFLAGS=-std=c++17 \
            --env RUSTC_WRAPPER=/sccache/sccache \
            --env SCCACHE_DIR=/sccache/cache \
            --env SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" \
            --env CMAKE_C_COMPILER_LAUNCHER=/sccache/sccache \
            --env CMAKE_CXX_COMPILER_LAUNCHER=/sccache/sccache \
            --volume "$CARGO_HOME:/cargo" \
            --volume "$PWD:/workspace" \
            --volume "$SCCACHE_BINARY:/sccache/sccache:ro" \
            --volume "$SCCACHE_DIR:/sccache/cache" \
            --workdir /workspace \
            codestory-linux-glibc-build \
            sh -ceu '
              cargo build --release --locked -p codestory-cli \
                --target "${{ matrix.rust_target }}"
              /sccache/sccache --show-stats
              /sccache/sccache --stop-server
            '
          mkdir -p "target/${{ matrix.rust_target }}/release"
          cp "target/glibc-2.31/${{ matrix.rust_target }}/release/codestory-cli" \
            "target/${{ matrix.rust_target }}/release/codestory-cli"
          cp "target/glibc-2.31/${{ matrix.rust_target }}/release/codestory-cli-runtime" \
            "target/${{ matrix.rust_target }}/release/codestory-cli-runtime"
          rm -rf "target/${{ matrix.rust_target }}/release/.codestory-native-seeds"
          cp -R "target/glibc-2.31/${{ matrix.rust_target }}/release/.codestory-native-seeds" \
            "target/${{ matrix.rust_target }}/release/.codestory-native-seeds"
          find "target/${{ matrix.rust_target }}/release" -maxdepth 1 -type f \
            \( -name 'libllama.so*' -o -name 'libggml*.so*' \) -delete
          find "target/glibc-2.31/${{ matrix.rust_target }}/release" -maxdepth 1 \
            \( -type f -o -type l \) \
            \( -name 'libllama.so*' -o -name 'libggml*.so*' \) \
            -exec cp -L {} "target/${{ matrix.rust_target }}/release/" \;
          cp "target/glibc-2.31/${{ matrix.rust_target }}/release/codestory-native-runtime-files-v1.txt" \
            "target/${{ matrix.rust_target }}/release/codestory-native-runtime-files-v1.txt"

      - name: Stop compilation clock
        id: compile-clock-stop
        if: >-
          always() &&
          (
            (matrix.asset_target == 'linux-x64' && steps.linux-build.outcome == 'success') ||
            (matrix.asset_target != 'linux-x64' && steps.package-build.outcome == 'success')
          )
        shell: bash
        run: node .github/scripts/cargo-cache-contract.mjs stop

      - name: Finalize compiler objects
        if: always() && steps.package-build.outcome == 'success'
        shell: bash
        env:
          SCCACHE_BINARY: ${{ steps.sccache-identity.outputs.path }}
          SCCACHE_SHA256: ${{ steps.sccache-identity.outputs.sha256 }}
        run: |
          test -x "$SCCACHE_BINARY"
          actual_sccache_sha256="$(
            node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readFileSync } from "node:fs";
              process.stdout.write(
                createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"),
              );
            ' "$SCCACHE_BINARY"
          )"
          test "$actual_sccache_sha256" = "$SCCACHE_SHA256"
          "$SCCACHE_BINARY" --show-stats
          "$SCCACHE_BINARY" --stop-server

      - name: Bound Cargo dependency cache
        id: cargo-dependency-cache-size
        if: >-
          always() &&
          (
            (matrix.asset_target == 'linux-x64' && steps.linux-build.outcome == 'success') ||
            (matrix.asset_target != 'linux-x64' && steps.package-build.outcome == 'success')
          )
        shell: bash
        run: |
          node .github/scripts/cargo-cache-contract.mjs size \
            --kind dependencies \
            --max-bytes "$CARGO_DEPENDENCY_CACHE_MAX_BYTES" \
            --path "$CARGO_HOME/registry" \
            --path "$CARGO_HOME/git"

      - name: Save Cargo dependency inputs
        id: cargo-dependency-cache-save
        if: >-
          always() &&
          (
            (matrix.asset_target == 'linux-x64' && steps.linux-build.outcome == 'success') ||
            (matrix.asset_target != 'linux-x64' && steps.package-build.outcome == 'success')
          ) &&
          steps.cargo-dependency-cache-size.outputs.within-limit == 'true' &&
          steps.cargo-dependency-cache.outputs.cache-hit != 'true' &&
          steps.cargo-dependency-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/codestory-release-cargo/registry
            ${{ runner.temp }}/codestory-release-cargo/git
          key: ${{ steps.cargo-dependency-cache.outputs.cache-primary-key }}

      - name: Start compiler cache save clock
        id: compiler-cache-save-clock
        if: >-
          always() &&
          (
            (matrix.asset_target == 'linux-x64' && steps.linux-build.outcome == 'success') ||
            (matrix.asset_target != 'linux-x64' && steps.package-build.outcome == 'success')
          )
        run: node .github/scripts/cargo-cache-contract.mjs start

      - name: Save compiler objects after compilation
        id: compiler-cache-save
        if: >-
          always() &&
          (
            (matrix.asset_target == 'linux-x64' && steps.linux-build.outcome == 'success') ||
            (matrix.asset_target != 'linux-x64' && steps.package-build.outcome == 'success')
          ) &&
          steps.compiler-cache-restore.outputs.cache-hit != 'true' &&
          steps.compiler-cache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/codestory-release-sccache
          key: ${{ steps.compiler-cache-restore.outputs.cache-primary-key }}

      - name: Report compiler cache save
        if: >-
          always() &&
          (
            (matrix.asset_target == 'linux-x64' && steps.linux-build.outcome == 'success') ||
            (matrix.asset_target != 'linux-x64' && steps.package-build.outcome == 'success')
          )
        shell: bash
        env:
          HIT_TYPE: ${{ steps.compiler-cache-report.outputs.hit-type }}
          MATCHED_KEY: ${{ steps.compiler-cache-restore.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.compiler-key }}
          COMPATIBILITY_PREFIX: ${{ steps.build-cache.outputs.compiler-prefix }}
          RESTORED_BYTES: ${{ steps.compiler-cache-report.outputs.restored-bytes }}
          SAVE_RESULT: ${{ steps.compiler-cache-save.outcome }}
          STARTED_MS: ${{ steps.compile-clock.outputs.started-ms }}
          ENDED_MS: ${{ steps.compile-clock-stop.outputs.ended-ms }}
          SAVE_STARTED_MS: ${{ steps.compiler-cache-save-clock.outputs.started-ms }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs save \
            --kind compiler \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --compatibility-prefix "$COMPATIBILITY_PREFIX" \
            --hit-type "$HIT_TYPE" \
            --restored-bytes "$RESTORED_BYTES" \
            --started-ms "$STARTED_MS" \
            --ended-ms "$ENDED_MS" \
            --save-started-ms "$SAVE_STARTED_MS" \
            --save-result "$SAVE_RESULT" \
            --path "$SCCACHE_DIR"

      - name: Prove native workspace path identity
        if: runner.os == 'Windows'
        run: cargo test --locked -p codestory-workspace repository_identity

      - name: Test immutable native staging on Windows
        if: runner.os == 'Windows'
        run: >-
          cargo test --release --locked
          -p codestory-llama-sys
          --test native_staging
          --target "${{ matrix.rust_target }}"
          stages_complete_immutable_native_seeds

      - name: Sign and notarize macOS CLI
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required protected macOS release secret: $name"
              exit 1
            fi
          done

          bin="target/${{ matrix.rust_target }}/release/codestory-cli"
          proof_dir="target/notarization-proof/${{ matrix.asset_target }}"
          work_dir="$RUNNER_TEMP/codestory-notary-${{ matrix.asset_target }}"
          keychain="$RUNNER_TEMP/codestory-signing-${{ matrix.asset_target }}.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          mkdir -p "$proof_dir" "$work_dir/stage"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$work_dir/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$work_dir/notary-key.p8"
          chmod 600 "$work_dir/developer-id.p12" "$work_dir/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work_dir/developer-id.p12" \
            -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | tee "$proof_dir/signing-identities.txt"
          signing_hash="$(awk -v identity="$APPLE_SIGNING_IDENTITY" \
            'index($0, "\"" identity "\"") { print $2; exit }' \
            "$proof_dir/signing-identities.txt")"
          grep -Eq '^[0-9A-Fa-f]{40}$' <<<"$signing_hash"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$keychain" \
            --sign "$signing_hash" \
            "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -dv --verbose=4 "$bin" 2> "$proof_dir/codesign-details.txt"
          codesign -d -r- "$bin" > "$proof_dir/designated-requirement.txt" 2>&1
          grep -F "Authority=$APPLE_SIGNING_IDENTITY" "$proof_dir/codesign-details.txt"
          grep -E "flags=.*runtime" "$proof_dir/codesign-details.txt"
          grep -E "^TeamIdentifier=${APPLE_DEVELOPER_TEAM_ID}$" "$proof_dir/codesign-details.txt"
          grep -E "certificate leaf\\[subject\\.OU\\] = \"?${APPLE_DEVELOPER_TEAM_ID}\"?([[:space:]]|$)" \
            "$proof_dir/designated-requirement.txt"

          cp "$bin" "$work_dir/stage/codestory-cli"
          ditto -c -k "$work_dir/stage" "$work_dir/codestory-cli-notary.zip"
          xcrun notarytool submit "$work_dir/codestory-cli-notary.zip" \
            --key "$work_dir/notary-key.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --no-wait \
            --output-format json | tee "$proof_dir/notarytool-submission.json"
          submission_id="$(jq -er \
            '.id | select(type == "string" and test("^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$"))' \
            "$proof_dir/notarytool-submission.json")"
          printf '%s\n' "$submission_id" > "$proof_dir/notarytool-submission-id.txt"

          notary_accepted=false
          max_notary_attempts=120
          notary_poll_seconds=30
          notary_poll_log="$proof_dir/notarytool-poll.log"
          for attempt in $(seq 1 "$max_notary_attempts"); do
            notary_info="$work_dir/notarytool-info.json"
            notary_error="$work_dir/notarytool-info-error.txt"
            if xcrun notarytool info "$submission_id" \
              --key "$work_dir/notary-key.p8" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --output-format json > "$notary_info" 2> "$notary_error"
            then
              if notary_status="$(jq -er '.status | select(type == "string")' "$notary_info")"
              then
                cp "$notary_info" "$proof_dir/notarytool-result.json"
                printf 'attempt=%s status=%s\n' "$attempt" "$notary_status" >> "$notary_poll_log"
                case "$notary_status" in
                  Accepted)
                    notary_accepted=true
                    break
                    ;;
                  "In Progress")
                    ;;
                  Invalid|Rejected)
                    notary_log_retained=false
                    for log_attempt in 1 2 3; do
                      if xcrun notarytool log "$submission_id" \
                        --key "$work_dir/notary-key.p8" \
                        --key-id "$APPLE_NOTARY_KEY_ID" \
                        --issuer "$APPLE_NOTARY_ISSUER_ID" \
                        "$proof_dir/notarytool-log.json" \
                        >> "$notary_poll_log" 2>&1 \
                        && [ -s "$proof_dir/notarytool-log.json" ]
                      then
                        notary_log_retained=true
                        break
                      fi
                      if [ "$log_attempt" -lt 3 ]; then
                        sleep 5
                      fi
                    done
                    if [ "$notary_log_retained" != true ]; then
                      printf 'Apple rejected submission %s, but its notarization log could not be retrieved.\n' \
                        "$submission_id" > "$proof_dir/notarytool-log-unavailable.txt"
                    fi
                    cat "$proof_dir/notarytool-result.json"
                    echo "::error::Apple rejected notarization submission $submission_id with status $notary_status"
                    exit 1
                    ;;
                  *)
                    cat "$proof_dir/notarytool-result.json"
                    echo "::error::Apple returned unexpected notarization status '$notary_status' for $submission_id"
                    exit 1
                    ;;
                esac
              else
                printf 'attempt=%s malformed_info_response\n' "$attempt" >> "$notary_poll_log"
                cat "$notary_info" >> "$notary_poll_log"
              fi
            else
              printf 'attempt=%s transport_error\n' "$attempt" >> "$notary_poll_log"
              cat "$notary_error" >> "$notary_poll_log"
            fi
            if [ "$attempt" -lt "$max_notary_attempts" ]; then
              sleep "$notary_poll_seconds"
            fi
          done
          if [ "$notary_accepted" != true ]; then
            tail -n 40 "$notary_poll_log" || true
            echo "::error::Notarization timed out after $((max_notary_attempts * notary_poll_seconds / 60)) minutes for submission $submission_id"
            exit 1
          fi
          jq -e '.status == "Accepted"' "$proof_dir/notarytool-result.json"

          cp "$bin" "$work_dir/codestory-cli-quarantined"
          xattr -w com.apple.quarantine "0083;$(date +%s);CodeStory;" "$work_dir/codestory-cli-quarantined"
          xattr -p com.apple.quarantine "$work_dir/codestory-cli-quarantined" \
            > "$proof_dir/executable-quarantine.txt"
          set +e
          spctl --assess --type execute --verbose=4 "$work_dir/codestory-cli-quarantined" \
            > "$proof_dir/spctl-diagnostic.txt" 2>&1
          spctl_status=$?
          set -e
          printf '%s\n' "$spctl_status" > "$proof_dir/spctl-status.txt"
          if [ "$spctl_status" -eq 0 ]; then
            grep -F "source=Notarized Developer ID" "$proof_dir/spctl-diagnostic.txt"
          else
            # spctl does not assess bare Mach-O tools as applications. Keep its
            # diagnostic, then prove the quarantined executable in the next step.
            grep -F "does not seem to be an app" "$proof_dir/spctl-diagnostic.txt"
          fi

      - name: Execute quarantined notarized macOS CLI without signing credentials
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        run: |
          work_dir="$RUNNER_TEMP/codestory-notary-${{ matrix.asset_target }}"
          "$work_dir/codestory-cli-quarantined" --version
          "$work_dir/codestory-cli-quarantined" --help >/dev/null

      - name: Smoke codestory-cli
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.rust_target }}/release/codestory-cli"
          "$bin" --version
          "$bin" --help

      - name: Smoke codestory-cli on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:CARGO_TARGET_DIR "${{ matrix.rust_target }}/release/codestory-cli${{ matrix.exe_suffix }}"
          & $bin --version
          & $bin --help

      - name: Clear release asset output
        run: python -c "import shutil; shutil.rmtree('target/release-dist', ignore_errors=True)"

      - name: Package release asset
        if: runner.os != 'Windows'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          bin="target/${{ matrix.rust_target }}/release/codestory-cli"
          python .github/scripts/package-codestory-release.py \
            --version "$INPUT_VERSION" \
            --target "${{ matrix.asset_target }}" \
            --binary "$bin" \
            --out-dir target/release-dist

      - name: Prove Linux x64 glibc 2.31 baseline
        if: matrix.asset_target == 'linux-x64'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$LINUX_GLIBC_BASELINE_IMAGE" \
            bash -lc '
              set -euo pipefail
              bash .github/scripts/check-linux-glibc-baseline.sh "$@"
            ' bash \
              "target/release-dist/codestory-cli-v${INPUT_VERSION}-linux-x64.tar.gz" \
              "$INPUT_VERSION" \
              target/linux-glibc-baseline \
              "glibc 2.31"

      - name: Upload Linux glibc baseline proof
        if: success() && matrix.asset_target == 'linux-x64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-glibc-2.31-baseline-proof-attempt-${{ github.run_attempt }}
          path: target/linux-glibc-baseline
          if-no-files-found: error
          retention-days: 30

      - name: Smoke packaged release asset
        if: runner.os != 'Windows'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source-identity.outputs.sha }}
          SOURCE_TREE: ${{ steps.source-identity.outputs.tree }}
        run: |
          python .github/scripts/check-packaged-agent-proof.py \
            --archive "target/release-dist/codestory-cli-v${INPUT_VERSION}-${{ matrix.asset_target }}.tar.gz" \
            --checksum-file target/release-dist/SHA256SUMS.txt \
            --expected-version "$INPUT_VERSION" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-source-tree "$SOURCE_TREE" \
            --version-only \
            --out-dir "target/packaged-version-smoke/${{ matrix.asset_target }}"

      - name: Authenticate calibration bundle producer
        if: >-
          matrix.asset_target == 'linux-x64' &&
          inputs.calibration_bundle_artifact != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID")"
          producer_sha="$(jq -r '.head_sha' <<<"$run")"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<<"$run")" = ".github/workflows/packaged-platform-pr.yml"
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$CALIBRATION_ARTIFACT" = "embedding-calibration-bundle-$producer_sha"
          artifact_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$CALIBRATION_ARTIFACT" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | length'
          )"
          test "$artifact_count" = 1

      - name: Download frozen calibration bundle
        if: >-
          matrix.asset_target == 'linux-x64' &&
          inputs.calibration_bundle_artifact != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.calibration_bundle_artifact }}
          path: target/calibration-bundle
          run-id: ${{ inputs.calibration_bundle_run_id }}
          github-token: ${{ github.token }}

      - name: Prove frozen calibration source lineage
        # The source-lineage guard needs the authenticated bundle and full
        # history from the frozen-candidate qualification lane.
        # --version-only stops before the runtime proof but still loads and
        # verifies the bundle, and without --enforce-calibration-freeze-lineage
        # a version-only proof *rejects* calibration inputs outright -- so
        # deleting the flag breaks this step loudly instead of silently
        # dropping the guard.
        if: >-
          matrix.asset_target == 'linux-x64' &&
          inputs.calibration_bundle_artifact != ''
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source-identity.outputs.sha }}
          SOURCE_TREE: ${{ steps.source-identity.outputs.tree }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          test "$(jq -r .status crates/codestory-llama-sys/per-user-embedding-server-constant-set.json)" = frozen
          calibration_bundle="$(find target/calibration-bundle -type f -name calibration-bundle.json -print)"
          test "$(printf '%s\n' "$calibration_bundle" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          python .github/scripts/check-packaged-agent-proof.py \
            --archive "target/release-dist/codestory-cli-v${INPUT_VERSION}-${{ matrix.asset_target }}.tar.gz" \
            --checksum-file target/release-dist/SHA256SUMS.txt \
            --expected-version "$INPUT_VERSION" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-source-tree "$SOURCE_TREE" \
            --version-only \
            --proof-tier hosted_package \
            --calibration-bundle "$calibration_bundle" \
            --calibration-producer-run-id "$CALIBRATION_RUN_ID" \
            --calibration-producer-artifact "$CALIBRATION_ARTIFACT" \
            --enforce-calibration-freeze-lineage \
            --out-dir target/packaged-calibration-lineage

      - name: Upload frozen calibration lineage proof
        if: >-
          always() &&
          matrix.asset_target == 'linux-x64' &&
          inputs.calibration_bundle_artifact != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaged-calibration-lineage-${{ matrix.asset_target }}-attempt-${{ github.run_attempt }}
          path: target/packaged-calibration-lineage
          if-no-files-found: warn
          retention-days: 30

      - name: Package release asset on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $bin = Join-Path $env:CARGO_TARGET_DIR "${{ matrix.rust_target }}/release/codestory-cli${{ matrix.exe_suffix }}"
          python .github/scripts/package-codestory-release.py `
            --version "$env:INPUT_VERSION" `
            --target "${{ matrix.asset_target }}" `
            --binary $bin `
            --out-dir target/release-dist

      - name: Smoke packaged release asset on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source-identity.outputs.sha }}
          SOURCE_TREE: ${{ steps.source-identity.outputs.tree }}
        run: |
          python .github/scripts/check-packaged-agent-proof.py `
            --archive "target/release-dist/codestory-cli-v$($env:INPUT_VERSION)-${{ matrix.asset_target }}.zip" `
            --checksum-file target/release-dist/SHA256SUMS.txt `
            --expected-version "$env:INPUT_VERSION" `
            --expected-source-sha "$env:SOURCE_SHA" `
            --expected-source-tree "$env:SOURCE_TREE" `
            --version-only `
            --out-dir "target/packaged-version-smoke/${{ matrix.asset_target }}"

      - name: Report fresh package identity
        id: fresh-package
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source-identity.outputs.sha }}
          SOURCE_TREE: ${{ steps.source-identity.outputs.tree }}
        run: |
          set -euo pipefail
          archive="target/release-dist/codestory-cli-v${INPUT_VERSION}-${{ matrix.asset_target }}.${{ matrix.extension }}"
          archive_sha256="$(
            python -c 'import hashlib, sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' \
              "$archive"
          )"
          {
            echo "### Fresh package identity"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Source tree: \`$SOURCE_TREE\`"
            echo "- Archive: \`$(basename "$archive")\`"
            echo "- Archive SHA-256: \`$archive_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "archive-sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload packaged version proof
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaged-version-proof-${{ matrix.asset_target }}-attempt-${{ github.run_attempt }}
          path: target/packaged-version-smoke/${{ matrix.asset_target }}
          if-no-files-found: warn
          retention-days: 30

      - name: Run Windows installer ownership self-test
        if: matrix.asset_target == 'windows-x64'
        shell: pwsh
        run: pwsh -File scripts/install-codestory.ps1 -SelfTest

      - name: Emit authenticated package release cell
        if: inputs.emit_release_cells
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$INPUT_REF" \
            --version "$INPUT_VERSION" \
            --cell-id "package_identity:${{ matrix.asset_target }}" \
            --producer-workflow .github/workflows/packaged-platform-proof.yml \
            --producer-job build \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-prepublish-package-${{ matrix.asset_target }}-attempt-$GITHUB_RUN_ATTEMPT" \
            --archive "target/release-dist/codestory-cli-v${INPUT_VERSION}-${{ matrix.asset_target }}.${{ matrix.extension }}" \
            --out "target/release-cells/package_identity-${{ matrix.asset_target }}.json"

      - name: Upload authenticated package release cell
        if: success() && inputs.emit_release_cells
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-package-${{ matrix.asset_target }}-attempt-${{ github.run_attempt }}
          path: target/release-cells/package_identity-${{ matrix.asset_target }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codestory-cli-${{ matrix.asset_target }}
          path: |
            target/release-dist/*.tar.gz
            target/release-dist/*.zip
            target/release-dist/*.sha256
            target/release-dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload macOS notarization proof
        if: always() && runner.os == 'macOS' && inputs.sign_macos
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-notarization-proof-${{ matrix.asset_target }}-attempt-${{ github.run_attempt }}
          path: target/notarization-proof/${{ matrix.asset_target }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary macOS signing material
        if: always() && runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/codestory-signing-${{ matrix.asset_target }}.keychain-db" || true
          rm -rf "$RUNNER_TEMP/codestory-notary-${{ matrix.asset_target }}"

  frozen-linux-qualification:
    name: Frozen Linux fresh-target Cargo boundary
    if: inputs.hermetic_linux
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Require exact frozen source
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_REF"
          test -n "$INPUT_VERSION"

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RELEASE_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RELEASE_RUST_TOOLCHAIN"
          rustup target add x86_64-unknown-linux-gnu

      - name: Prepare checksum-pinned embedded model
        run: node scripts/prepare-embedded-model.mjs

      - name: Build pinned Linux toolchain image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --build-arg "BUILD_IMAGE=$LINUX_GLIBC_BUILD_IMAGE" \
            --build-arg "GLSLC_IMAGE=$LINUX_GLSLC_IMAGE" \
            --file .github/docker/linux-glibc-build.Dockerfile \
            --tag codestory-linux-glibc-build \
            .github/docker

      - name: Prove fresh-target Node-absent network-denied Cargo release boundary
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/codestory-hermetic-release"
          rm -rf "$proof_root"
          mkdir -p "$proof_root/cargo" "$proof_root/home"
          CARGO_HOME="$proof_root/cargo" \
            cargo fetch --locked --target x86_64-unknown-linux-gnu
          model_relative="${CODESTORY_EMBED_MODEL_SOURCE#"$PWD/"}"
          docker run --rm --platform linux/amd64 \
            --network none \
            --read-only \
            --user "$(id -u):$(id -g)" \
            --env CARGO_HOME=/proof/cargo \
            --env CARGO_NET_OFFLINE=true \
            --env CARGO_TARGET_DIR=/proof/target \
            --env CODESTORY_EMBED_MODEL_SOURCE="/workspace/$model_relative" \
            --env CXXFLAGS=-std=c++17 \
            --env HOME=/proof/home \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            --volume "$proof_root:/proof" \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            codestory-linux-glibc-build \
            sh -ceu '
              if command -v node >/dev/null 2>&1; then
                echo "Node must be absent from the frozen Cargo proof" >&2
                exit 1
              fi
              test ! -e "$CARGO_TARGET_DIR"
              cargo check --release --locked --offline -p codestory-llama-sys \
                --target x86_64-unknown-linux-gnu
              cargo build --release --locked --offline -p codestory-llama-sys \
                --target x86_64-unknown-linux-gnu
            '

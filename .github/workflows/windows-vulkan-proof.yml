name: Windows Vulkan proof

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: false
        type: string
      proof_key:
        required: false
        default: ""
        type: string
      use_packaged_cli_artifact:
        required: false
        default: false
        type: boolean
      calibration_bundle_artifact:
        required: false
        default: ""
        type: string
      calibration_bundle_run_id:
        required: false
        default: ""
        type: string
      candidate_installed_proof:
        description: Install and prove the exact package through the candidate-managed launcher boundary.
        required: false
        default: false
        type: boolean
      candidate_producer_workflow_path:
        description: Top-level workflow path authenticated as the candidate artifact producer.
        required: false
        default: ".github/workflows/packaged-platform-pr.yml"
        type: string
      server_behavior_only:
        description: Prove bounded package retrieval readiness without answer-quality or performance claims.
        required: false
        default: false
        type: boolean
      emit_release_cells:
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: read

concurrency:
  group: windows-vulkan-proof-${{ inputs.proof_key || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-vulkan:
    name: Packaged Windows Vulkan engine
    runs-on: [self-hosted, Windows, X64, codestory-vulkan]
    environment: windows-vulkan-proof
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install pinned Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
        env:
          PSExecutionPolicyPreference: Bypass

      - name: Capture host evidence
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Force target/windows-vulkan-proof | Out-Null
          Get-ComputerInfo | Out-File target/windows-vulkan-proof/host.txt
          Get-CimInstance Win32_VideoController |
            Select-Object Name, AdapterCompatibility, DriverVersion, VideoMemoryType |
            Format-List | Out-File -Append target/windows-vulkan-proof/host.txt

      - name: Validate candidate-installed mode
        if: inputs.candidate_installed_proof
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
        run: |
          if ($env:SERVER_BEHAVIOR_ONLY -ne "true") {
            throw "candidate_installed_proof requires server_behavior_only"
          }

      - name: Capture source build tool evidence
        if: ${{ !inputs.use_packaged_cli_artifact }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          "CMAKE_GENERATOR=Ninja" | Out-File -Append target/windows-vulkan-proof/host.txt
          cmake --version | Out-File -Append target/windows-vulkan-proof/host.txt
          ninja --version | Out-File -Append target/windows-vulkan-proof/host.txt

      - name: Install pinned Rust
        if: ${{ !inputs.use_packaged_cli_artifact }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Prepare checksum-pinned embedded model
        if: ${{ !inputs.use_packaged_cli_artifact }}
        # The self-hosted runner service account has the default Restricted execution
        # policy, so every run step must carry the bypass shell or die before running.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: >-
          node scripts/prepare-embedded-model.mjs
          --cache-root "$env:RUNNER_TOOL_CACHE/codestory/model-material"

      - name: Build and package native CLI
        if: ${{ !inputs.use_packaged_cli_artifact }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          VERSION: ${{ inputs.version }}
          CMAKE_GENERATOR: Ninja
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $cargoArgs = @(
            "build",
            "--release",
            "--locked",
            "-p", "codestory-cli",
            "--bin", "codestory-cli",
            "--bin", "codestory-cli-runtime"
          )
          if ($env:SERVER_BEHAVIOR_ONLY -ne "true") {
            $cargoArgs += @(
              "-p", "codestory-bench",
              "--bin", "codestory_embedding_qualification"
            )
          }
          cargo @cargoArgs
          python .github/scripts/package-codestory-release.py `
            --version $version `
            --target windows-x64 `
            --binary target/release/codestory-cli.exe `
            --out-dir target/release-dist

      - name: Authenticate exact Windows candidate artifacts
        id: candidate-artifacts
        if: inputs.use_packaged_cli_artifact
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
        run: |
          $ErrorActionPreference = "Stop"
          $allowedWorkflows = @(
            ".github/workflows/auto-release.yml",
            ".github/workflows/release.yml",
            ".github/workflows/packaged-platform-pr.yml"
          )
          if ($env:CANDIDATE_PRODUCER_WORKFLOW_PATH -notin $allowedWorkflows) {
            throw "candidate producer workflow is not trusted"
          }
          if (
            $env:SERVER_BEHAVIOR_ONLY -ne "true" -and
            $env:CANDIDATE_PRODUCER_WORKFLOW_PATH -ne
              ".github/workflows/packaged-platform-pr.yml"
          ) {
            throw "full qualification requires the exact qualification coordinator"
          }
          $sourceSha = (git rev-parse HEAD).Trim()
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            ConvertFrom-Json
          if (
            $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
            $run.path -ne $env:CANDIDATE_PRODUCER_WORKFLOW_PATH -or
            $run.head_sha -ne $sourceSha -or
            [string]$run.run_attempt -ne $env:GITHUB_RUN_ATTEMPT
          ) {
            throw "Windows package producer is not the trusted exact-head run"
          }
          $artifacts = gh api `
            "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100" |
            ConvertFrom-Json
          function Select-ExactArtifact([string] $name) {
            $selected = @(
              $artifacts.artifacts | Where-Object {
                $_.name -eq $name -and
                $_.expired -eq $false -and
                [string]$_.workflow_run.id -eq $env:GITHUB_RUN_ID -and
                $_.workflow_run.head_sha -eq $sourceSha
              }
            )
            if ($selected.Count -ne 1) {
              throw "expected exactly one authenticated $name artifact"
            }
            return $selected[0]
          }
          $package = Select-ExactArtifact "codestory-cli-windows-x64"
          $record = Select-ExactArtifact `
            "codestory-candidate-archive-record-windows-x64"
          if ($env:SERVER_BEHAVIOR_ONLY -ne "true") {
            $null = Select-ExactArtifact `
              "codestory-qualification-driver-windows-x64"
          }
          if (
            [string]$package.id -notmatch '^[0-9]+$' -or
            [string]$package.size_in_bytes -notmatch '^[0-9]+$' -or
            [string]$package.digest -notmatch '^sha256:[0-9a-f]{64}$' -or
            [string]$record.id -notmatch '^[0-9]+$' -or
            [string]$record.size_in_bytes -notmatch '^[0-9]+$' -or
            [string]$record.digest -notmatch '^sha256:[0-9a-f]{64}$'
          ) {
            throw "candidate artifact metadata is incomplete"
          }
          @(
            "package-id=$($package.id)",
            "package-bytes=$($package.size_in_bytes)",
            "package-sha256=$($package.digest.Substring(7))"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download authenticated candidate record
        if: inputs.use_packaged_cli_artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: codestory-candidate-archive-record-windows-x64
          path: target/candidate-archive-record/windows-x64

      - name: Restore exact candidate archive from protected host
        id: candidate-cache
        if: inputs.use_packaged_cli_artifact
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $recordPath = "target/candidate-archive-record/windows-x64/candidate-archive-record.json"
          $record = Get-Content -Raw -LiteralPath $recordPath | ConvertFrom-Json
          $sourceSha = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if (
            $record.repository -ne $env:GITHUB_REPOSITORY -or
            $record.source.commit -ne $sourceSha -or
            $record.source.tree -ne $sourceTree -or
            $record.target -ne "windows-x64"
          ) {
            throw "candidate record provenance does not match the protected proof"
          }
          $store = Join-Path $env:RUNNER_TOOL_CACHE `
            "codestory/candidate-archives"
          New-Item -ItemType Directory -Force $store | Out-Null
          New-Item -ItemType Directory -Force target | Out-Null
          Remove-Item -Recurse -Force target/release-dist -ErrorAction SilentlyContinue
          $restored = node .github/scripts/candidate-archive-store.mjs restore `
            --record $recordPath `
            --store-root $store `
            --output-root target `
            --output-dir target/release-dist | ConvertFrom-Json
          $hit = "$($restored.hit)".ToLowerInvariant()
          if ($hit -notin @("true", "false")) {
            throw "candidate cache returned an invalid hit state"
          }
          "hit=$hit" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $started
          @(
            "### Candidate archive transfer",
            "",
            "- Protected-host cache lookup and verification: $elapsed ms",
            "- Cache hit: ``$hit``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Download, authenticate, and admit candidate archive on miss
        if: inputs.use_packaged_cli_artifact && steps.candidate-cache.outputs.hit != 'true'
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.candidate-artifacts.outputs.package-id }}
          EXPECTED_SIZE: ${{ steps.candidate-artifacts.outputs.package-bytes }}
          EXPECTED_SHA256: ${{ steps.candidate-artifacts.outputs.package-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $archive = Join-Path $env:RUNNER_TEMP `
            "codestory-cli-windows-x64-$env:ARTIFACT_ID.zip"
          $partial = "$archive.partial"
          Remove-Item -Force $archive, $partial -ErrorAction SilentlyContinue
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"
          $complete = $false
          foreach ($attempt in 1..30) {
            & curl.exe `
              --fail `
              --location `
              --silent `
              --show-error `
              --connect-timeout 30 `
              --max-time 120 `
              --continue-at - `
              --header "Accept: application/vnd.github+json" `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --header "X-GitHub-Api-Version: 2022-11-28" `
              --output $partial `
              $url
            if ($LASTEXITCODE -eq 0) {
              $complete = $true
              break
            }
            $currentSize = if (Test-Path -LiteralPath $partial -PathType Leaf) {
              (Get-Item -LiteralPath $partial).Length
            } else {
              0
            }
            if ($currentSize -gt [long]$env:EXPECTED_SIZE) {
              throw "candidate artifact exceeded its authenticated size"
            }
            if ($currentSize -eq [long]$env:EXPECTED_SIZE) {
              $complete = $true
              break
            }
            Write-Warning `
              "resuming exact candidate at byte $currentSize after attempt $attempt"
            Start-Sleep -Seconds 2
          }
          if (-not $complete) {
            throw "exact candidate artifact transfer did not complete"
          }
          $actualSize = (Get-Item -LiteralPath $partial).Length
          $actualDigest = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $partial
          ).Hash.ToLowerInvariant()
          if (
            $actualSize -ne [long]$env:EXPECTED_SIZE -or
            $actualDigest -ne $env:EXPECTED_SHA256
          ) {
            throw "candidate artifact container identity changed"
          }
          Move-Item -LiteralPath $partial -Destination $archive
          $transferEnded = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $recordPath = "target/candidate-archive-record/windows-x64/candidate-archive-record.json"
          $stage = "target/candidate-archive-stage/windows-x64"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          python .github/scripts/extract-candidate-actions-artifact.py `
            --artifact $archive `
            --record $recordPath `
            --out $stage
          if ($LASTEXITCODE -ne 0) {
            throw "candidate artifact extraction failed"
          }
          $store = Join-Path $env:RUNNER_TOOL_CACHE `
            "codestory/candidate-archives"
          $admitted = node .github/scripts/candidate-archive-store.mjs admit `
            --record $recordPath `
            --input-root $stage `
            --store-root $store `
            --output-root target `
            --output-dir target/release-dist | ConvertFrom-Json
          if (-not $admitted.hit -and -not $admitted.admitted) {
            throw "candidate archive was not admitted or restored"
          }
          $admissionEnded = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          @(
            "- Authenticated Actions transfer: $($transferEnded - $started) ms",
            "- Payload verification and atomic admission: $($admissionEnded - $transferEnded) ms"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Download separate authenticated qualification driver
        if: ${{ inputs.use_packaged_cli_artifact && !inputs.server_behavior_only }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: codestory-qualification-driver-windows-x64
          path: target/qualification-driver-artifact/windows-x64

      - name: Verify packaged qualification driver
        id: qualification-driver
        if: ${{ inputs.use_packaged_cli_artifact && !inputs.server_behavior_only }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          $version = $env:INPUT_VERSION.TrimStart('v')
          $verified = node .github/scripts/qualification-driver-artifact.mjs verify `
            --asset-target windows-x64 `
            --source-sha $sourceSha `
            --source-tree $sourceTree `
            --version $version `
            --archive "target/release-dist/codestory-cli-v$version-windows-x64.zip" `
            --trusted-root $env:GITHUB_WORKSPACE `
            --artifact-dir target/qualification-driver-artifact/windows-x64
          $result = $verified | ConvertFrom-Json
          "path=$($result.driver)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate calibration bundle producer
        if: ${{ !inputs.server_behavior_only }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CALIBRATION_RUN_ID" |
            ConvertFrom-Json
          if (
            $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
            $run.path -ne ".github/workflows/packaged-platform-pr.yml" -or
            $run.event -ne "workflow_dispatch" -or
            $run.conclusion -ne "success" -or
            $env:CALIBRATION_ARTIFACT -ne "embedding-calibration-bundle-$($run.head_sha)"
          ) {
            throw "calibration bundle producer is not the trusted exact-head coordinator run"
          }
          $artifacts = gh api `
            "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CALIBRATION_RUN_ID/artifacts?per_page=100" |
            ConvertFrom-Json
          $artifactCount = @(
            $artifacts.artifacts | Where-Object {
              $_.name -eq $env:CALIBRATION_ARTIFACT -and $_.expired -eq $false
            }
          ).Count
          if ($artifactCount -ne 1) {
            throw "expected exactly one unexpired calibration bundle artifact"
          }

      - name: Download frozen calibration bundle
        if: ${{ !inputs.server_behavior_only }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.calibration_bundle_artifact }}
          path: target/calibration-bundle
          run-id: ${{ inputs.calibration_bundle_run_id }}
          github-token: ${{ github.token }}

      - name: Prove protected Windows Vulkan runtime
        if: ${{ !inputs.candidate_installed_proof }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          VERSION: ${{ inputs.version }}
          CODESTORY_EMBED_ALLOW_CPU: "0"
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
          USE_PACKAGED_CLI_ARTIFACT: ${{ inputs.use_packaged_cli_artifact }}
          VERIFIED_QUALIFICATION_DRIVER: ${{ steps.qualification-driver.outputs.path }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          $sourceSha = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          $claimArgs = @()
          $calibrationArgs = @()
          if ($env:SERVER_BEHAVIOR_ONLY -eq "true") {
            $claimArgs = @("--server-behavior-only")
          } else {
            $calibrationBundles = @(
              Get-ChildItem target/calibration-bundle -Recurse -File -Filter calibration-bundle.json
            )
            if ($calibrationBundles.Count -ne 1) {
              throw "expected exactly one frozen calibration-bundle.json"
            }
            $qualificationDriver = "target/release/codestory_embedding_qualification.exe"
            if ($env:USE_PACKAGED_CLI_ARTIFACT -eq "true") {
              $qualificationDriver = $env:VERIFIED_QUALIFICATION_DRIVER
              if ([String]::IsNullOrWhiteSpace($qualificationDriver)) {
                throw "packaged qualification driver was not verified"
              }
            }
            if (-not (Test-Path -LiteralPath $qualificationDriver -PathType Leaf)) {
              throw "protected Windows proof requires the authenticated qualification driver"
            }
            $claimArgs = @(
              "--produce-qualification-evidence",
              "--qualification-driver", $qualificationDriver,
              "--qualification-evidence", "target/windows-vulkan-proof/qualification.json"
            )
            $calibrationArgs = @(
              "--calibration-bundle", $calibrationBundles[0].FullName,
              "--calibration-producer-run-id", "$env:CALIBRATION_RUN_ID",
              "--calibration-producer-artifact", "$env:CALIBRATION_ARTIFACT"
            )
          }
          python .github/scripts/check-packaged-agent-proof.py `
            --archive "target/release-dist/codestory-cli-v$version-windows-x64.zip" `
            --checksum-file "target/release-dist/codestory-cli-v$version-windows-x64.zip.sha256" `
            --expected-version $version `
            --project "${{ github.workspace }}" `
            --plugin-root plugins/codestory `
            --plugin-handoff `
            --engine-policy accelerated `
            --expected-backend Vulkan `
            --offline `
            --proof-tier protected_hardware `
            --qualification-matrix-cell protected_windows_x64_vulkan `
            @claimArgs `
            @calibrationArgs `
            --expected-source-sha $sourceSha `
            --expected-source-tree $sourceTree `
            --timeout-secs 1800 `
            --out-dir target/windows-vulkan-proof/packaged-agent

      - name: Stage isolated candidate-managed Windows install
        if: inputs.candidate_installed_proof
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([String]::IsNullOrWhiteSpace($env:CANDIDATE_PRODUCER_WORKFLOW_PATH)) {
            throw "candidate producer workflow path is required"
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            ConvertFrom-Json
          if (
            $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
            $run.path -ne $env:CANDIDATE_PRODUCER_WORKFLOW_PATH -or
            $run.head_sha -ne (git rev-parse HEAD).Trim() -or
            [string]$run.run_attempt -ne $env:GITHUB_RUN_ATTEMPT
          ) {
            throw "candidate producer run does not authenticate the checked-out package source"
          }
          $version = $env:VERSION.TrimStart('v')
          $archive = "target/release-dist/codestory-cli-v$version-windows-x64.zip"
          $candidateRoot = Join-Path `
            ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) `
            ("cs-ci-" + [Guid]::NewGuid().ToString("N").Substring(0, 12))
          $candidateRoot = [IO.Path]::GetFullPath($candidateRoot)
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if ($candidateRoot.StartsWith(
            $workspaceRoot + [IO.Path]::DirectorySeparatorChar,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "candidate-managed root must be outside the source checkout"
          }
          New-Item -ItemType Directory -Path $candidateRoot | Out-Null
          "CODESTORY_CANDIDATE_WINDOWS_ROOT=$candidateRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force target/candidate-installed-windows | Out-Null
          python .github/scripts/check-packaged-agent-proof.py `
            --prepare-candidate-installed-proof `
            --archive $archive `
            --checksum-file "target/release-dist/codestory-cli-v$version-windows-x64.zip.sha256" `
            --expected-version $version `
            --plugin-root plugins/codestory `
            --candidate-plugin-root-output (Join-Path $candidateRoot "plugin") `
            --candidate-plugin-data-output (Join-Path $candidateRoot "data") `
            --installed-plugin-attestation-output target/candidate-installed-windows/install-attestation-v2.json `
            --candidate-producer-repository $env:GITHUB_REPOSITORY `
            --candidate-producer-workflow-path $env:CANDIDATE_PRODUCER_WORKFLOW_PATH `
            --candidate-producer-run-id $env:GITHUB_RUN_ID `
            --candidate-producer-run-attempt $env:GITHUB_RUN_ATTEMPT `
            --candidate-artifact-name (Split-Path -Leaf $archive)

      - name: Prove candidate-installed Windows Vulkan runtime
        if: inputs.candidate_installed_proof
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          VERSION: ${{ inputs.version }}
          CODESTORY_EMBED_ALLOW_CPU: "0"
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          $archive = "target/release-dist/codestory-cli-v$version-windows-x64.zip"
          $sourceSha = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          $pluginRoot = Join-Path $env:CODESTORY_CANDIDATE_WINDOWS_ROOT "plugin"
          $pluginData = Join-Path $env:CODESTORY_CANDIDATE_WINDOWS_ROOT "data"
          $proofTemp = Join-Path $env:CODESTORY_CANDIDATE_WINDOWS_ROOT "tmp"
          New-Item -ItemType Directory -Path $proofTemp | Out-Null
          $env:TEMP = $proofTemp
          $env:TMP = $proofTemp
          $env:TMPDIR = $proofTemp
          python .github/scripts/check-packaged-agent-proof.py `
            --archive $archive `
            --checksum-file "target/release-dist/codestory-cli-v$version-windows-x64.zip.sha256" `
            --expected-version $version `
            --project $env:GITHUB_WORKSPACE `
            --plugin-root $pluginRoot `
            --plugin-handoff `
            --engine-policy accelerated `
            --expected-backend Vulkan `
            --offline `
            --proof-tier installed_runtime `
            --server-behavior-only `
            --installed-plugin-attestation target/candidate-installed-windows/install-attestation-v2.json `
            --installed-plugin-data $pluginData `
            --candidate-producer-repository $env:GITHUB_REPOSITORY `
            --candidate-producer-workflow-path $env:CANDIDATE_PRODUCER_WORKFLOW_PATH `
            --candidate-producer-run-id $env:GITHUB_RUN_ID `
            --candidate-producer-run-attempt $env:GITHUB_RUN_ATTEMPT `
            --candidate-artifact-name (Split-Path -Leaf $archive) `
            --expected-source-sha $sourceSha `
            --expected-source-tree $sourceTree `
            --timeout-secs 1800 `
            --out-dir target/candidate-installed-windows/proof

      - name: Upload candidate-installed Windows proof
        if: always() && inputs.candidate_installed_proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-installed-windows-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: target/candidate-installed-windows
          if-no-files-found: error
          retention-days: 30

      - name: Emit authenticated Vulkan release cell
        if: inputs.emit_release_cells
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          version="${version#v}"
          jq -n \
            --arg native_engine coderank_q8_embedded \
            '{native_engine: $native_engine}' \
            > target/windows-vulkan-proof/release-cell-identity.json
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$INPUT_REF" \
            --version "$version" \
            --cell-id accelerator_execution:windows-x64-vulkan \
            --producer-workflow .github/workflows/windows-vulkan-proof.yml \
            --producer-job packaged-vulkan \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-prepublish-windows-x64-vulkan-attempt-$GITHUB_RUN_ATTEMPT" \
            --identity target/windows-vulkan-proof/release-cell-identity.json \
            --archive "target/release-dist/codestory-cli-v${version}-windows-x64.zip" \
            --out target/release-cells/accelerator_execution-windows-x64-vulkan.json

      - name: Upload authenticated Vulkan release cell
        if: success() && inputs.emit_release_cells
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-windows-x64-vulkan-attempt-${{ github.run_attempt }}
          path: target/release-cells/accelerator_execution-windows-x64-vulkan.json
          if-no-files-found: error
          retention-days: 30

      - name: Emit authenticated Windows retrieval-readiness release cell
        if: inputs.emit_release_cells && inputs.server_behavior_only
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          version="${version#v}"
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$INPUT_REF" \
            --version "$version" \
            --cell-id retrieval_readiness:windows-x64 \
            --producer-workflow .github/workflows/windows-vulkan-proof.yml \
            --producer-job packaged-vulkan \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-postpublish-retrieval-windows-x64-attempt-$GITHUB_RUN_ATTEMPT" \
            --archive "target/release-dist/codestory-cli-v${version}-windows-x64.zip" \
            --out target/release-cells/retrieval_readiness-windows-x64.json

      - name: Upload authenticated Windows retrieval-readiness release cell
        if: success() && inputs.emit_release_cells && inputs.server_behavior_only
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-postpublish-retrieval-windows-x64-attempt-${{ github.run_attempt }}
          path: target/release-cells/retrieval_readiness-windows-x64.json
          if-no-files-found: error
          retention-days: 30

      - name: Emit authenticated candidate-installed Windows release cell
        if: inputs.emit_release_cells && inputs.candidate_installed_proof
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          version="${version#v}"
          jq -n \
            --arg installer candidate_managed_plugin \
            --arg runtime_version "$version" \
            --arg native_engine coderank_q8_embedded \
            '{installer: $installer, runtime_version: $runtime_version, native_engine: $native_engine}' \
            > target/candidate-installed-windows/release-cell-identity.json
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$INPUT_REF" \
            --version "$version" \
            --cell-id candidate_installed_behavior:windows-x64 \
            --producer-workflow .github/workflows/windows-vulkan-proof.yml \
            --producer-job packaged-vulkan \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-prepublish-candidate-installed-windows-x64-attempt-$GITHUB_RUN_ATTEMPT" \
            --identity target/candidate-installed-windows/release-cell-identity.json \
            --archive "target/release-dist/codestory-cli-v${version}-windows-x64.zip" \
            --out target/release-cells/candidate_installed_behavior-windows-x64.json

      - name: Upload authenticated candidate-installed Windows release cell
        if: success() && inputs.emit_release_cells && inputs.candidate_installed_proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-candidate-installed-windows-x64-attempt-${{ github.run_attempt }}
          path: target/release-cells/candidate_installed_behavior-windows-x64.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Vulkan proof artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-vulkan-proof-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: target/windows-vulkan-proof
          if-no-files-found: error
          retention-days: 30

      - name: Clean candidate-managed Windows install
        if: always() && inputs.candidate_installed_proof
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          if ([String]::IsNullOrWhiteSpace($env:CODESTORY_CANDIDATE_WINDOWS_ROOT)) {
            return
          }
          $candidateRoot = [IO.Path]::GetFullPath($env:CODESTORY_CANDIDATE_WINDOWS_ROOT)
          $candidateLeaf = [IO.Path]::GetFileName($candidateRoot)
          $candidateParent = [IO.Path]::GetDirectoryName($candidateRoot)
          $expectedParent = [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          if (
            $candidateLeaf -notmatch '^cs-ci-[0-9a-f]{12}$' -or
            $candidateParent -ne $expectedParent
          ) {
            throw "refusing to clean unexpected candidate-managed root: $candidateRoot"
          }
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              if (Test-Path -LiteralPath $candidateRoot) {
                Remove-Item -LiteralPath $candidateRoot -Recurse -Force
              }
              break
            } catch {
              if ($attempt -eq 30) {
                throw
              }
              Start-Sleep -Seconds 1
            }
          }

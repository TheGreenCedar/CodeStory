# Retrieval smoke: hosted jobs may use the test-only CPU fixture seam to
# exercise CPU-shaped failure boundaries. It is not a product CPU mode and
# makes no hardware claim; protected workflows own Metal and Vulkan proof.
# Contract: docs/ops/retrieval-engine.md#proof-boundary

name: retrieval-engine-smoke

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - vendor/**/Cargo.toml
      - crates/codestory-llama-sys/**
      - crates/codestory-retrieval/src/embeddings.rs
      - crates/codestory-retrieval/src/health.rs
      - crates/codestory-retrieval/src/per_user_embedding.rs
      - crates/codestory-retrieval/src/embedding_server_compat.rs
      - crates/codestory-cli/src/embedding_server_transport.rs
      - crates/codestory-retrieval/src/index.rs
      - crates/codestory-retrieval/src/query.rs
      - crates/codestory-cli/src/readiness.rs
      - crates/codestory-cli/src/stdio_transport.rs
      # This job runs the generalization gate, so it has to trigger on the code
      # that gate guards, on the corpus its bans are derived from, on the
      # non-Rust product surfaces it also scans, and on the lint itself.
      # scripts/tests/lint-retrieval-generalization.test.mjs keeps this list
      # covering every path the lint reports as guarded. The globs are
      # whole trees on purpose: the lint reads every crate's `src`, all three
      # eval corpora, and every file under `scripts/`, `.github/`,
      # `.cursor/rules` and `plugins/codestory`. A filter narrower than what the
      # lint reads is a gate that never fires on the code it guards.
      - crates/**
      - benchmarks/tasks/**
      - scripts/**
      - .github/**
      - .cursor/rules/**
      - plugins/codestory/**
      - .codex/environments/environment.toml
      - .github/scripts/install-windows-vulkan-sdk.ps1
      - .github/workflows/rust-ci.yml
      - scripts/lint-retrieval-generalization.mjs
      - scripts/lib/retrieval-generalization-lint.mjs
      - scripts/tests/lint-retrieval-generalization.test.mjs
      - scripts/prepare-embedded-model.mjs
      - docs/contributors/testing-matrix.md
      - docs/ops/retrieval-engine.md
      - docs/testing/retrieval-architecture.md
  # Base-branch runs seed caches that sibling PRs are allowed to restore.
  push:
    branches:
      - main
      - dev/codestory-next
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - vendor/**/Cargo.toml
      - crates/codestory-llama-sys/**
      - crates/codestory-retrieval/src/embeddings.rs
      - crates/codestory-retrieval/src/health.rs
      - crates/codestory-retrieval/src/per_user_embedding.rs
      - crates/codestory-retrieval/src/embedding_server_compat.rs
      - crates/codestory-cli/src/embedding_server_transport.rs
      - crates/codestory-retrieval/src/index.rs
      - crates/codestory-retrieval/src/query.rs
      - crates/codestory-cli/src/readiness.rs
      - crates/codestory-cli/src/stdio_transport.rs
      # This job runs the generalization gate, so it has to trigger on the code
      # that gate guards, on the corpus its bans are derived from, on the
      # non-Rust product surfaces it also scans, and on the lint itself.
      # scripts/tests/lint-retrieval-generalization.test.mjs keeps this list
      # covering every path the lint reports as guarded. The globs are
      # whole trees on purpose: the lint reads every crate's `src`, all three
      # eval corpora, and every file under `scripts/`, `.github/`,
      # `.cursor/rules` and `plugins/codestory`. A filter narrower than what the
      # lint reads is a gate that never fires on the code it guards.
      - crates/**
      - benchmarks/tasks/**
      - scripts/**
      - .github/**
      - .cursor/rules/**
      - plugins/codestory/**
      - .codex/environments/environment.toml
      - .github/scripts/install-windows-vulkan-sdk.ps1
      - .github/workflows/rust-ci.yml
      - scripts/lint-retrieval-generalization.mjs
      - scripts/lib/retrieval-generalization-lint.mjs
      - scripts/tests/lint-retrieval-generalization.test.mjs
      - scripts/prepare-embedded-model.mjs
      - docs/contributors/testing-matrix.md
      - docs/ops/retrieval-engine.md
      - docs/testing/retrieval-architecture.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-engine-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODESTORY_TEST_EMBED_ALLOW_CPU: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generalization lint (production paths)
        run: node scripts/lint-retrieval-generalization.mjs

      - name: Generalization lint hostile matrix
        run: node --test scripts/tests/lint-retrieval-generalization.test.mjs

      - name: Release evidence gate contracts
        run: node --test scripts/tests/codestory-release-evidence-gate.test.mjs

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux Vulkan build dependencies
        run: bash .github/scripts/install-linux-vulkan-build-deps.sh

      - name: Capture Rust cache key
        id: rust-cache-key
        shell: bash
        run: |
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "target=$(rustc -Vv | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo registry, git sources, and build output
        id: cargo-cache-restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ steps.rust-cache-key.outputs.version }}-${{ steps.rust-cache-key.outputs.target }}-retrieval-contracts-proof5-v1-64015a841a2f69f33f7c9ce284f671ad27b3923a58db865fd4806d86230df6c5-default-features-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'vendor/**/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: Runtime retrieval and packet contract tests
        run: |
          cargo test --locked -p codestory-runtime --lib agent::retrieval_primary::tests
          cargo test --locked -p codestory-runtime --lib agent::packet_search::tests
          cargo test --locked -p codestory-runtime --lib agent::packet_claim_profile
          cargo test --locked -p codestory-runtime --lib -- --exact tests::search_scoring_tests::search_rejects_natural_language_queries_without_full_sidecars
          cargo test --locked -p codestory-runtime --lib -- --exact tests::repo_text_tests::search_results_ignores_repo_text_hits_without_full_sidecars
          cargo test --locked -p codestory-runtime --lib -- --exact tests::repo_text_tests::repo_text_auto_fallback_is_not_product_search_without_full_sidecars

      # Merged proof suites from EV-FIX (#1718), READY-A (#1727), HOOK (#1672),
      # and W1.SEC (#1643) previously ran only in the dispatch-gated workspace
      # suite; a regression in any of them merged green. This step is their
      # per-PR lane (#1735).
      - name: Evidence, readiness, hooks, and workspace contract tests
        run: |
          cargo test --locked -p codestory-runtime --lib agent::packet_evidence::
          cargo test --locked -p codestory-runtime --lib agent::packet_compiler::tests
          cargo test --locked -p codestory-runtime --lib agent::packet_batch::
          cargo test --locked -p codestory-runtime --lib tests::search_scoring_tests::
          cargo test --locked -p codestory-runtime --lib services::
          cargo test --locked -p codestory-cli --lib
          cargo test --locked -p codestory-workspace
          cargo test --locked -p codestory-agent

      - name: Stdio protocol contract tests
        run: cargo test --locked -p codestory-cli --test stdio_protocol_contracts

      - name: CLI search JSON fail-closed contract tests
        run: cargo test --locked -p codestory-cli --test search_json_output

      - name: Packet/search fixture and baseline contract tests
        run: cargo test --locked -p codestory-cli --test packet_search_eval

      - name: Retrieval crate unit tests
        run: |
          cargo test --locked -p codestory-retrieval
          # Rollback activation fixtures need an admissible embedding device,
          # which only exists under test-support (EV-9, #1652). Without this
          # invocation the whole module is compiled out of the PR lane.
          cargo test --locked -p codestory-retrieval --features test-support --lib rollback::

      - name: Architecture ownership contract tests
        run: cargo test --locked -p codestory-cli --test architecture_contracts

      - name: Seed draft proof test-profile artifacts
        run: |
          cargo test --locked -p codestory-llama-sys --test native_staging --no-run
          cargo test --locked -p codestory-llama-sys --test model_staging --no-run
          cargo test --locked -p codestory-cli --test stdio_protocol_contracts --no-run two_stdio_processes_observe_only_complete_generations_during_real_refresh -- --nocapture
          cargo test --locked -p codestory-runtime --no-run publication_transitions_fail_or_cancel_atomically -- --nocapture
          cargo test --locked -p codestory-store --no-run staged_promotion_abort_recovers_old_or_complete_new_and_cleans_artifacts -- --nocapture

      - name: Save Cargo registry, git sources, and build output
        if: success() && steps.cargo-cache-restore.outputs.cache-hit != 'true' && steps.cargo-cache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}

  windows-manifest-missing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CODESTORY_TEST_EMBED_ALLOW_CPU: "1"
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install checksum-pinned Windows Vulkan SDK
        shell: pwsh
        run: .github/scripts/install-windows-vulkan-sdk.ps1

      - name: Capture Rust cache identity
        id: rust-cache-key
        shell: pwsh
        run: |
          $release = rustc -Vv | Select-String '^release: ' | ForEach-Object { $_.ToString().Substring(9) }
          $target = rustc -Vv | Select-String '^host: ' | ForEach-Object { $_.ToString().Substring(6) }
          $cmake = (cmake --version | Select-Object -First 1) -replace '^cmake version ', ''
          $ninja = (ninja --version).Trim()
          "version=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "target=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "cmake=$cmake" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ninja=$ninja" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Windows Cargo inputs and output
        id: cargo-cache-restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ steps.rust-cache-key.outputs.version }}-${{ steps.rust-cache-key.outputs.target }}-windows-ready-command-v2-a6923d8bb320ad402d87ba9fa9cd27449db876f2c15eac25b865ed25a63ac790-generator-ninja-cmake-${{ steps.rust-cache-key.outputs.cmake }}-ninja-${{ steps.rust-cache-key.outputs.ninja }}-default-features-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'vendor/**/Cargo.toml') }}-${{ hashFiles('.github/scripts/install-windows-vulkan-sdk.ps1') }}-${{ hashFiles('Cargo.lock') }}

      - name: Prove Windows ready_command manifest-missing contract
        shell: pwsh
        run: cargo test --locked -p codestory-cli --test ready_command

      - name: Save Windows Cargo inputs and output
        if: success() && steps.cargo-cache-restore.outputs.cache-hit != 'true' && steps.cargo-cache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}

name: Linux Vulkan proof

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      proof_key:
        required: false
        default: ""
        type: string
      package_run_id:
        description: Optional upstream run containing the Linux package for a standalone proof.
        required: false
        default: ""
        type: string
      quality_evidence_artifact:
        description: Exact-head protected Metal quality artifact.
        required: false
        default: ""
        type: string
      quality_evidence_run_id:
        description: Workflow run that produced the protected Metal quality artifact.
        required: false
        default: ""
        type: string
      calibration_bundle_artifact:
        required: false
        default: ""
        type: string
      calibration_bundle_run_id:
        required: false
        default: ""
        type: string
      candidate_installed_proof:
        description: Install and prove the exact package through the candidate-managed launcher boundary.
        required: false
        default: false
        type: boolean
      candidate_producer_workflow_path:
        description: Top-level workflow path authenticated as the candidate artifact producer.
        required: false
        default: ".github/workflows/release.yml"
        type: string
      server_behavior_only:
        description: Prove bounded package retrieval readiness without answer-quality or performance claims.
        required: false
        default: true
        type: boolean
      emit_release_cells:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      proof_key:
        required: false
        type: string
      package_run_id:
        description: Upstream packaged-platform run containing codestory-cli-linux-x64; omitted for standalone constant calibration.
        required: false
        default: ""
        type: string
      quality_evidence_artifact:
        description: Exact-head protected Metal quality artifact.
        required: false
        default: ""
        type: string
      quality_evidence_run_id:
        description: Workflow run that produced the protected Metal quality artifact.
        required: false
        default: ""
        type: string
      calibration_bundle_artifact:
        required: false
        default: ""
        type: string
      calibration_bundle_run_id:
        required: false
        default: ""
        type: string
      candidate_installed_proof:
        description: Install and prove the exact package through the candidate-managed launcher boundary.
        required: false
        default: true
        type: boolean
      candidate_producer_workflow_path:
        description: Top-level workflow path authenticated as the candidate artifact producer.
        required: false
        default: ".github/workflows/packaged-platform-pr.yml"
        type: string
      server_behavior_only:
        description: Prove bounded package retrieval readiness without answer-quality or performance claims.
        required: false
        default: true
        type: boolean
      constant_calibration_mode:
        description: Collect optional Linux Vulkan constant-calibration evidence without feeding the frozen bundle.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: linux-vulkan-proof-${{ inputs.proof_key || inputs.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Validate Linux proof dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an upstream package for standalone protected proof
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONSTANT_CALIBRATION_MODE: ${{ inputs.constant_calibration_mode }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$CONSTANT_CALIBRATION_MODE" != true ]; then
            test -n "$PACKAGE_RUN_ID"
          fi

  packaged-vulkan:
    if: ${{ !inputs.constant_calibration_mode }}
    needs: route
    name: Packaged Linux Vulkan engine
    runs-on: [self-hosted, Linux, X64, codestory-linux-vulkan]
    environment: linux-vulkan-proof
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install pinned Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Capture Linux Vulkan host evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/linux-vulkan-proof
          {
            uname -a
            uname -m
            lscpu
            command -v vulkaninfo
            vulkaninfo --summary
          } > target/linux-vulkan-proof/host.txt 2>&1
          test "$(uname -m)" = x86_64

      - name: Validate candidate-installed mode
        if: inputs.candidate_installed_proof
        shell: bash
        env:
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
        run: test "$SERVER_BEHAVIOR_ONLY" = true

      - name: Authenticate exact Linux candidate artifacts
        id: candidate-artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || github.run_id }}
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_PRODUCER_WORKFLOW_PATH"
          case "$CANDIDATE_PRODUCER_WORKFLOW_PATH" in
            .github/workflows/auto-release.yml | \
            .github/workflows/release.yml | \
            .github/workflows/packaged-platform-pr.yml)
              ;;
            *)
              exit 1
              ;;
          esac
          if [ "$SERVER_BEHAVIOR_ONLY" != true ]; then
            test "$CANDIDATE_PRODUCER_WORKFLOW_PATH" = \
              .github/workflows/packaged-platform-pr.yml
          fi
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID")"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<<"$run")" = "$CANDIDATE_PRODUCER_WORKFLOW_PATH"
          test "$(jq -r '.head_sha' <<<"$run")" = "$(git rev-parse HEAD)"
          if [ "$PACKAGE_RUN_ID" = "$GITHUB_RUN_ID" ]; then
            test "$(jq -r '.run_attempt' <<<"$run")" = "$GITHUB_RUN_ATTEMPT"
          else
            test "$(jq -r '.status' <<<"$run")" = completed
            test "$(jq -r '.conclusion' <<<"$run")" = success
          fi
          artifacts="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID/artifacts?per_page=100"
          )"
          select_artifact() {
            local name="$1"
            jq \
              --arg name "$name" \
              --arg sha "$(git rev-parse HEAD)" \
              --argjson run_id "$PACKAGE_RUN_ID" \
              '[
                .artifacts[]
                | select(
                    .name == $name
                    and .expired == false
                    and .workflow_run.id == $run_id
                    and .workflow_run.head_sha == $sha
                  )
              ] | if length == 1 then .[0] else error("expected one exact candidate artifact") end' \
              <<<"$artifacts"
          }
          artifact="$(select_artifact codestory-cli-linux-x64)"
          record_artifact="$(
            select_artifact codestory-candidate-archive-record-linux-x64
          )"
          if [ "$SERVER_BEHAVIOR_ONLY" != true ]; then
            select_artifact codestory-qualification-driver-linux-x64 >/dev/null
          fi
          artifact_id="$(jq -r .id <<<"$artifact")"
          expected_size="$(jq -r .size_in_bytes <<<"$artifact")"
          expected_digest="$(jq -r .digest <<<"$artifact")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$expected_size" =~ ^[0-9]+$ ]]
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(jq -r .id <<<"$record_artifact")" =~ ^[0-9]+$ ]]
          [[ "$(jq -r .size_in_bytes <<<"$record_artifact")" =~ ^[0-9]+$ ]]
          [[ "$(jq -r .digest <<<"$record_artifact")" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "package-id=$artifact_id"
            echo "package-bytes=$expected_size"
            echo "package-sha256=${expected_digest#sha256:}"
          } >> "$GITHUB_OUTPUT"

      - name: Download authenticated candidate record
        uses: actions/download-artifact@v8.0.1
        with:
          name: codestory-candidate-archive-record-linux-x64
          path: target/candidate-archive-record/linux-x64
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore exact candidate archive from protected host
        id: candidate-cache
        shell: bash
        run: |
          set -euo pipefail
          started_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          record=target/candidate-archive-record/linux-x64/candidate-archive-record.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$(git rev-parse HEAD)" \
            --arg source_tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg target linux-x64 \
            '.repository == $repository
              and .source.commit == $source_sha
              and .source.tree == $source_tree
              and .target == $target' \
            "$record" >/dev/null
          store="$RUNNER_TOOL_CACHE/codestory/candidate-archives"
          mkdir -p "$store" target
          rm -rf target/release-dist
          restored="$(
            node .github/scripts/candidate-archive-store.mjs restore \
              --record "$record" \
              --store-root "$store" \
              --output-root target \
              --output-dir target/release-dist
          )"
          hit="$(jq -r .hit <<<"$restored")"
          test "$hit" = true || test "$hit" = false
          finished_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          elapsed_ms=$(((finished_ns - started_ns) / 1000000))
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          {
            echo "### Candidate archive transfer"
            echo
            echo "- Protected-host cache lookup and verification: ${elapsed_ms} ms"
            echo "- Cache hit: \`$hit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download, authenticate, and admit candidate archive on miss
        if: steps.candidate-cache.outputs.hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.candidate-artifacts.outputs.package-id }}
          EXPECTED_SIZE: ${{ steps.candidate-artifacts.outputs.package-bytes }}
          EXPECTED_SHA256: ${{ steps.candidate-artifacts.outputs.package-sha256 }}
        run: |
          set -euo pipefail
          transfer_started_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          archive="$RUNNER_TEMP/codestory-cli-linux-x64-$ARTIFACT_ID.zip"
          partial="$archive.partial"
          download_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          rm -f "$archive" "$partial"
          trap 'rm -f "$archive" "$partial"' EXIT
          complete=false
          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 30 \
              --max-time 120 \
              --continue-at - \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$partial" \
              "$download_url"; then
              complete=true
              break
            fi
            current_size=0
            test ! -f "$partial" || current_size="$(stat -c %s "$partial")"
            test "$current_size" -le "$EXPECTED_SIZE"
            if [ "$current_size" = "$EXPECTED_SIZE" ]; then
              complete=true
              break
            fi
            echo "::warning title=Linux artifact transfer interrupted::Resuming the exact candidate at byte $current_size after attempt $attempt"
            sleep 2
          done
          test "$complete" = true
          actual_size="$(stat -c %s "$partial")"
          actual_digest="$(sha256sum "$partial" | awk '{print $1}')"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_digest" = "$EXPECTED_SHA256"
          mv "$partial" "$archive"
          transfer_finished_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          record=target/candidate-archive-record/linux-x64/candidate-archive-record.json
          stage=target/candidate-archive-stage/linux-x64
          rm -rf "$stage"
          python3 .github/scripts/extract-candidate-actions-artifact.py \
            --artifact "$archive" \
            --record "$record" \
            --out "$stage"
          admitted="$(
            node .github/scripts/candidate-archive-store.mjs admit \
              --record "$record" \
              --input-root "$stage" \
              --store-root "$RUNNER_TOOL_CACHE/codestory/candidate-archives" \
              --output-root target \
              --output-dir target/release-dist
          )"
          test "$(jq -r .hit <<<"$admitted")" = true || \
            test "$(jq -r .admitted <<<"$admitted")" = true
          admission_finished_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          transfer_ms=$(((transfer_finished_ns - transfer_started_ns) / 1000000))
          verification_ms=$(((admission_finished_ns - transfer_finished_ns) / 1000000))
          {
            echo "- Authenticated Actions transfer: ${transfer_ms} ms"
            echo "- Payload verification and atomic admission: ${verification_ms} ms"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download separate authenticated qualification driver
        if: ${{ !inputs.server_behavior_only }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: codestory-qualification-driver-linux-x64
          path: target/qualification-driver-artifact/linux-x64
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify packaged qualification driver
        id: qualification-driver
        if: ${{ !inputs.server_behavior_only }}
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          verified="$(
            node .github/scripts/qualification-driver-artifact.mjs verify \
              --asset-target linux-x64 \
              --source-sha "$(git rev-parse HEAD)" \
              --source-tree "$(git rev-parse 'HEAD^{tree}')" \
              --version "$version" \
              --archive "target/release-dist/codestory-cli-v${version}-linux-x64.tar.gz" \
              --trusted-root "$GITHUB_WORKSPACE" \
              --artifact-dir target/qualification-driver-artifact/linux-x64
          )"
          echo "path=$(jq -r .driver <<<"$verified")" >> "$GITHUB_OUTPUT"

      - name: Authenticate calibration bundle producer
        if: ${{ !inputs.server_behavior_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID")"
          producer_sha="$(jq -r '.head_sha' <<<"$run")"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<<"$run")" = ".github/workflows/packaged-platform-pr.yml"
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$CALIBRATION_ARTIFACT" = "embedding-calibration-bundle-$producer_sha"
          artifact_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$CALIBRATION_ARTIFACT" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | length'
          )"
          test "$artifact_count" = 1

      - name: Download frozen calibration bundle
        if: ${{ !inputs.server_behavior_only }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.calibration_bundle_artifact }}
          path: target/calibration-bundle
          run-id: ${{ inputs.calibration_bundle_run_id }}
          github-token: ${{ github.token }}

      - name: Authenticate protected Metal quality producer
        if: ${{ !inputs.server_behavior_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_ARTIFACT: ${{ inputs.quality_evidence_artifact }}
          QUALITY_RUN_ID: ${{ inputs.quality_evidence_run_id }}
        run: |
          set -euo pipefail
          test -n "$QUALITY_ARTIFACT"
          test -n "$QUALITY_RUN_ID"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN_ID")"
          producer_sha="$(jq -r '.head_sha' <<<"$run")"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<<"$run")" = ".github/workflows/packaged-platform-pr.yml"
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$producer_sha" = "$(git rev-parse HEAD)"
          test "$QUALITY_ARTIFACT" = "frozen-candidate-quality-$producer_sha"
          artifact_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$QUALITY_ARTIFACT" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | length'
          )"
          test "$artifact_count" = 1

      - name: Download exact-head protected Metal quality evidence
        if: ${{ !inputs.server_behavior_only }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.quality_evidence_artifact }}
          path: target/release-quality-evidence
          run-id: ${{ inputs.quality_evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Prove offline Linux Vulkan retrieval
        if: ${{ !inputs.candidate_installed_proof }}
        shell: bash
        env:
          CODESTORY_EMBED_ALLOW_CPU: "0"
          INPUT_VERSION: ${{ inputs.version }}
          SERVER_BEHAVIOR_ONLY: ${{ inputs.server_behavior_only }}
          VERIFIED_QUALIFICATION_DRIVER: ${{ steps.qualification-driver.outputs.path }}
          CALIBRATION_ARTIFACT: ${{ inputs.calibration_bundle_artifact }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_bundle_run_id }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          version="${version#v}"
          archive="target/release-dist/codestory-cli-v${version}-linux-x64.tar.gz"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          claim_args=()
          quality_args=()
          qualification_args=()
          calibration_args=()
          if [ "$SERVER_BEHAVIOR_ONLY" = true ]; then
            claim_args=(--server-behavior-only)
          else
            calibration_bundle="$(find target/calibration-bundle -type f -name calibration-bundle.json -print)"
            test "$(printf '%s\n' "$calibration_bundle" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
            qualification_driver="$VERIFIED_QUALIFICATION_DRIVER"
            test -n "$qualification_driver"
            test -x "$qualification_driver"
            quality_path=target/release-quality-evidence/packet/packet-runtime-summary.json
            test -f "$quality_path"
            quality_args=(--retrieval-quality-evidence "$quality_path")
            qualification_args=(
              --produce-qualification-evidence
              --qualification-driver "$qualification_driver"
              --qualification-evidence target/linux-vulkan-proof/qualification.json
            )
            calibration_args=(
              --calibration-bundle "$calibration_bundle"
              --calibration-producer-run-id "$CALIBRATION_RUN_ID"
              --calibration-producer-artifact "$CALIBRATION_ARTIFACT"
            )
          fi
          python .github/scripts/check-packaged-agent-proof.py \
            --archive "$archive" \
            --checksum-file target/release-dist/SHA256SUMS.txt \
            --expected-version "$version" \
            --project "$GITHUB_WORKSPACE" \
            --plugin-root plugins/codestory \
            --plugin-handoff \
            --engine-policy accelerated \
            --expected-backend Vulkan \
            --offline \
            --proof-tier protected_hardware \
            --qualification-matrix-cell protected_linux_x64_vulkan \
            "${claim_args[@]}" \
            "${qualification_args[@]}" \
            "${calibration_args[@]}" \
            --expected-source-sha "$source_sha" \
            --expected-source-tree "$source_tree" \
            "${quality_args[@]}" \
            --timeout-secs 1800 \
            --out-dir target/linux-vulkan-proof/packaged-agent

      - name: Stage isolated candidate-managed Linux install
        if: inputs.candidate_installed_proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
          INPUT_VERSION: ${{ inputs.version }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id || github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CANDIDATE_PRODUCER_WORKFLOW_PATH"
          candidate_producer_run_id="$PACKAGE_RUN_ID"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_producer_run_id")"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<<"$run")" = "$CANDIDATE_PRODUCER_WORKFLOW_PATH"
          test "$(jq -r '.head_sha' <<<"$run")" = "$(git rev-parse HEAD)"
          candidate_producer_run_attempt="$(jq -r '.run_attempt' <<<"$run")"
          test "$candidate_producer_run_attempt" -ge 1
          echo "CODESTORY_CANDIDATE_PRODUCER_RUN_ID=$candidate_producer_run_id" >> "$GITHUB_ENV"
          echo "CODESTORY_CANDIDATE_PRODUCER_RUN_ATTEMPT=$candidate_producer_run_attempt" >> "$GITHUB_ENV"
          version="$INPUT_VERSION"
          version="${version#v}"
          archive="target/release-dist/codestory-cli-v${version}-linux-x64.tar.gz"
          candidate_root="$(mktemp -d "$RUNNER_TEMP/codestory-candidate-installed-linux.XXXXXX")"
          candidate_root="$(cd "$candidate_root" && pwd -P)"
          case "$candidate_root/" in
            "$GITHUB_WORKSPACE/"*)
              echo "::error::Candidate-managed root must be outside the source checkout."
              exit 1
              ;;
          esac
          echo "CODESTORY_CANDIDATE_LINUX_ROOT=$candidate_root" >> "$GITHUB_ENV"
          mkdir -p target/candidate-installed-linux
          python .github/scripts/check-packaged-agent-proof.py \
            --prepare-candidate-installed-proof \
            --archive "$archive" \
            --checksum-file target/release-dist/SHA256SUMS.txt \
            --expected-version "$version" \
            --plugin-root plugins/codestory \
            --candidate-plugin-root-output "$candidate_root/plugin" \
            --candidate-plugin-data-output "$candidate_root/data" \
            --installed-plugin-attestation-output target/candidate-installed-linux/install-attestation-v2.json \
            --candidate-producer-repository "$GITHUB_REPOSITORY" \
            --candidate-producer-workflow-path "$CANDIDATE_PRODUCER_WORKFLOW_PATH" \
            --candidate-producer-run-id "$candidate_producer_run_id" \
            --candidate-producer-run-attempt "$candidate_producer_run_attempt" \
            --candidate-artifact-name "$(basename "$archive")"

      - name: Prove candidate-installed Linux Vulkan runtime
        if: inputs.candidate_installed_proof
        shell: bash
        env:
          CODESTORY_EMBED_ALLOW_CPU: "0"
          CANDIDATE_PRODUCER_WORKFLOW_PATH: ${{ inputs.candidate_producer_workflow_path }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          version="${version#v}"
          archive="target/release-dist/codestory-cli-v${version}-linux-x64.tar.gz"
          python .github/scripts/check-packaged-agent-proof.py \
            --archive "$archive" \
            --checksum-file target/release-dist/SHA256SUMS.txt \
            --expected-version "$version" \
            --project "$GITHUB_WORKSPACE" \
            --plugin-root "$CODESTORY_CANDIDATE_LINUX_ROOT/plugin" \
            --plugin-handoff \
            --engine-policy accelerated \
            --expected-backend Vulkan \
            --offline \
            --proof-tier installed_runtime \
            --server-behavior-only \
            --installed-plugin-attestation target/candidate-installed-linux/install-attestation-v2.json \
            --installed-plugin-data "$CODESTORY_CANDIDATE_LINUX_ROOT/data" \
            --candidate-producer-repository "$GITHUB_REPOSITORY" \
            --candidate-producer-workflow-path "$CANDIDATE_PRODUCER_WORKFLOW_PATH" \
            --candidate-producer-run-id "$CODESTORY_CANDIDATE_PRODUCER_RUN_ID" \
            --candidate-producer-run-attempt "$CODESTORY_CANDIDATE_PRODUCER_RUN_ATTEMPT" \
            --candidate-artifact-name "$(basename "$archive")" \
            --expected-source-sha "$(git rev-parse HEAD)" \
            --expected-source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --timeout-secs 1800 \
            --out-dir target/candidate-installed-linux/proof

      - name: Upload candidate-installed Linux proof
        if: always() && inputs.candidate_installed_proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-installed-linux-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: target/candidate-installed-linux
          if-no-files-found: error
          retention-days: 30

      - name: Emit authenticated Linux Vulkan release cells
        if: inputs.emit_release_cells
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          CANDIDATE_INSTALLED_PROOF: ${{ inputs.candidate_installed_proof }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          version="${version#v}"
          archive="target/release-dist/codestory-cli-v${version}-linux-x64.tar.gz"
          mkdir -p target/release-cells
          jq -n \
            --arg native_engine coderank_q8_embedded \
            '{native_engine: $native_engine}' \
            > target/linux-vulkan-proof/release-cell-identity.json
          common=(
            --repo "$GITHUB_WORKSPACE"
            --expected-sha "$INPUT_REF"
            --version "$version"
            --producer-workflow .github/workflows/linux-vulkan-proof.yml
            --producer-job packaged-vulkan
            --producer-run-id "$GITHUB_RUN_ID"
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          node scripts/codestory-release-cell-manifest.mjs produce \
            "${common[@]}" \
            --cell-id accelerator_execution:linux-x64-vulkan \
            --producer-artifact "release-cell-prepublish-linux-x64-vulkan-attempt-$GITHUB_RUN_ATTEMPT" \
            --identity target/linux-vulkan-proof/release-cell-identity.json \
            --archive "$archive" \
            --out target/release-cells/accelerator_execution-linux-x64-vulkan.json
          node scripts/codestory-release-cell-manifest.mjs produce \
            "${common[@]}" \
            --cell-id retrieval_readiness:linux-x64 \
            --producer-artifact "release-cell-postpublish-retrieval-linux-x64-attempt-$GITHUB_RUN_ATTEMPT" \
            --archive "$archive" \
            --out target/release-cells/retrieval_readiness-linux-x64.json
          if [ "$CANDIDATE_INSTALLED_PROOF" = true ]; then
            jq -n \
              --arg installer candidate_managed_plugin \
              --arg runtime_version "$version" \
              --arg native_engine coderank_q8_embedded \
              '{installer: $installer, runtime_version: $runtime_version, native_engine: $native_engine}' \
              > target/candidate-installed-linux/release-cell-identity.json
            node scripts/codestory-release-cell-manifest.mjs produce \
              "${common[@]}" \
              --cell-id candidate_installed_behavior:linux-x64 \
              --producer-artifact "release-cell-prepublish-candidate-installed-linux-x64-attempt-$GITHUB_RUN_ATTEMPT" \
              --identity target/candidate-installed-linux/release-cell-identity.json \
              --archive "$archive" \
              --out target/release-cells/candidate_installed_behavior-linux-x64.json
          fi

      - name: Upload authenticated Linux accelerator release cell
        if: success() && inputs.emit_release_cells
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-linux-x64-vulkan-attempt-${{ github.run_attempt }}
          path: target/release-cells/accelerator_execution-linux-x64-vulkan.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload authenticated Linux retrieval release cell
        if: success() && inputs.emit_release_cells
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-postpublish-retrieval-linux-x64-attempt-${{ github.run_attempt }}
          path: target/release-cells/retrieval_readiness-linux-x64.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload authenticated candidate-installed Linux release cell
        if: success() && inputs.emit_release_cells && inputs.candidate_installed_proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-candidate-installed-linux-x64-attempt-${{ github.run_attempt }}
          path: target/release-cells/candidate_installed_behavior-linux-x64.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux Vulkan proof artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64-vulkan-proof-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: target/linux-vulkan-proof
          if-no-files-found: error
          retention-days: 30

  optional-constant-calibration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.constant_calibration_mode }}
    needs: route
    name: Optional Linux Vulkan constant calibration
    runs-on: [self-hosted, Linux, X64, codestory-linux-vulkan]
    environment: linux-vulkan-proof
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install pinned Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Capture optional Linux Vulkan calibration host evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/linux-vulkan-calibration
          {
            uname -a
            uname -m
            lscpu
            command -v vulkaninfo
            vulkaninfo --summary
          } > target/linux-vulkan-calibration/host.txt 2>&1
          test "$(uname -m)" = x86_64

      - name: Prepare checksum-pinned embedded model
        run: >-
          node scripts/prepare-embedded-model.mjs
          --cache-root "$RUNNER_TOOL_CACHE/codestory/model-material"

      - name: Build and package native CLI and constant driver
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          cargo build --release --locked \
            -p codestory-cli \
            --bin codestory-cli \
            --bin codestory-cli-runtime \
            -p codestory-bench \
            --bin codestory_embedding_constant_calibration
          python .github/scripts/package-codestory-release.py \
            --version "$version" \
            --target linux-x64 \
            --binary target/release/codestory-cli \
            --out-dir target/release-dist

      - name: Collect optional Linux Vulkan constant calibration
        shell: bash
        env:
          CODESTORY_EMBED_ALLOW_CPU: "0"
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$(jq -r .status crates/codestory-llama-sys/per-user-embedding-server-constant-set.json)" = unfrozen
          version="${INPUT_VERSION#v}"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p target/calibration-runs/linux-vulkan
          python .github/scripts/check-packaged-agent-proof.py \
            --archive "target/release-dist/codestory-cli-v${version}-linux-x64.tar.gz" \
            --checksum-file target/release-dist/SHA256SUMS.txt \
            --expected-version "$version" \
            --engine-policy accelerated \
            --expected-backend Vulkan \
            --offline \
            --proof-tier calibration \
            --qualification-matrix-cell protected_linux_x64_vulkan \
            --collect-constant-calibration \
            --constant-calibration-output-dir target/calibration-runs/linux-vulkan \
            --qualification-driver target/release/codestory_embedding_constant_calibration \
            --expected-source-sha "$source_sha" \
            --expected-source-tree "$source_tree" \
            --timeout-secs 1800 \
            --out-dir target/calibration-proof/linux-vulkan

      - name: Upload optional Linux Vulkan calibration evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: optional-embedding-calibration-linux-vulkan-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: |
            target/calibration-runs/linux-vulkan
            target/calibration-proof/linux-vulkan
            target/linux-vulkan-calibration
          if-no-files-found: warn
          retention-days: 30

name: Marketplace sync

# Recovery for a release whose catalog push did not land.
#
# Publication and the catalog update are separate steps, so a failure between them leaves the
# release published and the catalog still serving the previous one. That is the safe direction --
# no user is offered a plugin that does not exist -- and this workflow closes the gap. It is
# idempotent: re-running it against an already-synced catalog succeeds without pushing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version to point the catalog at, without v prefix.
        required: true
        type: string
      commit:
        description: Exact published release commit on main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace-publish
    steps:
      # Dispatch inputs reach shells only through the environment. Actions interpolation is textual
      # and double quotes do not stop command substitution, so a value spliced into script text runs
      # as a command on the runner -- here with the default token and, later, the marketplace app
      # token. Shape is checked before the ref is resolved or any token is minted.
      # `[[ =~ ]]` is a bash construct. Under a POSIX shell it is a missing command inside an `if`,
      # which `set -e` does not treat as an error, so the refusal below would be skipped and the
      # guard would exit 0 on the value it exists to reject. The shell is declared, not inherited.
      - name: Validate the dispatched release coordinates
        shell: bash
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Match the whole value, not a line inside it. grep anchors per line, so a dispatched
          # commit of a well-formed abbreviation followed by a newline and a payload passes a
          # per-line test on its first line and carries the rest through untouched. Bash regex has
          # no notion of a line: here ^ and $ are the ends of the value itself.
          commit_shape='^[0-9a-fA-F]{7,40}$'
          version_shape='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ ! "$INPUT_COMMIT" =~ $commit_shape ]]; then
            echo "::error::commit must be a 7-40 character hexadecimal commit id."
            exit 1
          fi
          if [[ ! "$INPUT_VERSION" =~ $version_shape ]]; then
            echo "::error::version must be a semantic version without a v prefix."
            exit 1
          fi

      - name: Checkout the published commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require a published release for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$INPUT_VERSION"
          target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          resolved="$(git rev-parse "$INPUT_COMMIT^{commit}")"
          if [ "$target" != "$resolved" ]; then
            echo "::error::release $tag targets $target, not $resolved. The catalog may only point at a published release commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$resolved" origin/main; then
            echo "::error::$resolved is not on main."
            exit 1
          fi

      - name: Mint a scoped marketplace token
        id: token
        uses: actions/create-github-app-token@67e27a7eb7db372a1c61a7f9bdab8699e9ee57f7 # v1.11.3
        with:
          app-id: ${{ secrets.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: TheGreenCedar
          repositories: AgentPluginMarketplace

      - name: Point the catalog at the published release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/publish-marketplace-catalog.mjs \
            --source-repository "$GITHUB_WORKSPACE" \
            --commit "$INPUT_COMMIT" \
            --version "$INPUT_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      # A catalog moved by this workflow is not a catalog moved by the release that published the
      # plugin, and the two must stay distinguishable: the release lane's own runs record published
      # or deferred, and this one records recovered. The pin it replaced travels with it, so the
      # operator who ran a recovery can undo that recovery the same way.
      - name: Record catalog recovery identity
        shell: bash
        env:
          CATALOG_DELIVERY: recovered
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
          MARKETPLACE_REVISION: ${{ steps.publish.outputs.marketplace_revision }}
          PREVIOUS_PLUGIN_SHA: ${{ steps.publish.outputs.previous_plugin_sha }}
          PREVIOUS_PLUGIN_VERSION: ${{ steps.publish.outputs.previous_plugin_version }}
          PREVIOUS_REVISION: ${{ steps.publish.outputs.previous_marketplace_revision }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$MARKETPLACE_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Catalog recovery must resolve an immutable catalog revision."
            exit 1
          fi
          echo "Catalog delivery state: $CATALOG_DELIVERY (codestory $INPUT_VERSION at $INPUT_COMMIT, catalog $MARKETPLACE_REVISION)." >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback target: codestory $PREVIOUS_PLUGIN_VERSION at $PREVIOUS_PLUGIN_SHA (catalog $PREVIOUS_REVISION)." >> "$GITHUB_STEP_SUMMARY"

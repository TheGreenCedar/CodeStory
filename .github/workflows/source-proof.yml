name: Exact-head source proof

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      proof_key:
        required: true
        type: string
      version:
        required: true
        type: string
      freeze_receipt_digest:
        description: Digest of the exact-head release freeze status.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request accepted by exact-head review. Dispatch with --ref <same-repository PR head branch>.
        required: true
        type: string
      expected_head_sha:
        description: Exact reviewed head SHA. The selected --ref, github.sha, and live PR head must match.
        required: true
        type: string
      freeze_receipt_digest:
        description: Existing successful freeze receipt digest. Leave empty when acceptance_only is true.
        required: false
        default: ""
        type: string
      version:
        description: Release version whose source cell this accepted proof emits.
        required: true
        type: string
      acceptance_only:
        description: Execute only the hostile mutation and protected Windows native-probe freeze barrier.
        required: false
        default: false
        type: boolean
      acceptance_phase:
        description: Candidate phase represented by an acceptance-only receipt.
        required: false
        default: frozen_candidate
        type: choice
        options:
          - calibration_source
          - frozen_candidate
      support_prs_json:
        description: JSON array of support PR numbers already merged into the release head.
        required: false
        default: "[]"
        type: string
      reusable_evidence_json:
        description: JSON array naming evidence reusable by this exact head.
        required: false
        default: "[]"
        type: string
      invalidated_evidence_json:
        description: JSON array naming evidence invalidated before this exact head.
        required: false
        default: "[]"
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: source-proof-${{ github.sha }}-${{ inputs.proof_key || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_VERSION: "v0.16.0"
  SCCACHE_CACHE_SIZE: "1G"
  CARGO_DEPENDENCY_CACHE_MAX_BYTES: "1073741824"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      freeze_digest: ${{ steps.receipt.outputs.digest }}
      freeze_artifact_name: ${{ steps.receipt.outputs.artifact_name }}
    steps:
      - name: Resolve trusted exact head
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CALLER_REF: ${{ inputs.ref }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_PR_NUMBER" ]; then
            test "$EVENT_HEAD_REPO" = "$GITHUB_REPOSITORY" || {
              echo "::error::Exact-head proof does not execute fork pull requests."
              exit 1
            }
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$EVENT_PR_NUMBER")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
            current_head="$(jq -r '.head.sha' <<<"$pr")"
            test "$head_repo" = "$GITHUB_REPOSITORY" || {
              echo "::error::Exact-head proof does not execute fork pull requests."
              exit 1
            }
            test "$current_head" = "$EVENT_HEAD_SHA" || {
              echo "::error::PR #$EVENT_PR_NUMBER moved after the review-accepted label event."
              exit 1
            }
            echo "ref=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PR_NUMBER" ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
            head_sha="$(jq -r '.head.sha' <<<"$pr")"
            head_ref="$(jq -r '.head.ref' <<<"$pr")"
            test "$head_repo" = "$GITHUB_REPOSITORY" || {
              echo "::error::Exact-head proof does not execute fork pull requests."
              exit 1
            }
            test "$head_sha" = "$EXPECTED_HEAD_SHA" || {
              echo "::error::PR #$PR_NUMBER moved from reviewed head $EXPECTED_HEAD_SHA to $head_sha."
              exit 1
            }
            test "$GITHUB_REF" = "refs/heads/$head_ref" || {
              echo "::error::Exact-head proof must be dispatched with --ref $head_ref (the same-repository PR head branch), not $GITHUB_REF."
              exit 1
            }
            test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA" || {
              echo "::error::Workflow SHA $GITHUB_SHA is not reviewed PR head $EXPECTED_HEAD_SHA. Dispatch with --ref $head_ref."
              exit 1
            }
            echo "ref=$head_sha" >> "$GITHUB_OUTPUT"
          else
            test -n "$CALLER_REF"
            test "$GITHUB_SHA" = "$CALLER_REF" || {
              echo "::error::Reusable source proof ref $CALLER_REF does not match workflow SHA $GITHUB_SHA."
              exit 1
            }
            echo "ref=$CALLER_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout accepted source head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Cancel superseded proof runs
        id: cancel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          result="$(
            node .github/scripts/release-freeze-barrier.mjs cancel-superseded \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$HEAD_SHA" \
            --broad-workflow "Exact-head source proof" \
            --broad-workflow "Platform and integration proof" \
            --broad-workflow "Release" \
            --broad-workflow "Auto Release"
          )"
          echo "cancelled=$(jq -c '.cancelled' <<<"$result")" >> "$GITHUB_OUTPUT"

      - name: Record executable release freeze
        id: receipt
        if: ${{ inputs.acceptance_only }}
        shell: bash
        env:
          CALLER_FREEZE_RECEIPT_DIGEST: ${{ inputs.freeze_receipt_digest }}
          ACCEPTANCE_PHASE: ${{ inputs.acceptance_phase }}
          CANCELLED_RUNS_JSON: ${{ steps.cancel.outputs.cancelled }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.ref }}
          INVALIDATED_EVIDENCE_JSON: ${{ inputs.invalidated_evidence_json }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REUSABLE_EVIDENCE_JSON: ${{ inputs.reusable_evidence_json }}
          SUPPORT_PRS_JSON: ${{ inputs.support_prs_json }}
        run: |
          set -euo pipefail
          test -z "$CALLER_FREEZE_RECEIPT_DIGEST" || {
            echo "::error::acceptance_only mints its receipt digest; callers must leave freeze_receipt_digest empty."
            exit 1
          }
          tree="$(git rev-parse 'HEAD^{tree}')"
          node .github/scripts/release-freeze-barrier.mjs record-actions-receipt \
            --repository "$GITHUB_REPOSITORY" \
            --repo "$GITHUB_WORKSPACE" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$HEAD_SHA" \
            --tree "$tree" \
            --release-pr "$PR_NUMBER" \
            --support-prs-json "$SUPPORT_PRS_JSON" \
            --reusable-evidence-json "$REUSABLE_EVIDENCE_JSON" \
            --invalidated-evidence-json "$INVALIDATED_EVIDENCE_JSON" \
            --cancelled-runs-json "$CANCELLED_RUNS_JSON" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --phase "$ACCEPTANCE_PHASE" \
            --broad-workflow "Exact-head source proof" \
            --broad-workflow "Platform and integration proof" \
            --broad-workflow "Release" \
            --broad-workflow "Auto Release" \
            --output "$RUNNER_TEMP/release-freeze-receipt.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload executable release freeze receipt
        if: ${{ inputs.acceptance_only }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-freeze-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reuse a completed gate for this exact head
        id: reuse
        if: ${{ !inputs.acceptance_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          reuse=false
          while IFS= read -r run_id; do
            test "$run_id" != "$GITHUB_RUN_ID" || continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "full-source-gate" and .conclusion == "success") | .id' \
              | grep -q .
            then
              run_attempt="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.run_attempt'
              )"
              artifact_name="release-cell-prepublish-source-attempt-$run_attempt"
              artifact_count="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                  | jq --arg name "$artifact_name" \
                    '[.artifacts[] | select(.name == $name and .expired == false)] | length'
              )"
              test "$artifact_count" = 1 || continue
              reuse=true
              echo "Reusing full-source-gate and $artifact_name from run $run_id for exact head $HEAD_SHA."
              break
            fi
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&status=completed&per_page=100" \
              | jq -r --arg repo "$GITHUB_REPOSITORY" \
                '.workflow_runs[] | select(.path == ".github/workflows/source-proof.yml" and .head_repository.full_name == $repo and .event == "workflow_dispatch" and .conclusion == "success") | .id'
          )
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      - name: Require executable release freeze
        if: ${{ !inputs.acceptance_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FREEZE_RECEIPT_DIGEST: ${{ inputs.freeze_receipt_digest }}
          HEAD_SHA: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          printf '%s' "$FREEZE_RECEIPT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          tree="$(
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq '.tree.sha'
          )"
          node .github/scripts/release-freeze-barrier.mjs verify-status \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$HEAD_SHA" \
            --tree "$tree" \
            --phase frozen_candidate \
            --receipt-digest "$FREEZE_RECEIPT_DIGEST"

  freeze-hostile-mutations:
    name: freeze-hostile-mutations
    if: inputs.acceptance_only
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install workflow policy dependencies
        run: npm ci --ignore-scripts

      - name: Execute exact-head hostile mutation matrix
        run: >-
          node --test
          .github/scripts/check-workflow-policy.test.mjs
          .github/scripts/release-freeze-barrier.test.mjs
          .github/scripts/cargo-build-artifacts.test.mjs
          .github/scripts/candidate-archive-store.test.mjs

  freeze-windows-native-probe:
    name: freeze-windows-native-probe
    if: inputs.acceptance_only
    needs: resolve
    runs-on: [self-hosted, Windows, X64, codestory-vulkan]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Run packaged proof self-test
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/check-packaged-agent-proof.py --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "packaged proof self-test failed on the protected Windows runner"
          }

      - name: Run exact-head Windows native probe
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $probeRoot = Join-Path $env:RUNNER_TEMP (
            "codestory-cargo-hardlink-probe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          )
          if (Test-Path -LiteralPath $probeRoot) {
            throw "native probe root already exists: $probeRoot"
          }
          try {
            cargo new --quiet --bin --name cargo-hardlink-probe $probeRoot
            if ($LASTEXITCODE -ne 0) {
              throw "cargo new failed"
            }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $vswhere = Join-Path ${env:ProgramFiles(x86)} (
              "Microsoft Visual Studio/Installer/vswhere.exe"
            )
            $visualStudio = & $vswhere -latest -products "*" `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            $vsDevCmd = Join-Path $visualStudio "Common7/Tools/VsDevCmd.bat"
            $build = (
              "`"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul " +
              "&& cd /d `"$probeRoot`" && cargo build --release --quiet"
            )
            & cmd.exe /d /s /c $build
            if ($LASTEXITCODE -ne 0) {
              throw "tiny Cargo release probe failed"
            }
            node --test .github/scripts/cargo-build-artifacts.test.mjs
            if ($LASTEXITCODE -ne 0) {
              throw "exact-head Windows artifact selector mutations failed"
            }
            $rootExe = Join-Path $probeRoot "target/release/cargo-hardlink-probe.exe"
            $depsExe = Join-Path $probeRoot "target/release/deps/cargo_hardlink_probe.exe"
            $identityScript = @'
          const fs = require("node:fs");
          const [root, deps] = process.argv.slice(2);
          const left = fs.statSync(root, { bigint: true });
          const right = fs.statSync(deps, { bigint: true });
          if (
            left.dev !== right.dev
            || left.ino !== right.ino
            || left.nlink !== 2n
            || right.nlink !== 2n
          ) {
            throw new Error("Cargo release root/deps outputs are not one native two-link file");
          }
          console.log(JSON.stringify({
            device: String(left.dev),
            inode: String(left.ino),
            nlink: String(left.nlink),
          }));
          '@
            $identityScriptPath = Join-Path $probeRoot "verify-hardlink-identity.cjs"
            Set-Content -LiteralPath $identityScriptPath -Value $identityScript -Encoding UTF8
            node $identityScriptPath $rootExe $depsExe
            if ($LASTEXITCODE -ne 0) {
              throw "Cargo native hardlink identity probe failed"
            }
            $clock.Stop()
            if ($clock.Elapsed.TotalSeconds -ge 90) {
              throw "native probe took $($clock.Elapsed.TotalSeconds) seconds"
            }
            "native_probe_seconds=$([Math]::Round($clock.Elapsed.TotalSeconds, 3))"
          } finally {
            Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

  freeze-acceptance:
    name: freeze-acceptance
    if: >-
      always() &&
      inputs.acceptance_only &&
      needs.resolve.result == 'success' &&
      needs.freeze-hostile-mutations.result == 'success' &&
      needs.freeze-windows-native-probe.result == 'success'
    needs:
      - resolve
      - freeze-hostile-mutations
      - freeze-windows-native-probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Download executable release freeze receipt
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.resolve.outputs.freeze_artifact_name }}
          path: ${{ runner.temp }}/release-freeze-receipt

      - name: Publish executable release freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FREEZE_RECEIPT_DIGEST: ${{ needs.resolve.outputs.freeze_digest }}
          HEAD_SHA: ${{ needs.resolve.outputs.ref }}
          ACCEPTANCE_PHASE: ${{ inputs.acceptance_phase }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          verified_digest="$(
            node .github/scripts/release-freeze-barrier.mjs verify-file \
              --receipt "$RUNNER_TEMP/release-freeze-receipt/release-freeze-receipt.json" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$HEAD_SHA" \
              --tree "$tree" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --phase "$ACCEPTANCE_PHASE"
          )"
          test "$verified_digest" = "$FREEZE_RECEIPT_DIGEST" || {
            echo "::error::Downloaded acceptance receipt digest differs from the Actions-generated resolve output."
            exit 1
          }
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f "context=codestory/release-freeze/$FREEZE_RECEIPT_DIGEST" \
            -f "description=tree=$tree" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  full-source-gate:
    name: full-source-gate
    needs: resolve
    # A completed gate for this exact head already proves this tree. Re-running it costs an hour
    # and cannot reach a different answer, which is what made re-labelling a PR expensive. Release
    # runs (workflow_call, which always supplies `ref`) never take this path: their chain requires
    # the job to execute.
    if: ${{ !inputs.acceptance_only && needs.resolve.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Install Linux Vulkan build dependencies
        run: bash .github/scripts/install-linux-vulkan-build-deps.sh

      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
          disable_annotations: true

      # Checksum-pinned official archive, same trust model as the actionlint gate. nextest
      # schedules test binaries in parallel across the whole workspace, which measured 3.9x
      # faster than `cargo test --workspace` on an identical tree with identical test parity.
      - name: Install pinned cargo-nextest
        shell: bash
        run: |
          curl -sSL -o "$RUNNER_TEMP/cargo-nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.98/cargo-nextest-0.9.98-x86_64-unknown-linux-gnu.tar.gz"
          echo "7d07712519615722b19ffe3b3d1097b7d4fa390995e3cac1f9d6dda1ba61b2a7  $RUNNER_TEMP/cargo-nextest.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cargo-nextest.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version

      - name: Configure bounded compiler cache
        shell: bash
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/codestory-source-cargo"
            echo "SCCACHE_DIR=$RUNNER_TEMP/codestory-source-sccache"
            echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"

      - name: Capture reusable build cache contract
        id: build-cache
        shell: bash
        env:
          EXACT_SHA: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          rust_version="$(rustc -Vv | sed -n 's/^release: //p')"
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          native_toolchain="$(cc --version | head -n 1 | tr -d '\r')"
          cmake_version="$(cmake --version | sed -n 's/^cmake version //p')"
          ninja_version="$(ninja --version 2>/dev/null || printf 'not-installed')"
          relevant_inputs=(
            --relevant-input .cargo/llama-dynamic-backends.cmake
            --relevant-input .github/scripts/install-linux-vulkan-build-deps.sh
            --relevant-input crates/codestory-llama-sys/build.rs
            --relevant-input crates/codestory-llama-sys/model-contract.json
            --relevant-input scripts/prepare-embedded-model.mjs
          )
          while IFS= read -r manifest; do
            relevant_inputs+=(--relevant-input "$manifest")
          done < <(git ls-files '*Cargo.toml')
          node .github/scripts/cargo-cache-contract.mjs identity \
            --namespace source-proof-v2 \
            --exact-sha "$EXACT_SHA" \
            --os "$RUNNER_OS" \
            --target "$target" \
            --rust-version "$rust_version" \
            --features workspace-test-default-and-clippy-all-targets-all-features \
            --native-toolchain "$native_toolchain" \
            --generator unix-makefiles \
            --cmake-version "$cmake_version" \
            --ninja-version "$ninja_version" \
            --sccache-version "$SCCACHE_VERSION" \
            --lock-file Cargo.lock \
            --cargo-config .cargo/config.toml \
            "${relevant_inputs[@]}" \
            --identity cargo_incremental=0

      - name: Restore Cargo dependency inputs
        id: cargo-dependency-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/codestory-source-cargo/registry
            ${{ runner.temp }}/codestory-source-cargo/git
          key: ${{ steps.build-cache.outputs.dependency-key }}

      - name: Report Cargo dependency cache restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cargo-dependency-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cargo-dependency-cache.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.dependency-key }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs restore \
            --kind dependencies \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --cache-hit "${CACHE_HIT:-false}" \
            --path "$CARGO_HOME/registry" \
            --path "$CARGO_HOME/git"

      - name: Restore compatible compiler objects
        id: compiler-cache-restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/codestory-source-sccache
          key: ${{ steps.build-cache.outputs.compiler-key }}
          restore-keys: |
            ${{ steps.build-cache.outputs.compiler-prefix }}

      - name: Report compiler cache restore
        id: compiler-cache-report
        shell: bash
        env:
          CACHE_HIT: ${{ steps.compiler-cache-restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.compiler-cache-restore.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.compiler-key }}
          COMPATIBILITY_PREFIX: ${{ steps.build-cache.outputs.compiler-prefix }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs restore \
            --kind compiler \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --compatibility-prefix "$COMPATIBILITY_PREFIX" \
            --cache-hit "${CACHE_HIT:-false}" \
            --path "$SCCACHE_DIR"

      - name: Start compilation clock
        id: compile-clock
        run: node .github/scripts/cargo-cache-contract.mjs start

      - name: Compile the complete workspace test suite
        id: compile-workspace
        continue-on-error: true
        run: cargo test --workspace --locked --no-run

      - name: Lint every workspace target and feature once
        id: lint-workspace
        if: steps.compile-workspace.outcome == 'success'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Stop compilation clock
        id: compile-clock-stop
        if: always() && steps.compile-workspace.outcome == 'success'
        run: node .github/scripts/cargo-cache-contract.mjs stop

      - name: Finalize compiler objects
        if: always() && steps.compile-workspace.outcome == 'success'
        shell: bash
        run: |
          sccache --show-stats
          sccache --stop-server

      - name: Bound Cargo dependency cache
        id: cargo-dependency-cache-size
        if: always() && steps.compile-workspace.outcome == 'success'
        shell: bash
        run: |
          node .github/scripts/cargo-cache-contract.mjs size \
            --kind dependencies \
            --max-bytes "$CARGO_DEPENDENCY_CACHE_MAX_BYTES" \
            --path "$CARGO_HOME/registry" \
            --path "$CARGO_HOME/git"

      - name: Save Cargo dependency inputs
        id: cargo-dependency-cache-save
        if: always() && steps.compile-workspace.outcome == 'success' && steps.cargo-dependency-cache-size.outputs.within-limit == 'true' && steps.cargo-dependency-cache.outputs.cache-hit != 'true' && steps.cargo-dependency-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/codestory-source-cargo/registry
            ${{ runner.temp }}/codestory-source-cargo/git
          key: ${{ steps.cargo-dependency-cache.outputs.cache-primary-key }}

      - name: Start compiler cache save clock
        id: compiler-cache-save-clock
        if: always() && steps.compile-workspace.outcome == 'success'
        run: node .github/scripts/cargo-cache-contract.mjs start

      - name: Save compiler objects after compilation
        id: compiler-cache-save
        if: always() && steps.compile-workspace.outcome == 'success' && steps.compiler-cache-restore.outputs.cache-hit != 'true' && steps.compiler-cache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/codestory-source-sccache
          key: ${{ steps.compiler-cache-restore.outputs.cache-primary-key }}

      - name: Report compiler cache save
        if: always() && steps.compile-workspace.outcome == 'success'
        shell: bash
        env:
          HIT_TYPE: ${{ steps.compiler-cache-report.outputs.hit-type }}
          MATCHED_KEY: ${{ steps.compiler-cache-restore.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.compiler-key }}
          COMPATIBILITY_PREFIX: ${{ steps.build-cache.outputs.compiler-prefix }}
          RESTORED_BYTES: ${{ steps.compiler-cache-report.outputs.restored-bytes }}
          SAVE_RESULT: ${{ steps.compiler-cache-save.outcome }}
          STARTED_MS: ${{ steps.compile-clock.outputs.started-ms }}
          ENDED_MS: ${{ steps.compile-clock-stop.outputs.ended-ms }}
          SAVE_STARTED_MS: ${{ steps.compiler-cache-save-clock.outputs.started-ms }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs save \
            --kind compiler \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --compatibility-prefix "$COMPATIBILITY_PREFIX" \
            --hit-type "$HIT_TYPE" \
            --restored-bytes "$RESTORED_BYTES" \
            --started-ms "$STARTED_MS" \
            --ended-ms "$ENDED_MS" \
            --save-started-ms "$SAVE_STARTED_MS" \
            --save-result "$SAVE_RESULT" \
            --path "$SCCACHE_DIR"

      - name: Require successful source compilation
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile-workspace.outcome }}
          LINT_OUTCOME: ${{ steps.lint-workspace.outcome }}
        run: |
          test "$COMPILE_OUTCOME" = success
          test "$LINT_OUTCOME" = success

      # nextest does not execute doctests, so the doc pass stays: today it is empty and costs
      # seconds, and it means a future doctest can never silently stop being run.
      - name: Test the complete workspace once
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --doc --locked

      - name: Emit authenticated source release cell
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RESOLVED_REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$RESOLVED_REF" \
            --version "$INPUT_VERSION" \
            --cell-id source_behavior \
            --producer-workflow .github/workflows/source-proof.yml \
            --producer-job full-source-gate \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-prepublish-source-attempt-$GITHUB_RUN_ATTEMPT" \
            --out target/release-cells/source_behavior.json

      - name: Upload authenticated source release cell
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-source-attempt-${{ github.run_attempt }}
          path: target/release-cells/source_behavior.json
          if-no-files-found: error
          retention-days: 30

  retrieval-generalization:
    name: retrieval-generalization
    needs: resolve
    if: ${{ !inputs.acceptance_only && needs.resolve.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generalization lint (production paths)
        run: node scripts/lint-retrieval-generalization.mjs

      - name: Generalization lint hostile matrix
        run: node --test scripts/tests/lint-retrieval-generalization.test.mjs

  windows-native-contracts:
    name: windows-native-contracts
    needs: resolve
    if: ${{ !inputs.acceptance_only && needs.resolve.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prove the Windows-native qualification harness contracts
        shell: pwsh
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          python .github/scripts/check-packaged-agent-proof.py --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Windows-native qualification harness contracts failed with exit code $LASTEXITCODE"
          }
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $started
          if ($elapsed -lt 0) {
            throw "Windows-native qualification harness timing was negative"
          }
          if ($elapsed -ge 90000) {
            throw "Windows-native qualification harness contracts took ${elapsed} ms, past their 90000 ms budget: the qualification directory regression has to stay reproducible without rebuilding the package"
          }
          "- Windows-native qualification harness contracts: ${elapsed} ms" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Configure short Windows Cargo target
        shell: pwsh
        run: |
          $workspaceTarget = Join-Path $env:GITHUB_WORKSPACE "target"
          $runnerRoot = [System.IO.Path]::GetPathRoot($workspaceTarget)
          if ([string]::IsNullOrWhiteSpace($runnerRoot)) {
            throw "workspace target has no volume root: $workspaceTarget"
          }
          $shortTarget = Join-Path $runnerRoot "t"
          New-Item -ItemType Directory -Force -Path $workspaceTarget | Out-Null
          if (Test-Path -LiteralPath $shortTarget) {
            throw "short Cargo target already exists: $shortTarget"
          }
          New-Item -ItemType Junction -Path $shortTarget -Target $workspaceTarget | Out-Null
          "CARGO_TARGET_DIR=$shortTarget" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare checksum-pinned embedded model
        run: node scripts/prepare-embedded-model.mjs

      - name: Install checksum-pinned Windows Vulkan SDK
        shell: pwsh
        run: .github/scripts/install-windows-vulkan-sdk.ps1

      - name: Prove Windows path and native-staging source contracts
        shell: pwsh
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          cargo test --release --locked `
            -p codestory-workspace --test windows_path_identity `
            -p codestory-llama-sys --test native_staging
          if ($LASTEXITCODE -ne 0) {
            throw "Windows native source contracts failed with exit code $LASTEXITCODE"
          }
          $ended = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $elapsed = $ended - $started
          if ($elapsed -lt 0) {
            throw "Windows native source-contract timing was negative"
          }
          "- Windows path and native-staging source contracts: ${elapsed} ms" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Emit authenticated Windows-native source receipt
        id: windows-native-source-proof
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.ref }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE"
          }
          $cliPackages = @($metadata.packages | Where-Object { $_.name -eq "codestory-cli" })
          if ($cliPackages.Count -ne 1) {
            throw "expected exactly one codestory-cli package, found $($cliPackages.Count)"
          }
          $commit = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git identity resolution failed with exit code $LASTEXITCODE"
          }
          if ($commit -ne $env:EXPECTED_HEAD_SHA) {
            throw "Windows-native source receipt head $commit differs from routed head $env:EXPECTED_HEAD_SHA"
          }
          $dirty = @(git status --porcelain=v1)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw "Windows-native source receipt requires a clean exact-head checkout"
          }
          $receipt = [ordered]@{
            schema = "codestory.windows-native-source-proof/v1"
            status = "pass"
            repository = $env:GITHUB_REPOSITORY
            commit = $commit
            source_tree = $sourceTree
            version = $cliPackages[0].version
            producer = [ordered]@{
              workflow_path = ".github/workflows/source-proof.yml"
              job = "windows-native-contracts"
              run_id = [Int64]$env:GITHUB_RUN_ID
              run_attempt = [Int64]$env:GITHUB_RUN_ATTEMPT
            }
            contracts = [ordered]@{
              qualification_harness_self_test = $true
              control_directory_inflight = $true
              windows_path_identity = $true
              native_staging = $true
            }
          }
          New-Item -ItemType Directory -Force -Path target/windows-native-source-proof | Out-Null
          $json = $receipt | ConvertTo-Json -Depth 4 -Compress
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "target/windows-native-source-proof/windows-native-source-proof.json"),
            "$json`n",
            $utf8NoBom
          )
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload authenticated Windows-native source receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-native-source-proof-${{ steps.windows-native-source-proof.outputs.commit }}-attempt-${{ github.run_attempt }}
          path: target/windows-native-source-proof/windows-native-source-proof.json
          if-no-files-found: error
          retention-days: 30

name: Exact-head source proof

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      proof_key:
        required: true
        type: string
      version:
        required: false
        default: ""
        type: string
      emit_release_cells:
        required: false
        default: false
        type: boolean
      freeze_receipt_digest:
        description: Digest of the exact-head release freeze status.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request accepted by exact-head review. Dispatch with --ref <same-repository PR head branch>.
        required: true
        type: string
      expected_head_sha:
        description: Exact reviewed head SHA. The selected --ref, github.sha, and live PR head must match.
        required: true
        type: string
      freeze_receipt_digest:
        description: Digest emitted by release-freeze-barrier.mjs for this exact head.
        required: true
        type: string
      version:
        description: Release version whose source cell this accepted proof emits.
        required: true
        type: string
      emit_release_cells:
        description: Emit the source cell that qualification and publication reuse.
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: source-proof-${{ github.sha }}-${{ inputs.proof_key || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_VERSION: "v0.16.0"
  SCCACHE_CACHE_SIZE: "1G"
  CARGO_DEPENDENCY_CACHE_MAX_BYTES: "1073741824"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - name: Resolve trusted exact head
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CALLER_REF: ${{ inputs.ref }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_PR_NUMBER" ]; then
            test "$EVENT_HEAD_REPO" = "$GITHUB_REPOSITORY" || {
              echo "::error::Exact-head proof does not execute fork pull requests."
              exit 1
            }
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$EVENT_PR_NUMBER")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
            current_head="$(jq -r '.head.sha' <<<"$pr")"
            test "$head_repo" = "$GITHUB_REPOSITORY" || {
              echo "::error::Exact-head proof does not execute fork pull requests."
              exit 1
            }
            test "$current_head" = "$EVENT_HEAD_SHA" || {
              echo "::error::PR #$EVENT_PR_NUMBER moved after the review-accepted label event."
              exit 1
            }
            echo "ref=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PR_NUMBER" ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
            head_sha="$(jq -r '.head.sha' <<<"$pr")"
            head_ref="$(jq -r '.head.ref' <<<"$pr")"
            test "$head_repo" = "$GITHUB_REPOSITORY" || {
              echo "::error::Exact-head proof does not execute fork pull requests."
              exit 1
            }
            test "$head_sha" = "$EXPECTED_HEAD_SHA" || {
              echo "::error::PR #$PR_NUMBER moved from reviewed head $EXPECTED_HEAD_SHA to $head_sha."
              exit 1
            }
            test "$GITHUB_REF" = "refs/heads/$head_ref" || {
              echo "::error::Exact-head proof must be dispatched with --ref $head_ref (the same-repository PR head branch), not $GITHUB_REF."
              exit 1
            }
            test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA" || {
              echo "::error::Workflow SHA $GITHUB_SHA is not reviewed PR head $EXPECTED_HEAD_SHA. Dispatch with --ref $head_ref."
              exit 1
            }
            echo "ref=$head_sha" >> "$GITHUB_OUTPUT"
          else
            test -n "$CALLER_REF"
            test "$GITHUB_SHA" = "$CALLER_REF" || {
              echo "::error::Reusable source proof ref $CALLER_REF does not match workflow SHA $GITHUB_SHA."
              exit 1
            }
            echo "ref=$CALLER_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout accepted source head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Cancel superseded proof runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.ref }}
        run: |
          node .github/scripts/release-freeze-barrier.mjs cancel-superseded \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$HEAD_SHA" \
            --broad-workflow "Exact-head source proof" \
            --broad-workflow "Platform and integration proof" \
            --broad-workflow "Release" \
            --broad-workflow "Auto Release"

      - name: Reuse a completed gate for this exact head
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          reuse=false
          while IFS= read -r run_id; do
            test "$run_id" != "$GITHUB_RUN_ID" || continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "full-source-gate" and .conclusion == "success") | .id' \
              | grep -q .
            then
              reuse=true
              echo "Reusing full-source-gate from run $run_id for exact head $HEAD_SHA."
              break
            fi
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&status=completed&per_page=100" \
              | jq -r --arg repo "$GITHUB_REPOSITORY" \
                '.workflow_runs[] | select(.path == ".github/workflows/source-proof.yml" and .head_repository.full_name == $repo and .event == "workflow_dispatch" and .conclusion == "success") | .id'
          )
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      - name: Require executable release freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FREEZE_RECEIPT_DIGEST: ${{ inputs.freeze_receipt_digest }}
          HEAD_SHA: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          printf '%s' "$FREEZE_RECEIPT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          tree="$(
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq '.tree.sha'
          )"
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" \
            | jq -e \
              --arg context "codestory/release-freeze/$FREEZE_RECEIPT_DIGEST" \
              --arg description "tree=$tree" \
              'any(.[]; .state == "success"
                and .context == $context
                and .description == $description)' >/dev/null || {
              echo "::error::No executable release freeze accepts exact head $HEAD_SHA and tree $tree."
              exit 1
            }

  full-source-gate:
    name: full-source-gate
    needs: resolve
    # A completed gate for this exact head already proves this tree. Re-running it costs an hour
    # and cannot reach a different answer, which is what made re-labelling a PR expensive. Release
    # runs (workflow_call, which always supplies `ref`) never take this path: their chain requires
    # the job to execute.
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Install Linux Vulkan build dependencies
        run: bash .github/scripts/install-linux-vulkan-build-deps.sh

      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: ${{ env.SCCACHE_VERSION }}
          disable_annotations: true

      # Checksum-pinned official archive, same trust model as the actionlint gate. nextest
      # schedules test binaries in parallel across the whole workspace, which measured 3.9x
      # faster than `cargo test --workspace` on an identical tree with identical test parity.
      - name: Install pinned cargo-nextest
        shell: bash
        run: |
          curl -sSL -o "$RUNNER_TEMP/cargo-nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.98/cargo-nextest-0.9.98-x86_64-unknown-linux-gnu.tar.gz"
          echo "7d07712519615722b19ffe3b3d1097b7d4fa390995e3cac1f9d6dda1ba61b2a7  $RUNNER_TEMP/cargo-nextest.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cargo-nextest.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version

      - name: Configure bounded compiler cache
        shell: bash
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/codestory-source-cargo"
            echo "SCCACHE_DIR=$RUNNER_TEMP/codestory-source-sccache"
            echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"

      - name: Capture reusable build cache contract
        id: build-cache
        shell: bash
        env:
          EXACT_SHA: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          rust_version="$(rustc -Vv | sed -n 's/^release: //p')"
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          native_toolchain="$(cc --version | head -n 1 | tr -d '\r')"
          cmake_version="$(cmake --version | sed -n 's/^cmake version //p')"
          ninja_version="$(ninja --version 2>/dev/null || printf 'not-installed')"
          relevant_inputs=(
            --relevant-input .cargo/llama-dynamic-backends.cmake
            --relevant-input .github/scripts/install-linux-vulkan-build-deps.sh
            --relevant-input crates/codestory-llama-sys/build.rs
            --relevant-input crates/codestory-llama-sys/model-contract.json
            --relevant-input scripts/prepare-embedded-model.mjs
          )
          while IFS= read -r manifest; do
            relevant_inputs+=(--relevant-input "$manifest")
          done < <(git ls-files '*Cargo.toml')
          node .github/scripts/cargo-cache-contract.mjs identity \
            --namespace source-proof-v2 \
            --exact-sha "$EXACT_SHA" \
            --os "$RUNNER_OS" \
            --target "$target" \
            --rust-version "$rust_version" \
            --features workspace-test-default-and-clippy-all-targets-all-features \
            --native-toolchain "$native_toolchain" \
            --generator unix-makefiles \
            --cmake-version "$cmake_version" \
            --ninja-version "$ninja_version" \
            --sccache-version "$SCCACHE_VERSION" \
            --lock-file Cargo.lock \
            --cargo-config .cargo/config.toml \
            "${relevant_inputs[@]}" \
            --identity cargo_incremental=0

      - name: Restore Cargo dependency inputs
        id: cargo-dependency-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/codestory-source-cargo/registry
            ${{ runner.temp }}/codestory-source-cargo/git
          key: ${{ steps.build-cache.outputs.dependency-key }}

      - name: Report Cargo dependency cache restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cargo-dependency-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cargo-dependency-cache.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.dependency-key }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs restore \
            --kind dependencies \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --cache-hit "${CACHE_HIT:-false}" \
            --path "$CARGO_HOME/registry" \
            --path "$CARGO_HOME/git"

      - name: Restore compatible compiler objects
        id: compiler-cache-restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/codestory-source-sccache
          key: ${{ steps.build-cache.outputs.compiler-key }}
          restore-keys: |
            ${{ steps.build-cache.outputs.compiler-prefix }}

      - name: Report compiler cache restore
        id: compiler-cache-report
        shell: bash
        env:
          CACHE_HIT: ${{ steps.compiler-cache-restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.compiler-cache-restore.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.compiler-key }}
          COMPATIBILITY_PREFIX: ${{ steps.build-cache.outputs.compiler-prefix }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs restore \
            --kind compiler \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --compatibility-prefix "$COMPATIBILITY_PREFIX" \
            --cache-hit "${CACHE_HIT:-false}" \
            --path "$SCCACHE_DIR"

      - name: Start compilation clock
        id: compile-clock
        run: node .github/scripts/cargo-cache-contract.mjs start

      - name: Compile the complete workspace test suite
        id: compile-workspace
        continue-on-error: true
        run: cargo test --workspace --locked --no-run

      - name: Lint every workspace target and feature once
        id: lint-workspace
        if: steps.compile-workspace.outcome == 'success'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Stop compilation clock
        id: compile-clock-stop
        if: always() && steps.compile-workspace.outcome == 'success'
        run: node .github/scripts/cargo-cache-contract.mjs stop

      - name: Finalize compiler objects
        if: always() && steps.compile-workspace.outcome == 'success'
        shell: bash
        run: |
          sccache --show-stats
          sccache --stop-server

      - name: Bound Cargo dependency cache
        id: cargo-dependency-cache-size
        if: always() && steps.compile-workspace.outcome == 'success'
        shell: bash
        run: |
          node .github/scripts/cargo-cache-contract.mjs size \
            --kind dependencies \
            --max-bytes "$CARGO_DEPENDENCY_CACHE_MAX_BYTES" \
            --path "$CARGO_HOME/registry" \
            --path "$CARGO_HOME/git"

      - name: Save Cargo dependency inputs
        id: cargo-dependency-cache-save
        if: always() && steps.compile-workspace.outcome == 'success' && steps.cargo-dependency-cache-size.outputs.within-limit == 'true' && steps.cargo-dependency-cache.outputs.cache-hit != 'true' && steps.cargo-dependency-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/codestory-source-cargo/registry
            ${{ runner.temp }}/codestory-source-cargo/git
          key: ${{ steps.cargo-dependency-cache.outputs.cache-primary-key }}

      - name: Start compiler cache save clock
        id: compiler-cache-save-clock
        if: always() && steps.compile-workspace.outcome == 'success'
        run: node .github/scripts/cargo-cache-contract.mjs start

      - name: Save compiler objects after compilation
        id: compiler-cache-save
        if: always() && steps.compile-workspace.outcome == 'success' && steps.compiler-cache-restore.outputs.cache-hit != 'true' && steps.compiler-cache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/codestory-source-sccache
          key: ${{ steps.compiler-cache-restore.outputs.cache-primary-key }}

      - name: Report compiler cache save
        if: always() && steps.compile-workspace.outcome == 'success'
        shell: bash
        env:
          HIT_TYPE: ${{ steps.compiler-cache-report.outputs.hit-type }}
          MATCHED_KEY: ${{ steps.compiler-cache-restore.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.build-cache.outputs.compiler-key }}
          COMPATIBILITY_PREFIX: ${{ steps.build-cache.outputs.compiler-prefix }}
          RESTORED_BYTES: ${{ steps.compiler-cache-report.outputs.restored-bytes }}
          SAVE_RESULT: ${{ steps.compiler-cache-save.outcome }}
          STARTED_MS: ${{ steps.compile-clock.outputs.started-ms }}
          ENDED_MS: ${{ steps.compile-clock-stop.outputs.ended-ms }}
          SAVE_STARTED_MS: ${{ steps.compiler-cache-save-clock.outputs.started-ms }}
        run: |
          node .github/scripts/cargo-cache-contract.mjs save \
            --kind compiler \
            --requested-key "$REQUESTED_KEY" \
            --matched-key "$MATCHED_KEY" \
            --compatibility-prefix "$COMPATIBILITY_PREFIX" \
            --hit-type "$HIT_TYPE" \
            --restored-bytes "$RESTORED_BYTES" \
            --started-ms "$STARTED_MS" \
            --ended-ms "$ENDED_MS" \
            --save-started-ms "$SAVE_STARTED_MS" \
            --save-result "$SAVE_RESULT" \
            --path "$SCCACHE_DIR"

      - name: Require successful source compilation
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile-workspace.outcome }}
          LINT_OUTCOME: ${{ steps.lint-workspace.outcome }}
        run: |
          test "$COMPILE_OUTCOME" = success
          test "$LINT_OUTCOME" = success

      # nextest does not execute doctests, so the doc pass stays: today it is empty and costs
      # seconds, and it means a future doctest can never silently stop being run.
      - name: Test the complete workspace once
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --doc --locked

      - name: Emit authenticated source release cell
        if: inputs.emit_release_cells
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RESOLVED_REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          node scripts/codestory-release-cell-manifest.mjs produce \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$RESOLVED_REF" \
            --version "$INPUT_VERSION" \
            --cell-id source_behavior \
            --producer-workflow .github/workflows/source-proof.yml \
            --producer-job full-source-gate \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact "release-cell-prepublish-source-attempt-$GITHUB_RUN_ATTEMPT" \
            --out target/release-cells/source_behavior.json

      - name: Upload authenticated source release cell
        if: success() && inputs.emit_release_cells
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-prepublish-source-attempt-${{ github.run_attempt }}
          path: target/release-cells/source_behavior.json
          if-no-files-found: error
          retention-days: 30

  retrieval-generalization:
    name: retrieval-generalization
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generalization lint (production paths)
        run: node scripts/lint-retrieval-generalization.mjs

      - name: Generalization lint hostile matrix
        run: node --test scripts/tests/lint-retrieval-generalization.test.mjs

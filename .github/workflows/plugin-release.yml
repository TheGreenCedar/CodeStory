name: Plugin release

# The plugin fast lane: publishes a plugin whose pin names an already-published,
# already-proven CLI. No native build, signing, or hardware proof runs here, and
# no lower-tier claim is emitted for them: native claims are inherited from the
# pinned release and re-verified by digest, never re-proven.

on:
  workflow_call:
    inputs:
      version:
        description: Plugin version being released, without v prefix.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: plugin-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install workflow policy dependencies
        run: npm ci --ignore-scripts
      - name: Enforce workflow policy
        run: node .github/scripts/check-workflow-policy.mjs

  preflight:
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pinned_cli_version: ${{ steps.pin.outputs.pinned_cli_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_caller="$GITHUB_REPOSITORY/.github/workflows/auto-release.yml@refs/heads/main"
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_WORKFLOW_REF" != "$expected_caller" ]; then
            echo "::error::Plugin publication authority requires the trusted reusable-workflow caller on main."
            exit 1
          fi
          live_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$live_head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from release head $GITHUB_SHA to $live_head."
            exit 1
          fi

      - name: Validate plugin-lane version synchronization
        run: python .github/scripts/check-codestory-release.py --version "${{ inputs.version }}" --lane plugin

      - name: Refuse an existing plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists."
            exit 1
          fi

      - name: Bind the pin to the published CLI release
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const pin = JSON.parse(fs.readFileSync("plugins/codestory/cli-version.json", "utf8"));
          const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${pin.release_tag}/SHA256SUMS.txt`;
          const sums = execFileSync("curl", ["-sSL", "--fail", url], { encoding: "utf8" });
          const published = new Map(
            sums.trim().split("\n").map((line) => {
              const [digest, name] = line.trim().split(/\s+/u);
              return [name, digest];
            }),
          );
          const targets = {
            "macos-arm64": `codestory-cli-v${pin.cli_version}-macos-arm64.tar.gz`,
            "windows-x64": `codestory-cli-v${pin.cli_version}-windows-x64.zip`,
            "linux-x64": `codestory-cli-v${pin.cli_version}-linux-x64.tar.gz`,
          };
          for (const [target, asset] of Object.entries(targets)) {
            const pinned = pin.archives?.[target];
            const live = published.get(asset);
            if (!pinned || !live || pinned !== live) {
              console.error(`::error::pin digest for ${target} (${pinned}) does not match published ${asset} (${live}).`);
              process.exit(1);
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `pinned_cli_version=${pin.cli_version}\n`);
          NODE

      - name: Refuse a changed tool surface
        run: |
          set -euo pipefail
          pin_tag="$(node -p "JSON.parse(require('fs').readFileSync('plugins/codestory/cli-version.json','utf8')).release_tag")"
          git fetch -q --depth 1 origin "refs/tags/$pin_tag:refs/tags/$pin_tag"
          if ! git diff --quiet "$pin_tag" HEAD -- plugins/codestory/generated-mcp-catalog.json; then
            echo "::error::generated-mcp-catalog.json changed since $pin_tag. A changed tool surface belongs to the CLI: release through the native lane."
            exit 1
          fi

      - name: Extract plugin release notes
        run: |
          set -euo pipefail
          node .github/scripts/extract-codestory-release-notes.mjs --version "${{ inputs.version }}" > /tmp/plugin-release-notes.md
          test -s /tmp/plugin-release-notes.md

  plugin-proof:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run the plugin static suite
        run: node --test plugins/codestory/tests/plugin-static.test.mjs

      # Prove the gate below can still fail before trusting it to pass: its wait must bound
      # itself on readable non-managed metadata, and it must refuse to exit 0 without proving.
      - name: Check the pinned provision proof
        run: node --test scripts/tests/prove-plugin-pinned-provision.test.mjs

      # The launcher provisions the pinned, already-published CLI over the real
      # github_release path, which is the one place the pin's content addressing
      # is enforced. A digest drift between the pin and the published archive
      # fails here, before anything is tagged.
      - name: Provision the pinned CLI end to end
        run: node scripts/prove-plugin-pinned-provision.mjs --timeout-ms 1200000

  publish:
    needs: [preflight, plugin-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Re-verify main before tagging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$live_head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from release head $GITHUB_SHA to $live_head."
            exit 1
          fi

      - name: Publish the plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/extract-codestory-release-notes.mjs --version "${{ inputs.version }}" > /tmp/plugin-release-notes.md
          gh release create "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodeStory plugin ${{ inputs.version }}" \
            --notes-file /tmp/plugin-release-notes.md

  # The catalog is what a host installs from, so the plugin lane publishes it too. It is DELIVERY,
  # not a gate: the tag already exists when this job runs, so a failure here must leave the release
  # standing with the catalog still serving the previous one -- never fail an irreversible release.
  # The run says which of the two states it ended in, and the smoke below records that state.
  marketplace-publish:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace-publish
    outputs:
      catalog_published: ${{ steps.delivery.outputs.catalog_published }}
      marketplace_revision: ${{ steps.delivery.outputs.marketplace_revision }}
    steps:
      - uses: actions/checkout@v5

      - name: Mint a scoped marketplace token
        id: token
        continue-on-error: true
        uses: actions/create-github-app-token@67e27a7eb7db372a1c61a7f9bdab8699e9ee57f7 # v1.11.3
        with:
          app-id: ${{ secrets.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: TheGreenCedar
          repositories: AgentPluginMarketplace

      # Publication already happened, so a failure here leaves the catalog serving the previous
      # release rather than a release that does not exist. marketplace-sync.yml recovers it.
      # One attempt only: a retry loop here would hide which failure the run actually hit.
      - name: Point the catalog at the published release
        id: publish
        if: steps.token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          node .github/scripts/publish-marketplace-catalog.mjs \
            --source-repository "$GITHUB_WORKSPACE" \
            --commit "$GITHUB_SHA" \
            --version "${{ inputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

      # The only place this lane's "catalog was updated" claim is ever minted.
      - name: Record catalog delivery outcome
        id: delivery
        if: always()
        env:
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISHED_REVISION: ${{ steps.publish.outputs.marketplace_revision }}
          RECOVERY_WORKFLOW: marketplace-sync.yml
        run: |
          set -euo pipefail
          catalog_published=false
          marketplace_revision=""
          if [ "$TOKEN_OUTCOME" = "success" ] \
            && [ "$PUBLISH_OUTCOME" = "success" ] \
            && printf '%s' "$PUBLISHED_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            catalog_published=true
            marketplace_revision="$PUBLISHED_REVISION"
          fi
          echo "catalog_published=$catalog_published" >> "$GITHUB_OUTPUT"
          echo "marketplace_revision=$marketplace_revision" >> "$GITHUB_OUTPUT"
          if [ "$catalog_published" = "true" ]; then
            echo "Catalog delivery: published at $marketplace_revision." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::Catalog publication deferred (token=$TOKEN_OUTCOME publish=$PUBLISH_OUTCOME). The release stands and the catalog still serves the previous release; recover with $RECOVERY_WORKFLOW."
          echo "Catalog delivery: DEFERRED. The release is published; the catalog still serves the previous release. Recover with $RECOVERY_WORKFLOW." >> "$GITHUB_STEP_SUMMARY"

  post-publish-smoke:
    # Deliberately not gated on marketplace-publish: a deferred catalog must not suppress proof of
    # the plugin that was actually published. The delivery state is carried in, not depended on.
    if: always() && needs.preflight.result == 'success' && needs.publish.result == 'success'
    needs: [preflight, publish, marketplace-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Same two states as the native lane, decided once from the recorded publication outcome.
      # Published resolves the live catalog; deferred resolves a catalog pinned to this exact
      # published commit, because the live one still names the previous release. Neither may be
      # reached by accident: an inconsistent or unrecognized handoff stops the job.
      - name: Record catalog delivery state
        id: delivery
        shell: bash
        env:
          CATALOG_PUBLISHED: ${{ needs.marketplace-publish.outputs.catalog_published == 'true' }}
          INPUT_MARKETPLACE_REVISION: ${{ needs.marketplace-publish.outputs.marketplace_revision }}
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/codestory-marketplace-delivery/fixture"
          rm -rf "$fixture_root"
          if [ "$CATALOG_PUBLISHED" = "true" ]; then
            marketplace_source=TheGreenCedar/AgentPluginMarketplace
            marketplace_revision="$INPUT_MARKETPLACE_REVISION"
            local_fixture=false
            installer=codex_marketplace_install
            state=published
          elif [ "$CATALOG_PUBLISHED" = "false" ]; then
            if [ -n "$INPUT_MARKETPLACE_REVISION" ]; then
              echo "::error::Deferred catalog publication must not carry a live catalog revision."
              exit 1
            fi
            node .github/scripts/build-marketplace-fixture.mjs \
              --out "$fixture_root" \
              --source-repository "$GITHUB_WORKSPACE" \
              --commit "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            marketplace_source="$fixture_root"
            marketplace_revision="$(git -C "$fixture_root" rev-parse HEAD)"
            local_fixture=true
            installer=codex_marketplace_deferred_fixture
            state=deferred
          else
            echo "::error::catalog_published must be true or false, not '$CATALOG_PUBLISHED'."
            exit 1
          fi
          test "$(printf '%s' "$marketplace_revision" | wc -c | tr -d ' ')" = 40
          {
            echo "marketplace_source=$marketplace_source"
            echo "marketplace_revision=$marketplace_revision"
            echo "local_fixture=$local_fixture"
            echo "installer=$installer"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"
          if [ "$state" = "deferred" ]; then
            echo "::warning::Catalog publication was deferred for this release. This smoke proves the published plugin against a candidate-pinned catalog fixture and records installer $installer; recover the public catalog with marketplace-sync.yml."
          fi
          echo "Catalog delivery state: $state (installer $installer, catalog revision $marketplace_revision)." >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the public marketplace install path
        env:
          CODEX_CLI_VERSION: "0.144.5"
          MARKETPLACE_REVISION: ${{ steps.delivery.outputs.marketplace_revision }}
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/codestory-marketplace-postpublish"
          codex_package_root="$RUNNER_TEMP/codex-cli-${CODEX_CLI_VERSION}"
          rm -rf "$install_root"
          npm install \
            --prefix "$codex_package_root" \
            --no-audit \
            --no-fund \
            "@openai/codex@$CODEX_CLI_VERSION"
          node .github/scripts/install-codestory-marketplace-proof.mjs \
            --codex-package-root "$codex_package_root" \
            --codex-home "$install_root/codex-home" \
            --plugin-data "$install_root/codex-home/plugin-data" \
            --marketplace-source "${{ steps.delivery.outputs.marketplace_source }}" \
            --marketplace-name TheGreenCedar \
            --marketplace-revision "$MARKETPLACE_REVISION" \
            --local-fixture "${{ steps.delivery.outputs.local_fixture }}" \
            --expected-version "${{ inputs.version }}" \
            --source-repository "$GITHUB_WORKSPACE" \
            --attestation "$install_root/install-attestation-v2.json"

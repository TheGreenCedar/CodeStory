name: Post-publish release smoke

on:
  workflow_call:
    inputs:
      version:
        description: Release version to smoke, with or without a leading v.
        required: true
        type: string
      catalog_published:
        description: Whether marketplace-publish actually updated the public catalog for this release.
        required: true
        type: boolean
      catalog_delivery_state:
        description: "Recorded catalog outcome: published, deferred, or restored."
        required: true
        type: string
      marketplace_revision:
        description: Immutable published catalog revision. Empty exactly when publication was deferred.
        required: false
        default: ""
        type: string
      pre_publish_closeout_artifact:
        description: Accepted pre-publish closeout artifact from this release run.
        required: false
        default: ""
        type: string
      emit_release_cells:
        description: Emit authenticated post-publish cells for production release closeout.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Release version to smoke, with or without a leading v.
        required: true
        type: string
      catalog_published:
        description: Whether marketplace-publish actually updated the public catalog for this release.
        required: true
        type: boolean
      catalog_delivery_state:
        description: "Recorded catalog outcome: published, deferred, or restored."
        required: true
        type: choice
        options:
          - published
          - deferred
          - restored
      marketplace_revision:
        description: Immutable published catalog revision. Empty exactly when publication was deferred.
        required: false
        default: ""
        type: string
      pre_publish_closeout_artifact:
        description: Accepted pre-publish closeout artifact from this release run.
        required: false
        default: ""
        type: string
      emit_release_cells:
        description: Emit authenticated post-publish cells.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  APPLE_DEVELOPER_TEAM_ID: "PKUJNR8D6F"
  CODEX_CLI_VERSION: "0.144.5"

jobs:
  smoke:
    name: Published ${{ matrix.asset_target }} smoke
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_target: windows-x64
            runs_on: '["self-hosted","Windows","X64","codestory-vulkan"]'
            environment: windows-vulkan-proof
            backend: Vulkan
            extension: zip
          - asset_target: macos-arm64
            runs_on: '["self-hosted","macOS","ARM64","codestory-metal"]'
            environment: macos-metal-release
            backend: Metal
            extension: tar.gz
          - asset_target: linux-x64
            runs_on: '["self-hosted","Linux","X64","codestory-linux-vulkan"]'
            environment: linux-vulkan-proof
            backend: Vulkan
            extension: tar.gz
    steps:
      - name: Normalize release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::version input is required"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      # Product source remains pinned to the published tag. The proof harness comes from the
      # workflow invocation commit so a post-publication harness repair can re-prove immutable
      # release bytes without moving the tag or rebuilding the package.
      - name: Stage caller-bound closeout harness
        id: closeout-harness
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          harness_root="$RUNNER_TEMP/codestory-closeout-harness"
          rm -rf "$RUNNER_TEMP/codestory-closeout-harness"
          mkdir -p "$harness_root"
          git archive "$GITHUB_SHA" \
            .github/scripts/install-codestory-marketplace-proof.mjs \
            .github/scripts/marketplace-delivery-identity.mjs \
            .github/scripts/check-packaged-agent-proof.py \
            .github/scripts/packaged_agent_proof \
            | tar -x -C "$harness_root"
          echo "helper=$harness_root/.github/scripts/install-codestory-marketplace-proof.mjs" >> "$GITHUB_OUTPUT"
          echo "proof=$harness_root/.github/scripts/check-packaged-agent-proof.py" >> "$GITHUB_OUTPUT"
          echo "Closeout harness commit: $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      # The tag is a local name until GitHub agrees it is a published one. Every later step pins
      # the commit resolved here, so the fixture catalog, the Codex resolve, and the byte
      # comparison all name a release GitHub is actually serving -- never merely whatever tree
      # this job happens to be standing in.
      - name: Bind this smoke to the published release
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != "false" ]; then
            echo "::error::Published release $TAG is a draft."
            exit 1
          fi
          published_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          printf '%s' "$published_commit" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$published_commit" != "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" ]; then
            echo "::error::Checked-out tree is not the commit published at $TAG."
            exit 1
          fi
          echo "commit=$published_commit" >> "$GITHUB_OUTPUT"
          echo "Smoking the release published at $TAG ($published_commit)." >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
        env:
          PSExecutionPolicyPreference: Bypass

      - name: Install pinned Python on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.13.14
          python_bin="$(uv python find 3.13.14)"
          test -x "$python_bin"
          test "$("$python_bin" -c 'import platform; print(platform.python_version())')" = 3.13.14
          shim_dir="$RUNNER_TEMP/codestory-python-3.13.14"
          mkdir -p "$shim_dir"
          ln -sf "$python_bin" "$shim_dir/python"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Download accepted pre-publish closeout
        if: inputs.emit_release_cells
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.pre_publish_closeout_artifact }}
          path: target/pre-publish-closeout

      - name: Authenticate published candidate assets
        id: published-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET_TARGET: ${{ matrix.asset_target }}
          EXTENSION: ${{ matrix.extension }}
          PUBLISHED_COMMIT: ${{ steps.published.outputs.commit }}
        run: |
          set -euo pipefail
          asset="codestory-cli-v${VERSION}-${ASSET_TARGET}.${EXTENSION}"
          checksum="$asset.sha256"
          release="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          )"
          test "$(jq -r .tag_name <<<"$release")" = "$TAG"
          test "$(jq -r .draft <<<"$release")" = false
          select_asset() {
            local name="$1"
            jq \
              --arg name "$name" \
              '[.assets[] | select(.name == $name)]
                | if length == 1 then .[0] else error("expected one published release asset") end' \
              <<<"$release"
          }
          archive_asset="$(select_asset "$asset")"
          checksum_asset="$(select_asset "$checksum")"
          manifest_asset="$(select_asset SHA256SUMS.txt)"
          validate_asset() {
            local value="$1"
            [[ "$(jq -r .id <<<"$value")" =~ ^[0-9]+$ ]]
            [[ "$(jq -r .size <<<"$value")" =~ ^[0-9]+$ ]]
            [[ "$(jq -r .digest <<<"$value")" =~ ^sha256:[0-9a-f]{64}$ ]]
          }
          validate_asset "$archive_asset"
          validate_asset "$checksum_asset"
          validate_asset "$manifest_asset"
          record_dir=target/candidate-archive-record/${ASSET_TARGET}
          mkdir -p "$record_dir"
          record="$record_dir/candidate-archive-record.json"
          rm -f "$record"
          node .github/scripts/candidate-archive-store.mjs record \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$PUBLISHED_COMMIT" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --target "$ASSET_TARGET" \
            --archive-name "$asset" \
            --archive-bytes "$(jq -r .size <<<"$archive_asset")" \
            --archive-sha256 "$(jq -r .digest <<<"$archive_asset" | sed 's/^sha256://')" \
            --companion "archive_checksum|$checksum|$(jq -r .size <<<"$checksum_asset")|$(jq -r .digest <<<"$checksum_asset" | sed 's/^sha256://')" \
            --companion "checksum_manifest|SHA256SUMS.txt|$(jq -r .size <<<"$checksum_asset")|$(jq -r .digest <<<"$checksum_asset" | sed 's/^sha256://')" \
            --output "$record"
          {
            echo "archive-id=$(jq -r .id <<<"$archive_asset")"
            echo "archive-bytes=$(jq -r .size <<<"$archive_asset")"
            echo "archive-sha256=$(jq -r .digest <<<"$archive_asset" | sed 's/^sha256://')"
            echo "checksum-id=$(jq -r .id <<<"$checksum_asset")"
            echo "checksum-bytes=$(jq -r .size <<<"$checksum_asset")"
            echo "checksum-sha256=$(jq -r .digest <<<"$checksum_asset" | sed 's/^sha256://')"
            echo "manifest-id=$(jq -r .id <<<"$manifest_asset")"
            echo "manifest-bytes=$(jq -r .size <<<"$manifest_asset")"
            echo "manifest-sha256=$(jq -r .digest <<<"$manifest_asset" | sed 's/^sha256://')"
            echo "archive-name=$asset"
          } >> "$GITHUB_OUTPUT"

      - name: Restore published candidate archive from protected host
        id: candidate-cache
        shell: bash
        env:
          ASSET_TARGET: ${{ matrix.asset_target }}
          PUBLISHED_COMMIT: ${{ steps.published.outputs.commit }}
        run: |
          set -euo pipefail
          started_ns="$(python -c 'import time; print(time.monotonic_ns())')"
          record=target/candidate-archive-record/${ASSET_TARGET}/candidate-archive-record.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$PUBLISHED_COMMIT" \
            --arg source_tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg target "$ASSET_TARGET" \
            '.repository == $repository
              and .source.commit == $source_sha
              and .source.tree == $source_tree
              and .target == $target' \
            "$record" >/dev/null
          store="$RUNNER_TOOL_CACHE/codestory/candidate-archives"
          mkdir -p "$store" target
          rm -rf target/post-publish-release-assets
          restored="$(
            node .github/scripts/candidate-archive-store.mjs restore \
              --record "$record" \
              --store-root "$store" \
              --output-root target \
              --output-dir target/post-publish-release-assets
          )"
          hit="$(jq -r .hit <<<"$restored")"
          test "$hit" = true || test "$hit" = false
          finished_ns="$(python -c 'import time; print(time.monotonic_ns())')"
          elapsed_ms=$(((finished_ns - started_ns) / 1000000))
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          {
            echo "### Published candidate archive transfer"
            echo
            echo "- Protected-host cache lookup and verification: ${elapsed_ms} ms"
            echo "- Cache hit: \`$hit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download, verify, and admit published candidate on miss
        if: steps.candidate-cache.outputs.hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_TARGET: ${{ matrix.asset_target }}
          ARCHIVE_NAME: ${{ steps.published-assets.outputs.archive-name }}
          ARCHIVE_ID: ${{ steps.published-assets.outputs.archive-id }}
          ARCHIVE_BYTES: ${{ steps.published-assets.outputs.archive-bytes }}
          ARCHIVE_SHA256: ${{ steps.published-assets.outputs.archive-sha256 }}
          CHECKSUM_ID: ${{ steps.published-assets.outputs.checksum-id }}
          CHECKSUM_BYTES: ${{ steps.published-assets.outputs.checksum-bytes }}
          CHECKSUM_SHA256: ${{ steps.published-assets.outputs.checksum-sha256 }}
        run: |
          set -euo pipefail
          started_ns="$(python -c 'import time; print(time.monotonic_ns())')"
          stage=target/candidate-archive-stage/${ASSET_TARGET}
          rm -rf "$stage"
          mkdir -p "$stage"
          download_asset() {
            local id="$1"
            local name="$2"
            local expected_bytes="$3"
            local expected_sha256="$4"
            local destination="$stage/$name"
            local partial="$destination.partial"
            local url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id"
            rm -f "$destination" "$partial"
            local complete=false
            for attempt in $(seq 1 30); do
              if curl \
                --fail \
                --location \
                --silent \
                --show-error \
                --connect-timeout 30 \
                --max-time 120 \
                --continue-at - \
                --header "Accept: application/octet-stream" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --output "$partial" \
                "$url"; then
                complete=true
                break
              fi
              current_size="$(python - "$partial" <<'PY'
          import os
          import sys
          print(os.path.getsize(sys.argv[1]) if os.path.isfile(sys.argv[1]) else 0)
          PY
          )"
              test "$current_size" -le "$expected_bytes"
              if [ "$current_size" = "$expected_bytes" ]; then
                complete=true
                break
              fi
              echo "::warning title=Release asset transfer interrupted::Resuming $name at byte $current_size after attempt $attempt"
              sleep 2
            done
            test "$complete" = true
            actual="$(
              python - "$partial" <<'PY'
          import hashlib
          import os
          import sys
          path = sys.argv[1]
          with open(path, "rb") as source:
              print(f"{os.path.getsize(path)} {hashlib.file_digest(source, 'sha256').hexdigest()}")
          PY
            )"
            test "${actual%% *}" = "$expected_bytes"
            test "${actual#* }" = "$expected_sha256"
            mv "$partial" "$destination"
          }
          download_asset "$ARCHIVE_ID" "$ARCHIVE_NAME" \
            "$ARCHIVE_BYTES" "$ARCHIVE_SHA256"
          download_asset "$CHECKSUM_ID" "$ARCHIVE_NAME.sha256" \
            "$CHECKSUM_BYTES" "$CHECKSUM_SHA256"
          transfer_finished_ns="$(python -c 'import time; print(time.monotonic_ns())')"
          # package-codestory-release.py defines the candidate-local manifest as
          # the same single checksum line. The published global manifest is
          # authenticated separately below and never mutates this cache record.
          cp "$stage/$ARCHIVE_NAME.sha256" "$stage/SHA256SUMS.txt"
          record=target/candidate-archive-record/${ASSET_TARGET}/candidate-archive-record.json
          admitted="$(
            node .github/scripts/candidate-archive-store.mjs admit \
              --record "$record" \
              --input-root "$stage" \
              --store-root "$RUNNER_TOOL_CACHE/codestory/candidate-archives" \
              --output-root target \
              --output-dir target/post-publish-release-assets
          )"
          test "$(jq -r .hit <<<"$admitted")" = true || \
            test "$(jq -r .admitted <<<"$admitted")" = true
          admission_finished_ns="$(python -c 'import time; print(time.monotonic_ns())')"
          transfer_ms=$(((transfer_finished_ns - started_ns) / 1000000))
          verification_ms=$(((admission_finished_ns - transfer_finished_ns) / 1000000))
          {
            echo "- Published archive and checksum transfer: ${transfer_ms} ms"
            echo "- Payload verification and atomic admission: ${verification_ms} ms"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download authenticated published checksum manifest
        id: published-checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_ID: ${{ steps.published-assets.outputs.manifest-id }}
          MANIFEST_BYTES: ${{ steps.published-assets.outputs.manifest-bytes }}
          MANIFEST_SHA256: ${{ steps.published-assets.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          dir=target/post-publish-release-checksums
          mkdir -p "$dir"
          checksum="$dir/SHA256SUMS.txt"
          rm -f "$checksum"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$checksum" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$MANIFEST_ID"
          actual="$(
            python - "$checksum" <<'PY'
          import hashlib
          import os
          import sys
          path = sys.argv[1]
          with open(path, "rb") as source:
              print(f"{os.path.getsize(path)} {hashlib.file_digest(source, 'sha256').hexdigest()}")
          PY
          )"
          test "${actual%% *}" = "$MANIFEST_BYTES"
          test "${actual#* }" = "$MANIFEST_SHA256"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Bind materialized published asset paths
        id: asset
        shell: bash
        env:
          ASSET_NAME: ${{ steps.published-assets.outputs.archive-name }}
          PUBLISHED_CHECKSUM: ${{ steps.published-checksum.outputs.checksum }}
        run: |
          set -euo pipefail
          dir=target/post-publish-release-assets
          test -f "$dir/$ASSET_NAME"
          echo "archive=$dir/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$PUBLISHED_CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Prove packaged version, help, and stdio shape
        shell: bash
        env:
          ASSET_ARCHIVE: ${{ steps.asset.outputs.archive }}
          ASSET_CHECKSUM: ${{ steps.asset.outputs.checksum }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python .github/scripts/check-packaged-agent-proof.py
          --archive "$ASSET_ARCHIVE"
          --checksum-file "$ASSET_CHECKSUM"
          --expected-version "$RELEASE_VERSION"
          --version-only
          --out-dir "target/post-publish-version-proof/${{ matrix.asset_target }}"

      - name: Prove published macOS signature, notarization, and quarantined execution
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET_ARCHIVE: ${{ steps.asset.outputs.archive }}
        run: |
          set -euo pipefail
          proof_dir="target/post-publish-macos-signing/${{ matrix.asset_target }}"
          unpacked="$proof_dir/unpacked"
          mkdir -p "$unpacked"
          quarantine="0083;$(date +%s);CodeStory;"
          xattr -w com.apple.quarantine "$quarantine" "$ASSET_ARCHIVE"
          xattr -p com.apple.quarantine "$ASSET_ARCHIVE" \
            > "$proof_dir/archive-quarantine.txt"
          tar -xzf "$ASSET_ARCHIVE" -C "$unpacked"
          bins="$(find "$unpacked" -type f -name codestory-cli -print)"
          count="$(printf '%s\n' "$bins" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one codestory-cli in the macOS archive, found $count"
            exit 1
          fi
          bin="$bins"
          chmod +x "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -dv --verbose=4 "$bin" 2> "$proof_dir/codesign-details.txt"
          codesign -d -r- "$bin" > "$proof_dir/designated-requirement.txt" 2>&1
          grep -F "Authority=Developer ID Application:" "$proof_dir/codesign-details.txt"
          grep -E "flags=.*runtime" "$proof_dir/codesign-details.txt"
          grep -E "^TeamIdentifier=${APPLE_DEVELOPER_TEAM_ID}$" "$proof_dir/codesign-details.txt"
          grep -E "certificate leaf\\[subject\\.OU\\] = \"?${APPLE_DEVELOPER_TEAM_ID}\"?([[:space:]]|$)" \
            "$proof_dir/designated-requirement.txt"
          # Command-line tar does not propagate the download quarantine xattr,
          # so retain the archive evidence and explicitly transfer the same
          # quarantine event to the extracted executable before assessment.
          xattr -w com.apple.quarantine "$quarantine" "$bin"
          xattr -p com.apple.quarantine "$bin" > "$proof_dir/extracted-binary-quarantine.txt"
          set +e
          spctl --assess --type execute --verbose=4 "$bin" > "$proof_dir/spctl-diagnostic.txt" 2>&1
          spctl_status=$?
          set -e
          printf '%s\n' "$spctl_status" > "$proof_dir/spctl-status.txt"
          if [ "$spctl_status" -eq 0 ]; then
            grep -F "source=Notarized Developer ID" "$proof_dir/spctl-diagnostic.txt"
          else
            grep -F "does not seem to be an app" "$proof_dir/spctl-diagnostic.txt"
          fi
          "$bin" --version
          "$bin" --help >/dev/null

      - name: Run Windows installer ownership self-test
        if: matrix.asset_target == 'windows-x64'
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: "& scripts/install-codestory.ps1 -SelfTest"

      # Catalog publication is delivery, not a gate, so this smoke must run in both states -- but it
      # must never let the deferred state read as the published one. Each state gets its own catalog
      # source AND its own installer identity, and the two are decided here, once, from the caller's
      # explicit handoff. The handoff is checked both ways: published demands an immutable live
      # revision, deferred demands the absence of one.
      - name: Record catalog delivery state
        id: delivery
        shell: bash
        env:
          CATALOG_PUBLISHED: ${{ inputs.catalog_published }}
          CATALOG_DELIVERY_STATE: ${{ inputs.catalog_delivery_state }}
          INPUT_MARKETPLACE_REVISION: ${{ inputs.marketplace_revision }}
          PUBLISHED_COMMIT: ${{ steps.published.outputs.commit }}
        run: |
          set -euo pipefail
          # The commit GitHub reports for the published tag, bound in the previous step.
          published_commit="$PUBLISHED_COMMIT"
          printf '%s' "$published_commit" | grep -Eq '^[0-9a-f]{40}$'
          fixture_root="$RUNNER_TEMP/codestory-marketplace-delivery/fixture"
          rm -rf "$fixture_root"
          if [ "$CATALOG_DELIVERY_STATE" = "published" ] && [ "$CATALOG_PUBLISHED" = "true" ]; then
            marketplace_source=TheGreenCedar/AgentPluginMarketplace
            marketplace_revision="$INPUT_MARKETPLACE_REVISION"
            local_fixture=false
            installer=codex_marketplace_install
            state=published
          elif { [ "$CATALOG_DELIVERY_STATE" = "deferred" ] || [ "$CATALOG_DELIVERY_STATE" = "restored" ]; } \
            && [ "$CATALOG_PUBLISHED" = "false" ]; then
            # The public catalog still points at the previous release, so resolving against it would
            # prove the PREVIOUS release. Pin a catalog to this exact published commit instead: same
            # resolver, same pinned git-subdir source, only the catalog host differs.
            if [ -n "$INPUT_MARKETPLACE_REVISION" ]; then
              echo "::error::$CATALOG_DELIVERY_STATE catalog delivery must not carry the failed live catalog revision."
              exit 1
            fi
            node .github/scripts/build-marketplace-fixture.mjs \
              --out "$fixture_root" \
              --source-repository "$GITHUB_WORKSPACE" \
              --commit "$published_commit"
            marketplace_source="$fixture_root"
            marketplace_revision="$(git -C "$fixture_root" rev-parse HEAD)"
            local_fixture=true
            if [ "$CATALOG_DELIVERY_STATE" = "restored" ]; then
              installer=codex_marketplace_restored_fixture
            else
              installer=codex_marketplace_deferred_fixture
            fi
            state="$CATALOG_DELIVERY_STATE"
          else
            echo "::error::catalog delivery handoff is inconsistent: state=$CATALOG_DELIVERY_STATE published=$CATALOG_PUBLISHED."
            exit 1
          fi
          printf '%s' "$marketplace_revision" | grep -Eq '^[0-9a-f]{40}$'
          {
            echo "marketplace_source=$marketplace_source"
            echo "marketplace_revision=$marketplace_revision"
            echo "local_fixture=$local_fixture"
            echo "installer=$installer"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"
          if [ "$state" = "deferred" ]; then
            echo "::warning::Catalog publication was deferred for this release. This smoke proves the published assets against a candidate-pinned catalog fixture and records installer $installer; recover the public catalog with marketplace-sync.yml."
          elif [ "$state" = "restored" ]; then
            echo "::warning::The public catalog was automatically restored after its live smoke failed. This smoke proves the published assets against a candidate-pinned catalog fixture and records installer $installer."
          fi
          echo "Catalog delivery state: $state (installer $installer, catalog revision $marketplace_revision)." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the published plugin through the marketplace catalog
        id: installed
        shell: bash
        env:
          MARKETPLACE_REVISION: ${{ steps.delivery.outputs.marketplace_revision }}
          MARKETPLACE_SOURCE: ${{ steps.delivery.outputs.marketplace_source }}
          LOCAL_FIXTURE: ${{ steps.delivery.outputs.local_fixture }}
          INSTALLATION_SOURCE: ${{ steps.delivery.outputs.installer }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CLOSEOUT_HELPER: ${{ steps.closeout-harness.outputs.helper }}
        run: |
          set -euo pipefail
          case "$CLOSEOUT_HELPER" in
            */install-codestory-marketplace-proof.mjs) ;;
            *) echo "::error::Unexpected closeout helper path"; exit 1 ;;
          esac
          install_root="$RUNNER_TEMP/codestory-installed-proof"
          codex_package_root="$RUNNER_TEMP/codex-cli-${CODEX_CLI_VERSION}"
          isolated_home="$install_root/isolated-home"
          marketplace_revision="$MARKETPLACE_REVISION"
          printf '%s' "$marketplace_revision" | grep -Eq '^[0-9a-f]{40}$'
          rm -rf "$install_root"
          mkdir -p "$isolated_home"
          npm install \
            --prefix "$codex_package_root" \
            --no-audit \
            --no-fund \
            "@openai/codex@$CODEX_CLI_VERSION"
          HOME="$isolated_home" node "$CLOSEOUT_HELPER" \
            --codex-package-root "$codex_package_root" \
            --codex-home "$install_root/codex-home" \
            --plugin-data "$install_root/codex-home/plugin-data" \
            --marketplace-source "$MARKETPLACE_SOURCE" \
            --marketplace-name TheGreenCedar \
            --marketplace-revision "$marketplace_revision" \
            --local-fixture "$LOCAL_FIXTURE" \
            --installation-source "$INSTALLATION_SOURCE" \
            --expected-version "$RELEASE_VERSION" \
            --source-repository "$GITHUB_WORKSPACE" \
            --attestation "$install_root/install-attestation-v2.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prove the catalog-resolved published runtime
        env:
          CODESTORY_EMBED_ALLOW_CPU: "0"
          ASSET_ARCHIVE: ${{ steps.asset.outputs.archive }}
          ASSET_CHECKSUM: ${{ steps.asset.outputs.checksum }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          INSTALLED_PLUGIN_ROOT: ${{ steps.installed.outputs.plugin_root }}
          INSTALLED_ATTESTATION: ${{ steps.installed.outputs.attestation }}
          INSTALLED_PLUGIN_DATA: ${{ steps.installed.outputs.plugin_data }}
          CATALOG_DELIVERY_STATE: ${{ steps.delivery.outputs.state }}
          DELIVERED_INSTALLER: ${{ steps.delivery.outputs.installer }}
          EXPECTED_BACKEND: ${{ matrix.backend }}
          PROOF_HELPER: ${{ steps.closeout-harness.outputs.proof }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PROOF_HELPER" in
            */check-packaged-agent-proof.py) ;;
            *) echo "::error::Unexpected packaged proof helper path"; exit 1 ;;
          esac
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          proof_root=target/post-publish-installed-proof
          rm -rf "$proof_root"
          mkdir -p "$proof_root"
          common=(
            python "$PROOF_HELPER"
            --archive "$ASSET_ARCHIVE" \
            --checksum-file "$ASSET_CHECKSUM" \
            --expected-version "$RELEASE_VERSION" \
            --project "${{ github.workspace }}" \
            --plugin-root "$INSTALLED_PLUGIN_ROOT" \
            --plugin-handoff \
            --engine-policy accelerated \
            --expected-backend "$EXPECTED_BACKEND" \
            --proof-tier installed_runtime \
            --server-behavior-only \
            --installed-plugin-attestation "$INSTALLED_ATTESTATION" \
            --installed-plugin-data "$INSTALLED_PLUGIN_DATA" \
            --expected-source-sha "$source_sha" \
            --expected-source-tree "$source_tree" \
            --timeout-secs 3600
          )
          now_ms() {
            python -c 'import time; print(time.time_ns() // 1_000_000)'
          }
          session_1_started_ms="$(now_ms)"
          "${common[@]}" --out-dir "$proof_root/session-1"
          session_1_finished_ms="$(now_ms)"
          session_2_started_ms="$(now_ms)"
          "${common[@]}" --out-dir "$proof_root/session-2"
          session_2_finished_ms="$(now_ms)"
          archive_sha256="$(python - "$ASSET_ARCHIVE" <<'PY'
          import hashlib
          import sys
          with open(sys.argv[1], "rb") as source:
              print(hashlib.file_digest(source, "sha256").hexdigest())
          PY
          )"
          binary_sha256="$(jq -er '.package_contract.manifest.binary.sha256' "$proof_root/session-1/summary.json")"
          node .github/scripts/restart-survival-receipt.mjs \
            --session-1-summary "$proof_root/session-1/summary.json" \
            --session-2-summary "$proof_root/session-2/summary.json" \
            --install-attestation "$INSTALLED_ATTESTATION" \
            --catalog-delivery-state "$CATALOG_DELIVERY_STATE" \
            --expected-installer-identity "$DELIVERED_INSTALLER" \
            --expected-source-commit "$source_sha" \
            --expected-source-tree "$source_tree" \
            --expected-version "$RELEASE_VERSION" \
            --expected-archive-sha256 "$archive_sha256" \
            --expected-binary-sha256 "$binary_sha256" \
            --expected-backend "$EXPECTED_BACKEND" \
            --session-1-start-ms "$session_1_started_ms" \
            --session-1-finished-ms "$session_1_finished_ms" \
            --session-2-start-ms "$session_2_started_ms" \
            --session-2-finished-ms "$session_2_finished_ms" \
            --out "$proof_root/restart-survival.json"

      - name: Emit authenticated post-publish release cells
        if: inputs.emit_release_cells
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ASSET_ARCHIVE: ${{ steps.asset.outputs.archive }}
          DELIVERED_INSTALLER: ${{ steps.delivery.outputs.installer }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          archive="$ASSET_ARCHIVE"
          ledger="$(find target/pre-publish-closeout -type f -name ledger.json -print)"
          test "$(printf '%s\n' "$ledger" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          mkdir -p target/release-cells
          # The installer identity is whatever the delivery state resolved, never a literal: a
          # deferred run must not be able to sign a cell that says the public catalog served it.
          jq -n \
            --arg installer "$DELIVERED_INSTALLER" \
            --arg native_engine coderank_q8_embedded \
            '{installer: $installer, native_engine: $native_engine}' \
            > target/release-cells/installed-identity.json
          common=(
            --repo "$GITHUB_WORKSPACE"
            --expected-sha "$GITHUB_SHA"
            --version "$version"
            --producer-workflow .github/workflows/post-publish-release-smoke.yml
            --producer-job smoke
            --producer-run-id "$GITHUB_RUN_ID"
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT"
            --producer-artifact "release-cell-postpublish-${{ matrix.asset_target }}-attempt-$GITHUB_RUN_ATTEMPT"
          )
          node scripts/codestory-release-cell-manifest.mjs produce \
            "${common[@]}" \
            --cell-id "platform_support:${{ matrix.asset_target }}" \
            --archive "$archive" \
            --out "target/release-cells/platform_support-${{ matrix.asset_target }}.json"
          node scripts/codestory-release-cell-manifest.mjs produce \
            "${common[@]}" \
            --cell-id "installed_runtime_behavior:${{ matrix.asset_target }}" \
            --identity target/release-cells/installed-identity.json \
            --archive "$archive" \
            --out "target/release-cells/installed_runtime_behavior-${{ matrix.asset_target }}.json"
          node scripts/codestory-release-cell-manifest.mjs produce \
            "${common[@]}" \
            --cell-id "post_publish_bytes:${{ matrix.asset_target }}" \
            --archive "$archive" \
            --pre-publish-ledger "$ledger" \
            --out "target/release-cells/post_publish_bytes-${{ matrix.asset_target }}.json"

      - name: Upload authenticated post-publish release cells
        if: success() && inputs.emit_release_cells
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-cell-postpublish-${{ matrix.asset_target }}-attempt-${{ github.run_attempt }}
          path: |
            target/release-cells/platform_support-${{ matrix.asset_target }}.json
            target/release-cells/installed_runtime_behavior-${{ matrix.asset_target }}.json
            target/release-cells/post_publish_bytes-${{ matrix.asset_target }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload post-publish proof artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: post-publish-proof-${{ matrix.asset_target }}-${{ steps.release.outputs.version }}-attempt-${{ github.run_attempt }}
          path: |
            target/post-publish-version-proof/${{ matrix.asset_target }}
            target/post-publish-installed-proof
            target/post-publish-macos-signing/${{ matrix.asset_target }}
          if-no-files-found: error
          retention-days: 30
